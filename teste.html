  #rezumat.rosu  { background: #3a1e1c; color: #f0b4ae; }

  .cazut  { color: #f08a80; }
  .motiv  { color: #c9a894; padding-left: 2.1rem; white-space: pre-wrap; }

<body>
<h1>Personaj — teste</h1>
<div id="rezumat">se încarcă…</div>
<div id="lista"></div>
<script>
"use strict";

/* ==========================================================================
   1. MINI-CADRU DE TESTE
   ========================================================================== */

const lista = document.getElementById("lista");
let trecute = 0, cazute = 0;

function sectiune(titlu) {
  const h = document.createElement("h2");
  h.textContent = titlu;
  lista.appendChild(h);
}

function test(nume, corp) {
  const rand = document.createElement("div");
  rand.className = "test";
  try {
    corp();
    trecute++;
    rand.classList.add("trecut");
    rand.textContent = "✅ " + nume;
    lista.appendChild(rand);
  } catch (e) {
    cazute++;
    rand.classList.add("cazut");
    rand.textContent = "❌ " + nume;
    lista.appendChild(rand);
    const motiv = document.createElement("div");
    motiv.className = "motiv";
    motiv.textContent = e && e.message ? e.message : String(e);
    lista.appendChild(motiv);
  }
}

function cade(mesaj) { throw new Error(mesaj); }

function adevarat(conditie, mesaj) {
  if (!conditie) cade(mesaj || "așteptam adevărat");
}

function egal(gasit, asteptat, mesaj) {
  if (gasit !== asteptat) {
    cade((mesaj ? mesaj + " — " : "") + "așteptam " + JSON.stringify(asteptat) +
         ", am găsit " + JSON.stringify(gasit));
  }
}

function aproape(gasit, asteptat, toleranta, mesaj) {
  const tol = toleranta === undefined ? 1e-6 : toleranta;
  if (!(Math.abs(gasit - asteptat) <= tol)) {
    cade((mesaj ? mesaj + " — " : "") + "așteptam ~" + asteptat + " (±" + tol +
         "), am găsit " + gasit);
  }
}

/* ==========================================================================
   2. ALEATOR CONTROLAT
   ========================================================================== */

/* Scena folosește Math.random în mai multe locuri. Îl înlocuim cu un generator
   cu sămânță, ca toate testele să fie repetabile. */

let samanta = 1;
Math.random = function () {
  samanta = (samanta * 1103515245 + 12345) % 2147483648;
  return samanta / 2147483648;
};
function reseteazaAleatorul(s) { samanta = s || 1; }

/* ==========================================================================
   3. PÂNZA FALSĂ — ÎNREGISTREAZĂ DESENUL ÎN LOC SĂ-L AFIȘEZE
   ========================================================================== */

/* Contextul fals ține minte transformarea curentă, așa că fiecare formă e
   înregistrată în coordonatele scenei, nu în cele locale ale personajului.
   Astfel un test poate întreba „unde a ajuns nasul pe ecran". */

function inmulteste(A, B) {
  return [
    A[0] * B[0] + A[2] * B[1],
    A[1] * B[0] + A[3] * B[1],
    A[0] * B[2] + A[2] * B[3],
    A[1] * B[2] + A[3] * B[3],
    A[0] * B[4] + A[2] * B[5] + A[4],
    A[1] * B[4] + A[3] * B[5] + A[5]
  ];
}

// „18.4px system-ui, sans-serif" → 18.4
function marimeaFontului(font) {
  const m = String(font).match(/([\d.]+)px/);
  return m ? parseFloat(m[1]) : 0;
}

function creeazaPanza() {
  const desene = [];
  let m = [1, 0, 0, 1, 0, 0];
  const stiva = [];
  let puncte = [];
  let cercuri = [];

  function pct(x, y) {
    return { x: m[0] * x + m[2] * y + m[4], y: m[1] * x + m[3] * y + m[5] };
  }
  function scara() {
    return (Math.hypot(m[0], m[1]) + Math.hypot(m[2], m[3])) / 2;
  }
  function adauga(x, y) { puncte.push(pct(x, y)); }

  function stil(v) {
    return (v && v.opriri) ? { gradient: v.opriri.slice() } : v;
  }

  function inchide(op, culoare) {
    desene.push({
      op: op,
      stil: stil(culoare),
      puncte: puncte.slice(),
      cercuri: cercuri.slice(),
      limite: limite(puncte)
    });
  }

  function limite(ps) {
    if (!ps.length) return null;
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const p of ps) {
      if (p.x < x0) x0 = p.x;
      if (p.y < y0) y0 = p.y;
      if (p.x > x1) x1 = p.x;
      if (p.y > y1) y1 = p.y;
    }
    return { x0: x0, y0: y0, x1: x1, y1: y1, cx: (x0 + x1) / 2, cy: (y0 + y1) / 2 };
  }

  function gradient() {
    return { opriri: [], addColorStop: function (p, c) { this.opriri.push(c); } };
  }

  const ctx = {
    fillStyle: "#000", strokeStyle: "#000", lineWidth: 1,
    font: "", textAlign: "", lineCap: "", lineJoin: "", globalAlpha: 1,

    save: function () {
      stiva.push({
        m: m.slice(), fillStyle: ctx.fillStyle, strokeStyle: ctx.strokeStyle,
        lineWidth: ctx.lineWidth, font: ctx.font, textAlign: ctx.textAlign,
        globalAlpha: ctx.globalAlpha
      });
    },
    restore: function () {
      const s = stiva.pop();
      if (!s) return;
      m = s.m;
      ctx.fillStyle = s.fillStyle; ctx.strokeStyle = s.strokeStyle;
      ctx.lineWidth = s.lineWidth; ctx.font = s.font;
      ctx.textAlign = s.textAlign; ctx.globalAlpha = s.globalAlpha;
    },
    setTransform: function (a, b, c, d, e, f) { m = [a, b, c, d, e, f]; },
    translate: function (x, y) { m = inmulteste(m, [1, 0, 0, 1, x, y]); },
    rotate: function (a) {
      m = inmulteste(m, [Math.cos(a), Math.sin(a), -Math.sin(a), Math.cos(a), 0, 0]);
    },
    scale: function (sx, sy) { m = inmulteste(m, [sx, 0, 0, sy, 0, 0]); },

    beginPath: function () { puncte = []; cercuri = []; },
    closePath: function () {},
    moveTo: function (x, y) { adauga(x, y); },
    lineTo: function (x, y) { adauga(x, y); },
    arcTo: function (x1, y1, x2, y2) { adauga(x1, y1); adauga(x2, y2); },
    quadraticCurveTo: function (x1, y1, x2, y2) { adauga(x1, y1); adauga(x2, y2); },
    bezierCurveTo: function (x1, y1, x2, y2, x3, y3) {
      adauga(x1, y1); adauga(x2, y2); adauga(x3, y3);
    },
    rect: function (x, y, l, i) {
      adauga(x, y); adauga(x + l, y); adauga(x + l, y + i); adauga(x, y + i);
    },
    arc: function (x, y, r) {
      const c = pct(x, y);
      cercuri.push({ x: c.x, y: c.y, r: r * scara() });
      adauga(x - r, y - r); adauga(x + r, y + r);
    },
    ellipse: function (x, y, rx, ry) {
      const c = pct(x, y);
      cercuri.push({ x: c.x, y: c.y, r: rx * scara(), rx: rx * scara(), ry: ry * scara() });
      adauga(x - rx, y - ry); adauga(x + rx, y + ry);
    },

    fill: function () { inchide("fill", ctx.fillStyle); },
    stroke: function () { inchide("stroke", ctx.strokeStyle); },
    fillRect: function (x, y, l, i) {
      puncte = []; cercuri = [];
      adauga(x, y); adauga(x + l, y); adauga(x + l, y + i); adauga(x, y + i);
      inchide("fill", ctx.fillStyle);
    },
    clearRect: function () {},
    fillText: function (text, x, y) {
      const p = pct(x, y);
      desene.push({ op: "text", text: String(text), stil: stil(ctx.fillStyle),
                    font: ctx.font, marime: marimeaFontului(ctx.font) * scara(),
                    puncte: [p], cercuri: [], limite: limite([p]) });
    },
    strokeText: function () {},
    measureText: function (s) { return { width: String(s).length * 6 }; },
    clip: function () {},
    createLinearGradient: gradient,
    createRadialGradient: gradient,
    createPattern: function () { return null; }
  };

  return {
    ctx: ctx,
    desene: desene,
    goleste: function () { desene.length = 0; }
  };
}

/* ==========================================================================
   4. ÎNCĂRCAREA SCENEI DIN index.html
   ========================================================================== */

/* Nu copiem codul scenei aici: îl citim din index.html și îl rulăm cu o pânză
   falsă. Așa fișierul testat rămâne exact fișierul livrat — regula „un singur
   fișier" din SPEC nu se strică din cauza testelor.

   Simbolurile din fazele nescrise încă sunt exportate cu `typeof`, ca lipsa
   lor să pice un singur test, nu toată încărcarea. */

const EXPORTURI = `
return {

};`;

let sursaScenei = null;

async function citesteSursa() {
  const raspuns = await fetch("index.html?t=" + Date.now());
  if (!raspuns.ok) throw new Error("nu pot citi index.html: " + raspuns.status);
  const html = await raspuns.text();
  const potrivire = html.match(/<script>([\s\S]*)<\/script>/);
  if (!potrivire) throw new Error("nu am găsit blocul <script> din index.html");
  return potrivire[1];
}

// Pornește o scenă nouă, izolată: fiecare test primește starea lui.
function porneste(optiuni) {
  const o = optiuni || {};
  reseteazaAleatorul(o.samanta || 1);

  const panza = creeazaPanza();
  const element = {
    width: 0, height: 0, style: {},
    getContext: function () { return panza.ctx; },
    addEventListener: function () {},
    getBoundingClientRect: function () { return { left: 0, top: 0 }; }
  };
  const doc = { getElementById: function () { return element; } };
  const fereastra = {
    innerWidth: o.latime || 1200,
    innerHeight: o.inaltime || 800,
    devicePixelRatio: 1,
    addEventListener: function () {}
  };

  const fabrica = new Function("document", "window", "requestAnimationFrame",
                               sursaScenei + "\n" + EXPORTURI);
  const scena = fabrica(doc, fereastra, function () {});

  // Testele nu vorbesc cu Ollama decât dacă cer ele anume: altfel ar depinde de
  // ce e instalat pe calculator și cât de repede răspunde.
  if (scena.AI) scena.AI.activ = false;

  /* Intrarea cu clovnul e a primei deschideri de pagină, și ea ia primul clic.
     Testele intră direct în local, ca și cum ar fi ascultat-o deja; cine o
     încearcă anume o pornește la loc, cu `dinNouLaIntrare`. */
  if (scena.intrarea) scena.intrarea.arata = false;
  scena.dinNouLaIntrare = function () {
    scena.intrarea.arata = true;
    scena.intrarea.rand = 0;
    scena.intrarea.timp = 0;
    scena.intrarea.stingere = 0;
  };
  scena.panza = panza;
  scena.desene = panza.desene;
  scena.goleste = panza.goleste;

  // Avansează simularea cu pași fixi, ca într-un cadru real.
  scena.avanseaza = function (secunde, pas) {
    const p = pas || 1 / 60;
    let ramas = secunde;
    while (ramas > 0) {
      const dt = Math.min(p, ramas);
      scena.actualizeazaJocul(dt);
      for (const pers of scena.personaje) scena.actualizeazaPersonaj(pers, dt);
      for (const c of scena.carti) scena.actualizeazaObiect(c, dt);
      if (scena.actualizeazaParticule) scena.actualizeazaParticule(dt);
      if (scena.actualizeazaFundal) scena.actualizeazaFundal(dt);
      if (scena.actualizeazaComanda) scena.actualizeazaComanda(dt);
      ramas -= dt;
    }
  };

  // Avansează până când scena ajunge într-o stare anume (sau pică testul).
  scena.panaLaStarea = function (numeStare, maxim) {
    const limita = maxim || 40;
    let scurs = 0;
    while (scena.stare() !== numeStare) {
      scena.avanseaza(1 / 60);
      scurs += 1 / 60;
      if (scurs > limita) cade("scena nu a ajuns în starea „" + numeStare +
                               "” în " + limita + "s (a rămas în „" + scena.stare() + "”)");
    }
  };

  // Desenează un singur personaj și întoarce doar formele lui.
  scena.deseneaza = function (p, t) {
    panza.goleste();
    scena.deseneazaPersonaj(p, t || 0);
    return panza.desene.slice();
  };

  scena.personaj = function (nume) {
    const p = scena.personaje.find(function (x) { return x.nume === nume; });
    if (!p) cade("nu există personajul „" + nume + "”");
    return p;
  };

  return scena;
}

/* ==========================================================================
   5. AJUTOARE DE INTEROGARE A DESENULUI
   ========================================================================== */

// Toate culorile atinse, inclusiv opririle de gradient.
function culori(desene) {
  const set = new Set();
  for (const d of desene) {
    if (typeof d.stil === "string") set.add(d.stil.toLowerCase());
    else if (d.stil && d.stil.gradient) {
      for (const c of d.stil.gradient) set.add(String(c).toLowerCase());
    }
  }
  return set;
}

// Formele umplute cu o anumită culoare.
function formeDeCuloare(desene, culoare) {
  const c = String(culoare).toLowerCase();
  return desene.filter(function (d) {
    return d.op === "fill" && typeof d.stil === "string" && d.stil.toLowerCase() === c;
  });
}

// Cercurile umplute cu o anumită culoare.
function cercuriDeCuloare(desene, culoare) {
  const rezultat = [];
  for (const d of formeDeCuloare(desene, culoare)) {
    for (const c of d.cercuri) rezultat.push(c);
  }
  return rezultat;
}

function texte(desene) {
  return desene.filter(function (d) { return d.op === "text"; })
               .map(function (d) { return d.text; });
}

    const rept = s.personaj("Reptilianul");
    adevarat(s.dealerul, "lipsește dealerul");

    adevarat(clovn.y > s.cy() + s.masa.ry, "clovnul nu stă în fața mesei");
    adevarat(dracon.y < s.cy(), "draconianul nu stă pe latura din spate");
    adevarat(rept.x > s.cx() + s.masa.rx * 0.9, "reptilianul nu stă pe latura din dreapta");
    adevarat(s.dealerul.x < s.cx() - s.masa.rx * 0.9, "dealerul nu stă pe latura din stânga");

    // Cei trei jucători s-au mutat spre dreapta: dealerul e cel mai din stânga.
    for (const p of s.personaje) {

    const coapsa = picioare.find(function (f) {
      return f.limite.cx > s.dealerul.x &&

  test("dealerul nu e jucător: n-are mână de cărți", function () {

    adevarat(s.personaje.indexOf(s.dealerul) < 0, "dealerul s-a băgat printre jucători");
    s.panaLaStarea("gandire");
    egal(s.dealerul.mana.length, 0, "dealerului i s-au împărțit cărți");
  });
}

/* --- 6.2 Ciclul unei mâini ------------------------------------------------- */

function testeCiclu() {
  sectiune("6.2 Ciclul unei mâini");

  test("dealerul intră în joc rar, și niciodată de două ori la rând", function () {
    const s = porneste();
    let maini = 0, cuDealer = 0, douaLaRand = false, inainte = false, aVorbit = 0;
    let stareAnt = s.stare();

    // O mână ține trei levate, deci se numără împărțirile, nu levatele.
    for (let i = 0; i < 60 * 1400 && maini < 25; i++) {
      s.avanseaza(1 / 60);
      const st = s.stare();
      if (st === "gandire" && stareAnt === "impartire") {
        maini++;
        const joaca = s.dealerul.mana.length > 0;
        if (joaca) {
          cuDealer++;
          if (inainte) douaLaRand = true;
          if (s.dealerul.vorbaTimp > 0 && s.dealerul.vorba) aVorbit++;
        }
        inainte = joaca;
      }
      stareAnt = st;
    }

    adevarat(maini >= 10, "n-au apucat să treacă destule mâini: " + maini);
    adevarat(cuDealer > 0, "dealerul n-a jucat niciodată în " + maini + " mâini");
    adevarat(cuDealer < maini / 2, "joacă prea des: " + cuDealer + " mâini din " + maini);
    adevarat(!douaLaRand, "a jucat două mâini una după alta");
    egal(aVorbit, cuDealer, "de fiecare dată când intră trebuie să și spună ceva");
  });

  test("după împărțire fiecare personaj are trei cărți", function () {
    const s = porneste();
    s.panaLaStarea("gandire");
    for (const p of s.personaje) {
      egal(p.mana.length, 3, "mâna lui " + p.nume);
    }
  });

  test("fiecare pune exact o carte pe masă", function () {
    const s = porneste();
    s.panaLaStarea("castigator");
    egal(s.cartiPeMasa.length, 3, "cărți pe masă");
    for (const p of s.personaje) egal(p.mana.length, 2, "mâna lui " + p.nume);
  });

  test("o levată trece prin toate stările, iar mâna ține trei levate", function () {
    const s = porneste();
    const vazute = [];
    let anterioara = "";
    for (let i = 0; i < 60 * 300; i++) {
      s.avanseaza(1 / 60);
      if (s.stare() !== anterioara) { vazute.push(s.stare()); anterioara = s.stare(); }
      if (vazute.length >= 20) break;
    }
    const levata = "gandire → jucare → intoarcere → castigator → reactie → pauza";
    egal(vazute.slice(0, 7).join(" → "), "impartire → " + levata, "ordinea stărilor");

    // După prima levată nu se împarte din nou: se joacă a doua din aceleași mâini.
    egal(vazute.slice(7, 13).join(" → "), levata, "a doua levată");
    egal(vazute.slice(13, 19).join(" → "), levata, "a treia levată");
    egal(vazute[19], "impartire", "abia după a treia levată se împart cărți noi");
  });

  test("o mână ține exact trei levate, câte o carte din mână la fiecare", function () {
    const s = porneste();
    s.panaLaStarea("gandire");
    for (const p of s.personaje) egal(p.mana.length, 3, p.nume + " la începutul mâinii");

    for (let levata = 1; levata <= 3; levata++) {
      let paza = 0;
      while (s.stare() !== "intoarcere" && paza++ < 60 * 60) s.avanseaza(1 / 60);
      adevarat(paza < 60 * 60, "nu s-a jucat levata " + levata);
      for (const p of s.personaje) {
        egal(p.mana.length, 3 - levata, p.nume + " după levata " + levata);
      }
      egal(s.cartiPeMasa.length, s.jucatori().length, "cărți pe masă la levata " + levata);
      paza = 0;
      while (s.stare() !== "gandire" && s.stare() !== "impartire" && paza++ < 60 * 60) {
        s.avanseaza(1 / 60);
      }
    }
    egal(s.stare(), "impartire", "după a treia levată se împart cărți noi");
  });

  test("cărțile se pun cu fața în jos și se întorc toate odată", function () {
    const s = porneste();
    let paza = 0;
    while (s.cartiPeMasa.length === 0 && paza++ < 60 * 90) s.avanseaza(1 / 60);
    adevarat(s.cartiPeMasa.length > 0, "n-a jucat nimeni nicio carte");

    // Cât se joacă levata, tot ce e pe masă stă întors.
    paza = 0;
    while (s.stare() === "jucare" && paza++ < 60 * 60) {
      s.avanseaza(1 / 60);
      for (const c of s.cartiPeMasa) {
        egal(c.fataInSus, false, "o carte jucată s-a văzut înainte de vreme");
      }
    }

    egal(s.stare(), "intoarcere", "după ce au pus toți, cărțile se întorc");
    paza = 0;
    while (s.stare() === "intoarcere" && paza++ < 60 * 60) s.avanseaza(1 / 60);
    for (const c of s.cartiPeMasa) {
      egal(c.fataInSus, true, "o carte a rămas întoarsă după ce s-a dezvelit levata");
    }
  });

  test("cine ia levata deschide levata următoare", function () {
    const s = porneste();
    s.panaLaStarea("reactie", 90);
    const c = s.castigator();
    adevarat(c, "nu a fost ales niciun câștigător");
    s.panaLaStarea("jucare", 90);
    egal(s.jucatori()[s.startator()].nume, c.nume, "cine deschide levata următoare");
  });

  test("cărțile nu sar: se interpolează spre țintă", function () {
    const s = porneste();
    const c = s.creeazaCarte(0, 0, 0);
    s.mutaObiect(c, 100, 0, 0, 1, 0);
    egal(c.x, 0, "cartea nu se mișcă înainte de actualizare");
    s.actualizeazaObiect(c, 0.5);
    adevarat(c.x > 0 && c.x < 100, "la jumătatea drumului cartea e între capete, e la " + c.x);
    s.actualizeazaObiect(c, 0.6);
    aproape(c.x, 100, 1e-9, "la final cartea e exact în țintă");
  });
}

/* --- 6.3 Faza 3: clovnul --------------------------------------------------- */

/* Paleta cerută de SPEC §2.1: petice roșu / galben / turcoaz, nas rotund,
   pantofi mari. Testele fixează valorile; implementarea le respectă. */

const ROSU    = "#c9483f";
const GALBEN  = "#e8a13c";
const TURCOAZ = "#2f9d95";
const NAS     = "#e4453a";
const PANTOF  = "#3a2b3f";

function testeClovn() {
  sectiune("6.3 Faza 3 — Clovnul");

  test("clovnul respectă contractul: deseneaza(ctx, t) și reactie(tip)", function () {
    const s = porneste();
    const clovn = s.personaj("Clovnul");
    egal(typeof clovn.deseneaza, "function", "clovn.deseneaza");
    egal(typeof clovn.reactie, "function", "clovn.reactie");
  });

  test("costumul are petice în cele trei culori din spec", function () {
    const s = porneste();
    const c = culori(s.deseneaza(s.personaj("Clovnul"), 0));
    adevarat(c.has(ROSU),    "lipsește roșul " + ROSU);
    adevarat(c.has(GALBEN),  "lipsește galbenul " + GALBEN);
    adevarat(c.has(TURCOAZ), "lipsește turcoazul " + TURCOAZ);
  });

  test("are un nas rotund, mic, în zona capului", function () {
    const s = porneste();
    const clovn = s.personaj("Clovnul");
    const nasuri = cercuriDeCuloare(s.deseneaza(clovn, 0), NAS);
    egal(nasuri.length, 1, "cercuri de culoarea nasului");
    const nas = nasuri[0];
    const U = s.U();
    adevarat(nas.y < clovn.y - clovn.inaltime * U * 0.7,
             "nasul trebuie să fie sus, în dreptul capului (y=" + Math.round(nas.y) +
             ", baza personajului y=" + Math.round(clovn.y) + ")");
    adevarat(nas.r < clovn.latime * U * 0.25,
             "nasul e prea mare: rază " + Math.round(nas.r) + "px");
    // Clovnul stă cu spatele la privitor, așa că nasul se vede pe lângă obraz,
    // nu în mijloc — dar rămâne pe cap, nu undeva în scenă.
    adevarat(Math.abs(nas.x - clovn.x) < clovn.latime * U * 0.5,
             "nasul trebuie să rămână pe cap");
  });

  test("are doi pantofi mari, la bază, de o parte și de alta", function () {
    const s = porneste();
    const clovn = s.personaj("Clovnul");
    const U = s.U();
    const pantofi = formeDeCuloare(s.deseneaza(clovn, 0), PANTOF)
      .filter(function (d) { return d.limite && Math.abs(d.limite.cy - clovn.y) < 4 * U; });
    adevarat(pantofi.length >= 2, "am găsit " + pantofi.length + " forme de pantof la bază");
    const stanga = pantofi.some(function (d) { return d.limite.cx < clovn.x; });
    const dreapta = pantofi.some(function (d) { return d.limite.cx > clovn.x; });
    adevarat(stanga && dreapta, "pantofii trebuie să fie de o parte și de alta");
    const lat = Math.max.apply(null, pantofi.map(function (d) {
      return d.limite.x1 - d.limite.x0;
    }));
    adevarat(lat > 2.4 * U, "pantofii sunt mari: lățime " + (lat / U).toFixed(1) + "U");
  });

  test("clovnul desenat nu mai are numele scris deasupra", function () {
    const s = porneste();
    egal(texte(s.deseneaza(s.personaj("Clovnul"), 0)).length, 0, "texte pe clovn");
  });

  test("idle: se leagănă — desenul diferă de la un moment la altul", function () {
    const s = porneste();
    const clovn = s.personaj("Clovnul");
    const a = cercuriDeCuloare(s.deseneaza(clovn, 0), NAS)[0];
    const b = cercuriDeCuloare(s.deseneaza(clovn, 1.1), NAS)[0];
    adevarat(a && b, "nasul trebuie desenat la ambele momente");
    adevarat(Math.abs(a.x - b.x) + Math.abs(a.y - b.y) > 0.05,
             "nasul stă perfect nemișcat între t=0 și t=1.1");
  });

  test("reacția la joc: se ridică (își ascunde cărțile teatral)", function () {
    const s = porneste();
    const clovn = s.personaj("Clovnul");
    const inainte = cercuriDeCuloare(s.deseneaza(clovn, 0), NAS)[0];
    s.trimiteEveniment(clovn, "joaca");
    const dupa = cercuriDeCuloare(s.deseneaza(clovn, 0), NAS)[0];
    adevarat(Math.abs(inainte.y - dupa.y) > 0.5,
             "reacția „joaca” nu schimbă cu nimic desenul");
  });

  test("când pierde mâna, mătură cărțile de pe masă în aer", function () {
    const s = porneste();
    const clovn = s.personaj("Clovnul");

    // Ducem scena până la ultima levată, cu cărțile jucate încă pe masă.
    let paza = 0;
    while (!(s.stare() === "castigator" && s.levata() === 2) && paza++ < 60 * 300) {
      s.avanseaza(1 / 60);
    }
    adevarat(paza < 60 * 300, "n-a ajuns la ultima levată");

    const peMasa = s.cartiPeMasa.slice();
    adevarat(peMasa.length > 0, "n-a rămas nicio carte pe masă");
    const inainte = peMasa.map(function (c) { return c.y; });

    // Îl facem pe el cel mai slab al mâinii, ca să-i vină reacția.
    for (const p of s.jucatori()) p.levateLuate = p === clovn ? 0 : 2;
    s.schimbaStarea("reactie");

    for (let i = 0; i < peMasa.length; i++) {
      adevarat(peMasa[i].y1 < inainte[i] - 2 * s.U(),
               "cartea " + i + " trebuie aruncată în sus (țintă y=" +
               Math.round(peMasa[i].y1) + ", pornire y=" + Math.round(inainte[i]) + ")");
      egal(peMasa[i].proprietar, null, "cartea aruncată nu mai e în mâna nimănui");
    }
  });
}

    const b = formeDeCuloare(s.deseneaza(d, 2.3), ARIPA)[0];
    adevarat(a && b, "aripa trebuie desenată la ambele momente");
    adevarat(Math.abs(a.limite.x0 - b.limite.x0) + Math.abs(a.limite.y0 - b.limite.y0) > 0.05,
             "aripile stau perfect nemișcate între t=0 și t=2.3");

  test("scena pornește fără nicio particulă", function () {

             "draconianul trebuie să știe unde îi e botul");
    adevarat(d.guraY < d.y - d.inaltime * U * 0.6, "botul trebuie să fie sus, pe cap");
    s.trimiteEveniment(d, "pierdere");
    for (const f of s.particule) {

      adevarat(dist < 5 * U, "particulă pornită la " + (dist / U).toFixed(1) + "U de bot");

    egal(s.particule.length, 0, "particule rămase după 4 secunde");

    s.trimiteEveniment(s.personaj("Draconianul"), "castig");
    egal(s.particule.length, 0, "particule după câștig");

    egal(s.particule.length, 12, "particule cerute");
    for (const f of s.particule) {

    }

  test("focul se și desenează", function () {
    const s = porneste();
    s.aprindeFoc(100, 200, 0, 10, 1);

    s.deseneazaParticule();

             "am " + s.particule.length + " particule dar doar " + s.desene.length + " forme desenate");
  });
}

/* --- 6.5 Faza 5: reptilianul ----------------------------------------------- */

/* SPEC §2.3: umanoid-crocodil, bot lung, solzi verzi-măslinii, îmbrăcat, calm.
   Clipește rar, cu pleoapa laterală. Când câștigă, nu arată nimic. */

const SOLZI_R = "#3d6357";
const HAINA   = "#2c3b52";
const OCHI_R  = "#d8c76a";

// Raza pe orizontală a ochiului la un moment dat — cu cât e mai mică, cu atât
// pleoapa a acoperit mai mult din ochi.
function deschidereaOchiului(s, t) {
  const ochi = cercuriDeCuloare(s.deseneaza(s.personaj("Reptilianul"), t), OCHI_R);
  if (!ochi.length) cade("reptilianul n-are ochi la t=" + t);

// Media și întinderea unui șir de valori.
function medie(v) {
  let s = 0;
  for (const x of v) s += x;
  return s / v.length;
}
function intindere(v) {
  return Math.max.apply(null, v) - Math.min.apply(null, v);
}
function esantioaneGandire(s, nume, cate) {
  const p = s.personaj(nume);
  const v = [];
  for (let i = 0; i < cate; i++) v.push(s.timpDeGandire(p));
  return v;
}

// Un cadru întreg, așa cum îl vede privitorul, cu tot ce se desenează în el.
function cadruIntreg(s) {
  s.goleste();
  s.deseneazaTot();
  return s.desene;
}

// La al câtelea desen apare prima formă de culoarea dată. -1 dacă nu apare.
function candApare(desene, culoare) {
  const c = String(culoare).toLowerCase();
  for (let i = 0; i < desene.length; i++) {
    const d = desene[i];
    if (d.op === "fill" && typeof d.stil === "string" && d.stil.toLowerCase() === c) return i;
  }
  return -1;
}

function candDispare(desene, culoare) {
  const c = String(culoare).toLowerCase();
  for (let i = desene.length - 1; i >= 0; i--) {
    const d = desene[i];
    if (d.op === "fill" && typeof d.stil === "string" && d.stil.toLowerCase() === c) return i;
  }
  return -1;
}

// Cheamă chelnerul apăsând pe un personaj și așteaptă până se deschide meniul.
function cheamaChelnerul(s, nume) {
  const p = s.personaj(nume);
  s.apasa(p.x, p.y - p.inaltime * s.U() * 0.5);
  for (let i = 0; i < 60 * 40 && !s.meniu.deschis; i++) s.avanseaza(1 / 60);
  adevarat(s.meniu.deschis, "chelnerul n-a ajuns niciodată la masă");
  return p;
}

// Apasă pe opțiunea cu numele dat din meniul deschis.
function alegeDinMeniu(s, id) {
  const rand = s.meniu.randuri.find(function (r) { return r.optiune.id === id; });
  if (!rand) cade("nu există opțiunea „" + id + "” în meniu");
  s.apasa((rand.x0 + rand.x1) / 2, (rand.y0 + rand.y1) / 2);
}

// Bifează felurile date și încheie comanda cu „doar atât".
function comandaDinMeniu(s) {
  for (let i = 1; i < arguments.length; i++) alegeDinMeniu(s, arguments[i]);
  alegeDinMeniu(s, "gata");
}

// Așteaptă până se golește tava și chelnerul își ia lumea în cap.
function panaAjungePeMasa(s) {
  let paza = 0;
  while (s.comanda.stare !== "nimic" && s.comanda.stare !== "alege" && paza++ < 60 * 120) {
    s.avanseaza(1 / 60);
  }
  adevarat(paza < 60 * 120, "comanda n-a ajuns niciodată pe masă");
}

// Pune de-a gata ceva pe masă, fără să mai treacă prin chelner.
function punePeMasa(s, id, nivel) {
  const o = s.meniu.optiuni.find(function (x) { return x.id === id; });
  if (!o) cade("nu există felul „" + id + "”");
  const p = s.personaj("Clovnul");
  const obiect = {
    pentru: p, optiune: o, nivel: nivel === undefined ? 1 : nivel,
    tip: o.fel === "baut" ? "pahar" : "farfurie",
    x: s.cx(), y: s.cy(), cronometru: 5
  };
  // Ca la comandă adevărată: întâi îi găsim loc, abia apoi ajunge pe masă.
  s.asazaPeMasa(obiect);
  s.pahare.push(obiect);
  return obiect;
}

function culorileUnuiFel(s, id) {
  s.pahare.length = 0;
  punePeMasa(s, id);
  s.goleste();
  s.deseneazaPahare();
  return culori(s.desene);
}

// Avansează până îți vine rândul să pui o carte.
function panaLaRandulTau(s) {
  let paza = 0;
  while (!s.asteaptaJucator() && paza++ < 60 * 90) s.avanseaza(1 / 60);
  adevarat(s.asteaptaJucator(), "nu mi-a venit niciodată rândul");
}

// Avansează până e rândul personajului cu numele dat.
function panaLaRandulLui(s, nume) {
  let paza = 0;
  while ((!s.laRand() || s.laRand().nume !== nume) && paza++ < 60 * 90) {
    if (s.asteaptaJucator()) {
      const eu = s.personaje.find(function (p) { return Math.sin(p.unghi) >= 0; });
      s.apasa(eu.mana[0].x, eu.mana[0].y);
    }
    s.avanseaza(1 / 60);
  }
  adevarat(s.laRand() && s.laRand().nume === nume, "n-a ajuns la rândul lui " + nume);
}

/* --- 6.20 Faza 11.4–11.5: cinstea și ce le-a intrat în burtă -------------- */

function testeCinsteaSiBetia() {

  // Duce partida până se încheie o mână întreagă, adică până se dau reacțiile mari.
  function panaLaSfarsitDeMana(s) {
    let paza = 0;
    while (!s.castigatorulMainii() && paza++ < 60 * 200) s.avanseaza(1 / 60);
    return !!s.castigatorulMainii();
  }

  test("cine ia cele mai puține levate face cinste, fără să apeși nimic", function () {
    const s = porneste();
    adevarat(s.faceCinste, "nu face nimeni cinste niciodată");
    egal(s.pahare.length, 0, "e ceva pe masă înainte să comande cineva");

    adevarat(panaLaSfarsitDeMana(s), "nu s-a încheiat nicio mână");
    // De la sfârșitul mâinii încolo, comanda pleacă singură și ajunge pe masă.
    let paza = 0;
    while (!s.pahare.length && paza++ < 60 * 200) s.avanseaza(1 / 60);
    adevarat(s.pahare.length > 0, "cel care a pierdut n-a dat nimic la masă");
    egal(s.meniu.deschis, false, "i-a întins meniul, deși știe ce dă");
  });

  test("cinstea e un rând pentru toată masa, nu un pahar pentru el", function () {
    const s = porneste();
    panaLaSfarsitDeMana(s);
    let paza = 0;
    while (!s.pahare.length && paza++ < 60 * 200) s.avanseaza(1 / 60);

    const jucatori = s.jucatori();
    const auPrimit = new Set(s.pahare.map(function (o) { return o.pentru; }));
    for (const p of jucatori) {
      adevarat(auPrimit.has(p), p.nume + " a rămas fără nimic în față");
    }
    // Toți au primit același lucru: e un rând, nu comenzi separate.
    const feluri = new Set(s.pahare.map(function (o) { return o.optiune.id; }));
    egal(feluri.size, 1, "a comandat lucruri diferite, nu un rând");
  });

  test("fiecare dă ce bea el", function () {
    const s = porneste();
    adevarat(s.CINSTEA, "nu se știe cine ce dă");
    for (const p of s.personaje.concat([s.dealerul])) {
      const id = s.CINSTEA[p.nume];
      adevarat(id, p.nume + " n-are ce da la masă");
      adevarat(s.felulDinMeniu(id), p.nume + " dă ceva ce nu e în meniu: " + id);
    }
    egal(s.CINSTEA["Draconianul"], "bere", "draconianul dă altceva decât bere");
    egal(s.CINSTEA["Reptilianul"], "vin", "reptilianul dă altceva decât vin");
  });

  test("nu se bagă peste comanda ta", function () {
    const s = porneste();
    const draconianul = s.personaje[1];

    s.meniu.deschis = true;                  // ai meniul în față
    egal(s.faceCinste(draconianul), false, "a comandat peste meniul tău");
    s.meniu.deschis = false;

    s.comanda.stare = "seFace";              // e deja ceva pe drum
    egal(s.faceCinste(draconianul), false, "a comandat peste comanda de pe drum");
    s.comanda.stare = "nimic";

    egal(s.faceCinste(draconianul), true, "n-a vrut să facă cinste nici pe liber");
    adevarat(draconianul.vorba, "a comandat pe tăcute, fără să zică nimic");
  });

  test("un pahar băut se simte, un suc nu", function () {
    const s = porneste();
    const draconianul = s.personaje[1];
    adevarat(s.aGolit, "nu se ține minte ce-a băut nimeni");

    const berea = s.felulDinMeniu("bere"), sucul = s.felulDinMeniu("suc");
    const treaz = s.haosulLui(draconianul);

    s.aGolit(draconianul, sucul);
    egal(s.haosulLui(draconianul), treaz, "sucul l-a amețit");

    s.aGolit(draconianul, berea);
    adevarat(s.haosulLui(draconianul) > treaz, "berea nu i-a făcut nimic");
    adevarat(s.betia(draconianul) > 0, "după o bere joacă la fel de cuminte");
  });

  test("după câteva pahare joacă mai la nimereală", function () {
    const s = porneste();
    const reptilianul = s.personaje[2];      // cel mai calculat de la masă
    const berea = s.felulDinMeniu("bere");

    // Treaz, își drămuiește mâna: la aceeași mână, aceeași carte de fiecare dată.
    reptilianul.mana = [{ valoare: 5 }, { valoare: 7 }, { valoare: 10 }];
    const treaz = new Set();
    for (let i = 0; i < 30; i++) treaz.add(s.alegeDinCod(reptilianul));
    egal(treaz.size, 1, "reptilianul treaz nu joacă de fiecare dată la fel");

    for (let i = 0; i < 3; i++) s.aGolit(reptilianul, berea);
    const baut = new Set();
    for (let i = 0; i < 60; i++) baut.add(s.alegeDinCod(reptilianul));
    adevarat(baut.size > 1, "trei beri și tot joacă la fel de calculat");
  });

  test("cu burta plină se gândește mai mult", function () {
    const s = porneste();
    const reptilianul = s.personaje[2];
    const micii = s.felulDinMeniu("mici");
    const flamand = s.gandireaLui(reptilianul);

    s.aGolit(reptilianul, micii);
    adevarat(s.gandireaLui(reptilianul) > flamand, "mâncarea nu l-a îngreunat deloc");

    // Și se vede în cât stă pe gânduri, nu doar în cifra de dedesubt.
    let sat = 0, gol = 0;
    for (let i = 0; i < 200; i++) sat += s.timpDeGandire(reptilianul);
    reptilianul.mancate = 0;
    for (let i = 0; i < 200; i++) gol += s.timpDeGandire(reptilianul);
    adevarat(sat > gol, "sătul se gândește la fel de repede ca flămând");
  });

  test("beția trece, foamea se face iar", function () {
    const s = porneste();
    const draconianul = s.personaje[1];
    // Cu meniul în față nu se face cinste la masă, deci nu-i vine altă bere din
    // urmă cât îl așteptăm să se trezească.
    s.meniu.deschis = true;
    s.aGolit(draconianul, s.felulDinMeniu("bere"));
    s.aGolit(draconianul, s.felulDinMeniu("mici"));
    const ametit = s.haosulLui(draconianul), satul = s.gandireaLui(draconianul);

    s.avanseaza(200);
    adevarat(s.haosulLui(draconianul) < ametit, "a rămas băut pentru totdeauna");
    adevarat(s.gandireaLui(draconianul) < satul, "a rămas sătul pentru totdeauna");
    egal(s.betia(draconianul), 0, "nu s-a trezit de tot nici după atâta timp");
  });

  test("oricât ar bea, tot rămâne el", function () {
    const s = porneste();
    const reptilianul = s.personaje[2];
    for (let i = 0; i < 20; i++) s.aGolit(reptilianul, s.felulDinMeniu("bere"));
    adevarat(s.haosulLui(reptilianul) <= 1, "haosul a ieșit din scară");
    adevarat(s.betia(reptilianul) < 0.5,
             "băut de tot, joacă doar la nimereală: " + s.betia(reptilianul));
    adevarat(s.timpDeGandire(reptilianul) > 0, "se gândește un timp negativ");
  });
}

    const s = porneste();
    adevarat(s.LOCURI_IN_FATA >= 2 && s.LOCURI_IN_FATA <= 5,
             "numărul de locuri nu e omenesc: " + s.LOCURI_IN_FATA);
    const draconianul = s.personaje[1];

    s.deschideMeniul(draconianul);
    for (const id of ["bere", "mici", "ciorba", "cartofi", "suc"]) {
      s.bifeaza(s.felulDinMeniu(id));
    }
    egal(s.meniu.alese.length, s.LOCURI_IN_FATA,
         "a lăsat să se bifeze mai mult decât încape");
  });

  test("chelnerul spune de ce nu ia comanda", function () {
    const s = porneste();
    const draconianul = s.personaje[1];
    s.deschideMeniul(draconianul);
    for (const id of ["bere", "mici", "ciorba"]) s.bifeaza(s.felulDinMeniu(id));

    const chelnerul = s.vorbitori().find(function (p) { return p.nume === "Chelnerul"; });
    chelnerul.vorba = null;
    s.bifeaza(s.felulDinMeniu("papanasi"));
    adevarat(chelnerul.vorba, "a refuzat în tăcere, ca un chelner stricat");
  });

  test("ce nu încape se vede stins în meniu, dinainte să apeși", function () {
    const s = porneste();
    const draconianul = s.personaje[1];
    s.deschideMeniul(draconianul);
    adevarat(s.incapePeMasa(s.felulDinMeniu("bere"), draconianul),
             "nu încape nimic pe masa goală");
    for (const id of ["bere", "mici", "ciorba"]) s.bifeaza(s.felulDinMeniu(id));
    egal(s.incapePeMasa(s.felulDinMeniu("suc"), draconianul), false,
         "tot mai crede că are loc");
  });

  test("ce e pe drum ține locul: nu ceri de două ori ct n-a ajuns nimic", function () {
    const s = porneste();
    const draconianul = s.personaje[1];
    s.deschideMeniul(draconianul);
    s.bifeaza(s.felulDinMeniu("bere"));
    s.bifeaza(s.felulDinMeniu("mici"));
    s.alege(s.felulDinMeniu("gata"));            // au plecat la bar, nu-s încă pe masă

    egal(s.cateAreInFata(draconianul), 0, "au ajuns pe masă pe loc");
    s.deschideMeniul(draconianul);
    s.bifeaza(s.felulDinMeniu("ciorba"));
    s.bifeaza(s.felulDinMeniu("suc"));
    egal(s.meniu.alese.length, 1, "a uitat de ce e pe tavă și a mai luat o comandă");
  });

  test("ajunse pe masă, tot atâtea sunt", function () {
    const s = porneste();
    const draconianul = s.personaje[1];
    const cate = comandaPentru(s, draconianul, ["bere", "mici", "ciorba", "cartofi"]);
    egal(cate, s.LOCURI_IN_FATA, "a trimis la bar mai mult decât încape");
    egal(s.cateAreInFata(draconianul), s.LOCURI_IN_FATA,
         "pe masă a ajuns altceva decât s-a comandat");
    egal(s.areLocInFata(draconianul), false, "masa lui e plină și tot crede că are loc");
  });

  test("sticlele sunt ale mesei: nu se strâng patru deodată", function () {
    const s = porneste();
    adevarat(s.STICLE_PE_MASA >= 1 && s.STICLE_PE_MASA <= 3,
             "prea multe sticle încap în mijloc: " + s.STICLE_PE_MASA);

    // Un rând de vin pentru toată masa: pahar fiecăruia, dar nu și sticlă.
    const reptilianul = s.personaje[2];
    const vinul = s.felulDinMeniu("vin");
    const masa = s.jucatori().slice();
    s.trimiteLaBar(reptilianul, masa.map(function () { return vinul; }), masa);
    let paza = 0;
    while (s.comanda.stare !== "nimic" && paza++ < 60 * 300) s.avanseaza(1 / 60);

    adevarat(s.sticlePeMasa() <= s.STICLE_PE_MASA,
             "s-au adunat " + s.sticlePeMasa() + " sticle pe masă");
    const pahare = s.pahare.filter(function (o) { return o.tip === "pahar"; });
    egal(pahare.length, masa.length, "n-a primit fiecare paharul lui");
  });

  test("torni din sticla mesei în paharul tău", function () {
    const s = porneste();
    const reptilianul = s.personaje[2];
    comandaPentru(s, reptilianul, ["vin"]);
    const sticla = s.pahare.find(function (o) { return o.tip === "sticla"; });
    adevarat(sticla, "n-a venit nicio sticlă");

    // Paharul clovnului, adică al tău, pus și el pe masă.
    const alTau = { pentru: s.personaje[0], optiune: s.felulDinMeniu("vin"),
                    tip: "pahar", nivel: 0, cronometru: 1e9 };
    s.pahare.push(alTau);
    s.toarnaDinSticla(sticla);
    egal(alTau.nivel, 1, "a turnat în paharul altuia, deși eu am apăsat pe sticlă");
  });

  test("cinstea nu se face dacă n-au toți unde pune", function () {
    const s = porneste();
    const draconianul = s.personaje[1];
    for (const p of s.jucatori()) {
      for (let i = 0; i < s.LOCURI_IN_FATA; i++) {
        s.pahare.push({ pentru: p, optiune: s.felulDinMeniu("bere"), tip: "pahar",
                        nivel: 1, cronometru: 1e9 });
      }
    }
    egal(s.faceCinste(draconianul), false, "a mai dat un rând pe masa plină");
  });

  test("masa se golește, și atunci se poate iar", function () {
    const s = porneste();
    const draconianul = s.personaje[1];
    comandaPentru(s, draconianul, ["bere", "suc", "ciorba"]);
    egal(s.areLocInFata(draconianul), false, "n-a rămas plină după trei feluri");

    // Se bea, se mănâncă, iar chelnerul strânge ce s-a golit.
    let paza = 0;
    while (s.cateAreInFata(draconianul) > 0 && paza++ < 60 * 900) s.avanseaza(1 / 60);
    egal(s.cateAreInFata(draconianul), 0, "nu s-a golit masa niciodată");
    egal(s.areLocInFata(draconianul), true, "s-a golit masa, dar tot nu se poate comanda");
  });
}

/* --- 6.24 Faza 22: intrarea in local -------------------------------------- */

function testeIntrarea() {
  sectiune("6.24 Faza 22 — Intrarea în local");

  // Lasă clovnul să-și spună toate vorbele, cu răgazul lor.
  function panaTermina(s) {
    let paza = 0;
    while (s.intrarea.arata && paza++ < 60 * 200) s.actualizeazaIntrarea(1 / 60);
    return paza < 60 * 200;
  }

  test("la deschiderea paginii, clovnul e în față", function () {
    const s = porneste();
    adevarat(s.intrarea, "nu întâmpină nimeni pe nimeni");
    s.dinNouLaIntrare();
    egal(s.intrarea.arata, true, "scena începe fără nicio vorbă de bun venit");
    egal(s.intrarea.rand, 0, "începe de la mijlocul poveștii");
  });

  test("spune toate vorbele, în ordinea lor", function () {
    const s = porneste();
    const asteptate = [
      "Bună! Eu sunt clovnul! Eu sunt tu!",
      "Hai să-ți zic ce poți face în acest joculeț!",
      "Dacă apeși pe mine sau pe draconian sau pe reptilian, poți comanda ceva!",
      "Eu joc cărți și astea sunt regulile: cartea cu clovn bate zecele, dar " +
        "celelalte cărți bat cartea cu clovn! Cea mai mare carte câștigă!",
      "Poți vorbi și cu ceilalți, dar nu fi rău, ceilalți se pot enerva pe tine!",
      "Eu o să intru la o levată cu prietenii mei, să ai o experiență cât mai bună!"
    ];
    egal(s.VORBELE_INTRARII.length, asteptate.length, "s-au schimbat câte vorbe spune");
    asteptate.forEach(function (vorba, i) {
      egal(s.VORBELE_INTRARII[i], vorba, "vorba a " + (i + 1) + "-a e alta");
    });
  });

  test("trece singur de la o vorbă la alta, fără să apeși nimic", function () {
    const s = porneste();
    s.dinNouLaIntrare();
    s.actualizeazaIntrarea(s.catTineVorba(s.VORBELE_INTRARII[0]) + 0.01);
    egal(s.intrarea.rand, 1, "a rămas la prima vorbă");
    adevarat(s.intrarea.arata, "s-a închis după prima vorbă");
  });

  test("vorba lungă stă pe ecran mai mult decât cea scurtă", function () {
    const s = porneste();
    const scurta = s.catTineVorba(s.VORBELE_INTRARII[0]);
    const lunga = s.catTineVorba(s.VORBELE_INTRARII[3]);
    adevarat(lunga > scurta, "toate vorbele stau la fel de puțin");
    adevarat(scurta > 2, "prima vorbă trece prea repede ca s-o citești");
  });

  test("se închide singur după ultima vorbă, și nu se mai întoarce", function () {
    const s = porneste();
    s.dinNouLaIntrare();
    adevarat(panaTermina(s), "n-a terminat niciodată de vorbit");
    egal(s.intrarea.arata, false, "a rămas peste joc");

    s.actualizeazaIntrarea(60);
    egal(s.intrarea.arata, false, "s-a întors singur peste partidă");
  });

  // Apasă pe butonul cerut, unde l-a desenat panoul.
  function apasaButonul(s, ce) {
    s.goleste();
    s.deseneazaIntrarea();
    const b = s.intrarea.butoane.find(function (x) { return x.ce === ce; });
    if (!b) return false;
    s.apasa((b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2);
    return true;
  }

  test("clicul pe panou nu sare peste vorbă: numai butoanele fac ceva", function () {
    const s = porneste();
    s.dinNouLaIntrare();
    s.deseneazaIntrarea();
    s.apasa(s.W() / 2, s.H() / 2);              // în mijlocul panoului, pe clovn
    egal(s.intrarea.rand, 0, "un clic oarecare a sărit peste o vorbă");
    egal(s.meniu.deschis, false, "clicul a chemat chelnerul peste intrare");
    egal(s.comanda.stare, "nimic", "clicul a comandat ceva peste intrare");
  });

  test("butonul „înainte” duce la vorba următoare", function () {
    const s = porneste();
    s.dinNouLaIntrare();
    adevarat(apasaButonul(s, "inainte"), "nu există niciun buton de înainte");
    egal(s.intrarea.rand, 1, "butonul n-a dus nicăieri");
  });

  test("butonul „înapoi” apare abia când ai la ce te întoarce", function () {
    const s = porneste();
    s.dinNouLaIntrare();
    s.deseneazaIntrarea();
    adevarat(!s.intrarea.butoane.some(function (b) { return b.ce === "inapoi"; }),
             "de la prima vorbă se poate da înapoi, deși n-are unde");

    s.maiDepartePeIntrare();
    s.deseneazaIntrarea();
    adevarat(s.intrarea.butoane.some(function (b) { return b.ce === "inapoi"; }),
             "de la a doua vorbă tot nu se poate da înapoi");
  });

  test("butonul „înapoi” te duce la vorba dinainte", function () {
    const s = porneste();
    s.dinNouLaIntrare();
    s.maiDepartePeIntrare();
    s.maiDepartePeIntrare();
    egal(s.intrarea.rand, 2, "n-a înaintat cum trebuie");

    apasaButonul(s, "inapoi");
    egal(s.intrarea.rand, 1, "butonul de înapoi n-a dus înapoi");
    apasaButonul(s, "inapoi");
    egal(s.intrarea.rand, 0, "nu se poate ajunge înapoi la prima vorbă");
    apasaButonul(s, "inapoi");
    egal(s.intrarea.rand, 0, "a dat înapoi de pe prima vorbă");
  });

  test("butoanele stau în dreapta jos a panoului", function () {
    const s = porneste();
    s.dinNouLaIntrare();
    s.maiDepartePeIntrare();
    s.deseneazaIntrarea();

    for (const b of s.intrarea.butoane) {
      adevarat(b.x0 > s.W() / 2, b.ce + " nu stă în jumătatea din dreapta");
      adevarat(b.y0 > s.H() / 2, b.ce + " nu stă în jumătatea de jos");
    }
    const inainte = s.intrarea.butoane.find(function (b) { return b.ce === "inainte"; });
    const inapoi = s.intrarea.butoane.find(function (b) { return b.ce === "inapoi"; });
    adevarat(inainte.x0 > inapoi.x1, "„înainte” nu e cel mai din dreapta");
  });

  test("de pe ultima vorbă, „înainte” închide panoul", function () {
    const s = porneste();
    s.dinNouLaIntrare();
    for (let i = 0; i < s.VORBELE_INTRARII.length - 1; i++) s.maiDepartePeIntrare();
    egal(s.intrarea.rand, s.VORBELE_INTRARII.length - 1, "n-a ajuns la ultima vorbă");

    apasaButonul(s, "inainte");
    s.actualizeazaIntrarea(2);
    egal(s.intrarea.arata, false, "ultimul «înainte» n-a închis panoul");
  });

  test("panoul e pătrat, cu clovnul și vorba lui în el", function () {
    const s = porneste();
    s.dinNouLaIntrare();
    s.goleste();
    s.deseneazaIntrarea();

    const scrise = s.desene.filter(function (d) { return d.op === "text"; });
    adevarat(scrise.length > 0, "panoul e gol, fără nicio vorbă");
    adevarat(scrise.some(function (d) { return d.text.indexOf("clovnul") >= 0; }),
             "nu scrie nicăieri cine e");

    // Panoul: o formă mare, pătrată, în mijlocul ecranului.
    const patrate = s.desene.filter(function (d) {
      if (!d.limite) return false;
      const lat = d.limite.x1 - d.limite.x0, inalt = d.limite.y1 - d.limite.y0;
      return lat > 30 * s.U() && Math.abs(lat - inalt) < 2 * s.U();
    });
    adevarat(patrate.length > 0, "panoul nu e pătrat");
    adevarat(Math.abs(patrate[0].limite.cx - s.W() / 2) < 2 * s.U(),
             "panoul nu stă în mijloc");
  });

  test("clovnul din panou e cu fața la tine: are ochi, nas și gură", function () {
    const s = porneste();
    s.dinNouLaIntrare();
    s.goleste();
    s.deseneazaIntrarea();

    // Nasul roșu, rotund, undeva în dreptul capului.
    const nasuri = s.desene.filter(function (d) {
      return d.stil === "#e4453a" && d.limite &&
             (d.limite.x1 - d.limite.x0) < 6 * s.U();
    });
    adevarat(nasuri.length > 0, "n-are nas");

    // Ochii: două pete albe, una lângă alta, la aceeași înălțime.
    const albe = s.desene.filter(function (d) { return d.stil === "#f6f1e6" && d.limite; });
    adevarat(albe.length >= 2, "n-are ochi");
    adevarat(Math.abs(albe[0].limite.cy - albe[1].limite.cy) < 0.6 * s.U(),
             "ochii nu sunt la aceeași înălțime");
    adevarat(albe[0].limite.cx !== albe[1].limite.cx, "ochii sunt unul peste altul");

    // Gura: o linie trasă, nu umplută.
    const trase = s.desene.filter(function (d) { return d.op === "stroke" && d.stil === "#8a2f2a"; });
    adevarat(trase.length > 0, "n-are gură");
  });

  test("clovnul nu acoperă ce spune", function () {
    const s = porneste();
    s.dinNouLaIntrare();
    s.maiDepartePeIntrare();
    s.maiDepartePeIntrare();
    s.maiDepartePeIntrare();                   // vorba cea mai lungă, pe trei rânduri
    s.goleste();
    s.deseneazaIntrarea();

    const scrise = s.desene.filter(function (d) {
      return d.op === "text" && d.limite &&
             d.text.indexOf("nainte") < 0 && d.text.indexOf("napoi") < 0;
    });
    adevarat(scrise.length > 1, "vorba lungă n-a fost scrisă pe mai multe rânduri");
    const celMaiDeJos = Math.max.apply(null, scrise.map(function (d) { return d.limite.cy; }));

    // Vârful pălăriei: turcoazul cel mai de sus dintre desenele lui.
    const palaria = s.desene.filter(function (d) {
      return d.stil === "#2f9d95" && d.limite;
    });
    adevarat(palaria.length > 0, "n-are pălărie");
    const varf = Math.min.apply(null, palaria.map(function (d) { return d.limite.y0; }));
    adevarat(varf > celMaiDeJos, "pălăria intră peste text");
  });

  test("vorba lungă se rupe în rânduri, ca să încapă", function () {
    const s = porneste();
    const randuri = s.rupeInRanduri(s.VORBELE_INTRARII[3], 40 * s.U());
    adevarat(randuri.length > 1, "vorba lungă a rămas pe un singur rând");
    egal(randuri.join(" "), s.VORBELE_INTRARII[3], "s-a pierdut ceva la rupere");
  });

  test("după ce se închide, nu mai desenează nimic peste joc", function () {
    const s = porneste();
    s.dinNouLaIntrare();
    panaTermina(s);
    s.goleste();
    s.deseneazaIntrarea();
    egal(s.desene.length, 0, "a rămas ceva desenat peste partidă");
  });
}
