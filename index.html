/* Ciclul, la nesfârșit:
     impartire → [ gandire → jucare → intoarcere → castigator → reactie →
                   pauza ] × 3 → impartire

   Din Faza 10 mâna nu se mai joacă de la sine: cărțile au valori, cea mai mare
   ia mâna, iar cărțile clovnului le pui tu.

   Din Faza 11 o mână ține trei levate, nu una: se împart trei cărți și se joacă
   toate trei, una pe levată, abia apoi se împart altele. De aici vine singura
   întrebare care contează — dau zecele acum, sau îl țin? Cărțile se pun cu fața
   în jos și se întorc toate odată, ca să nu știe nimeni ce vine. */

const CARTI_IN_MANA = 3;
const RABDARE = 12;        // câte secunde te așteaptă masa până joacă el în locul tău

/* Adversarii pot fi conduși de un model local prin Ollama. Regula de aur: dacă
   modelul tace, întârzie sau spune o prostie, partida merge mai departe cu
   judecata scrisă în cod. Nimeni nu trebuie să instaleze nimic. */
const AI = {
  url: "http://localhost:11434/api/chat",
  model: "gemma4:e2b",
  activ: true,
  asteptare: 2500,

  intreaba: function (p, situatie, gata) {
    let raspuns = false;
    const raspunde = function (valoare) {
      if (raspuns) return;
      raspuns = true;
      gata(valoare);
    };
    setTimeout(function () { raspunde(null); }, this.asteptare);

    fetch(this.url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: this.model,
        stream: false,
        think: false,              // altfel se gândește zeci de secunde
        options: { temperature: 0.6 + (p.haos || 0), num_predict: 8 },
        messages: [
          { role: "system", content: p.promptSistem },
          { role: "user", content: situatie }
        ]
      })
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        const text = String((j && j.message && j.message.content) || "");
        const numar = text.match(/\d+/);
        raspunde(numar ? parseInt(numar[0], 10) : null);
      })
      .catch(function () { raspunde(null); });
  },

  /* Vorba cu cine vrei tu, din fereastra de chat. Modelul primește firea celui
     întrebat și ultimele replici, ca să știe unde a rămas. Dacă tace sau
     întârzie, cel întrebat răspunde din ce are scris în firea lui — și nu se
     vede nicio eroare, doar un răspuns mai scurt. */
  vorbesteCu: function (p, intrebare, istoric, ce, gata) {
    const fire = FIRI[p.nume];
    const despre = ce && ce.despre;
    let raspuns = false;
    const raspunde = function (text) {
      if (raspuns) return;
      raspuns = true;
      gata(text);
    };
    if (!this.activ || !fire || !fire.fire) { raspunde(null); return; }
    setTimeout(function () { raspunde(null); }, 6000);

    /* Când ești tu cel întrebat, ultimul rând din fir e chiar întrebarea de acum,
       deci n-are rost s-o citești de două ori. Ceilalți vin peste o discuție
       care merge deja, așa că ei o primesc întreagă. */
    const inainte = (ce && ce.fel && ce.fel !== "intrebat") ? istoric : istoric.slice(0, -1);
    const dinainte = inainte.length
      ? "Până acum v-ați spus: " + inainte.join(" / ") + ". "
      : "";

    /* Dacă e pomenit altcineva din local, modelul primește și o vorbă despre el:
       altfel n-are de unde ști cine e „draconianul" și răspunde pe lângă. Dacă
       l-ai pomenit chiar pe el, întrebarea e despre el însuși. */
    let despreEl = "";
    if (despre && FIRI[despre] && FIRI[despre].despre) {
      despreEl = " În local mai e cineva, despre care te întreabă acum: " +
                 FIRI[despre].despre + " Spune-ți părerea despre el, cum ți-e firea.";
    } else if (ce && ce.desprEl) {
      despreEl = " Te întreabă chiar despre tine: spune ce crezi despre tine însuți.";
    }

    /* Ce știi despre el: numele, dacă s-a prezentat, și ce ți-a mai spus despre
       sine. Un om ține minte ce i s-a spus și se folosește de asta. */
    let teStie = ce && ce.tuEsti
      ? " Cel cu care vorbești se numește " + ce.tuEsti + "; poți să-i spui pe nume."
      : "";
    if (ce && ce.stiuDespreTine && ce.stiuDespreTine.length) {
      teStie += " Ți-a mai spus despre el că " + ce.stiuDespreTine.join(" și ") +
                "; ține minte și răspunde-i ca unui om pe care îl cunoști.";
    }

    /* În ce fel ai ajuns să vorbești: întrebat de-a dreptul, chemat pe nume în
       vorba altuia, băgat singur peste ei, sau repezindu-l pe cel băgat. */
    const fel = (ce && ce.fel) || "intrebat";
    let locul = "";
    let auzi = "Cineva de la masă îți spune: " + intrebare;
    if (fel === "pomenit") {
      locul = " Vorbea cu " + ce.cuCine + ", dar te-a chemat și pe tine pe nume: " +
              "răspunde-i scurt, de la locul tău.";
      auzi = "Cineva de la masă vorbea cu " + ce.cuCine + " și te-a chemat și pe tine: " + intrebare;
    } else if (fel === "bagat") {
      locul = " Nu vorbea nimeni cu tine, dar auzi de la locul tău și te bagi în vorbă " +
              "cu o vorbă scurtă, neîntrebat.";
      auzi = "Cineva de la masă îi spune lui " + ce.cuCine + ": " + intrebare +
             " Bagă-te și tu în vorbă.";
    } else if (fel === "repezit") {
      locul = " " + ce.cine + " tocmai s-a băgat în vorba voastră, deși nu-l întreba nimeni. " +
              "Repede-l scurt, fără politețuri, și gata.";
      auzi = ce.cine + " s-a băgat în vorbă și a zis: " + intrebare;
    }

    fetch(this.url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: this.model,
        stream: false,
        think: false,
        options: { temperature: 0.9, num_predict: 60 },
        messages: [
          { role: "system", content: fire.fire + despreEl + teStie + locul +
            " Ești într-un bar. Răspunzi la ce te-a întrebat, nu în altă parte. " +
            "Scrii în română corectă, cu diacritice, într-o singură propoziție " +
            "încheiată, de cel mult 15 cuvinte. Fără ghilimele, fără asteriscuri, " +
            "fără mișcări scrise, fără explicații, fără să-ți spui numele." },
          { role: "user", content: dinainte + auzi }
        ]
      })
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        // Prin sită: ce nu se poate curăța se aruncă, și răspunde din firea lui.
        raspunde(curataRaspunsul((j && j.message && j.message.content) || "", intrebare));
      })
      .catch(function () { raspunde(null); });
  },

  /* Vorba musafirilor de la masa a treia. Tot modelul o scrie, dacă e pornit;
     dacă nu, rămân replicile scrise de mână — și nu se vede diferența decât
     prin faptul că se repetă mai des. */
  discuta: function (istoric, gata) {
    let raspuns = false;
    const raspunde = function (pereche) {
      if (raspuns) return;
      raspuns = true;
      gata(pereche);
    };
    setTimeout(function () { raspunde(null); }, 5000);

    const dinainte = istoric.length
      ? "Până acum și-au spus: " + istoric.join(" / ") + ". "
      : "Tocmai s-au așezat. ";

    fetch(this.url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: this.model,
        stream: false,
        think: false,
        options: { temperature: 1.0, num_predict: 60 },
        messages: [
          { role: "system", content:
            "Scrii replici scurte și firești, în română, pentru doi oameni care " +
            "beau ceva într-un bar liniștit. Fără ghilimele, fără explicații." },
          { role: "user", content: dinainte +
            "Scrie următoarele două replici, una pentru fiecare, de cel mult " +
            "șapte cuvinte. Format exact:\nA: ...\nB: ..." }
        ]
      })
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        const text = String((j && j.message && j.message.content) || "");
        const linii = text.split("\n")
          .map(function (l) { return l.replace(/^\s*[-–*]?\s*[AB]\s*[:.)\-]\s*/i, "").trim(); })
          .filter(function (l) { return l.length > 1 && l.length < 70; });
        raspunde(linii.length >= 2 ? [linii[0], linii[1]] : null);
      })
      .catch(function () { raspunde(null); });
  }
};

// Ce vede un personaj când îi vine rândul.
/* Ce știe cel care e la rând. Cărțile de pe masă stau cu fața în jos, deci nu
   i se spune ce s-a jucat — doar câți au pus înaintea lui. Altfel l-am pune să
   joace cu cărțile celorlalți pe față. */
function situatiaMesei(p) {
  const mana = p.mana.map(function (c) {
    return c.joker ? "joker" : c.valoare;
  }).join(", ");
  const masa = cartiPeMasa.length
    ? cartiPeMasa.length + " cărți puse cu fața în jos, nu știi care"
    : "nimic încă";
  return "Ai în mână cărțile: " + mana + ". Pe masă e: " + masa +
         ". E levata " + (levata + 1) + " din " + CARTI_IN_MANA +
         ". Cea mai mare carte ia levata, dar jokerul (0) bate zecele. " +
         "Ce carte joci? Răspunde doar cu numărul.";
}

/* Judecata din cod: firea fiecăruia, scrisă în trei rânduri. E și rezerva de
   care atârnă totul când modelul nu răspunde.

   Cărțile de pe masă stau întoarse, deci nimeni nu se mai uită la ele: fiecare
   joacă din ce are în mână și din a câta levată e. */
function alegeDinCod(p) {
  if (!p.mana.length) return 0;
  const valori = p.mana.map(function (c) { return c.valoare; })
                       .sort(function (a, b) { return a - b; });
  const areJoker = p.mana.some(function (c) { return c.joker; });
  const ultima = levata >= CARTI_IN_MANA - 1;

  // Jokerul e o cacealma: dat prea devreme, se irosește. Cine calculează îl
  // ține pentru levata în care e mai probabil să cadă un zece — ultima.
  if (areJoker && p !== draconianul && (ultima || intreg(0, 1) < 0.3)) return 0;

  if (p === reptilianul) {
    // Își drămuiește mâna: întâi cele mici, tăria o ține pentru la urmă.
    return valori[Math.min(levata, valori.length - 1)];
  }
  if (p === draconianul) {
    // Trântește cea mai mare de cele mai multe ori. Nu-l duce capul la altceva.
    return intreg(0, 1) < 0.6 ? valori[valori.length - 1]
                              : valori[Math.floor(intreg(0, valori.length)) % valori.length];
  }
  if (p === dealerul) {
    // Joacă cuminte, de la mijlocul mâinii: nici nu se dă mare, nici nu aruncă.
    return valori[Math.floor(valori.length / 2)];
  }
  // Clovnul, când nu te hotărăști tu: la nimereală, ca tot ce face el.
  return valori[Math.floor(intreg(0, valori.length)) % valori.length];
}

let stare = "";
let tStare = 0;        // de cât timp durează starea curentă
let cronometru = 0;    // pentru pașii dinăuntrul unei stări
let impartite = 0;
let jucate = 0;
let levata = 0;        // a câta levată din mâna asta, de la 0 la CARTI_IN_MANA-1
let startator = 0;     // cine primește prima carte și joacă primul
let castigator = null;          // cine a luat levata de acum
let castigatorulMainii = null;  // cine a luat cele mai multe levate din mână

/* Cine joacă mâna asta. De obicei cei trei; din când în când, dealerul zice o
   vorbă și intră și el. Rar — altfel n-ar mai fi dealer, ar fi al patrulea. */
let jucatori = personaje.slice();

const VORBE_DEALER = [
  "Hai că joc și eu o rundă.",
  "Băieți, joc și eu de data asta.",
  "Una singură, și mă opresc.",
  "Ia să văd și eu cum e de partea ailaltă."
];

function alegeJucatoriiMainii() {
  // Niciodată două mâini la rând: dacă tocmai a jucat, împarte și-atât.
  const intra = !dealerul.joaca && Math.random() < 0.15;
  dealerul.joaca = intra;
  jucatori = intra ? personaje.concat([dealerul]) : personaje.slice();
  if (intra) {
    dealerul.vorba = alegeDin(VORBE_DEALER);
    dealerul.vorbaTimp = 4.5;
  }
  if (startator >= jucatori.length) startator = 0;

  /* Jokerul: cam la fiecare a treia mână, o carte din pachet iese joker, și îi
     pică cui se nimerește. Mai des, ar decide el toată partida. */
  const cate = CARTI_IN_MANA * jucatori.length;
  jokerLaCartea = Math.random() < 0.34 ? Math.floor(Math.random() * cate) : -1;
}

let jokerLaCartea = -1;   // a câta carte împărțită iese joker; -1 = niciuna
let durataGandire = 1.5;
let laRand = null;             // cine e la rând acum
let raspunsModel = null;       // ce a apucat să spună modelul pentru el
let asteaptaJucator = false;   // masa te așteaptă pe tine
let rabdare = 0;
const cartiPeMasa = [];

function schimbaStarea(noua) {
  stare = noua;
  tStare = 0;

  if (noua === "impartire") {
    impartite = 0;
    levata = 0;
    cronometru = 0.25;
    alegeJucatoriiMainii();
    for (const p of jucatori) p.levateLuate = 0;
  }
  else if (noua === "gandire") {
    for (const p of jucatori) trimiteEveniment(p, "gandeste");
    // Masa așteaptă cât are nevoie cel mai lent dintre ei.
    durataGandire = 0.6;
    for (const p of jucatori) durataGandire = Math.max(durataGandire, timpDeGandire(p) * 0.9);
  }
  else if (noua === "jucare") {
    jucate = 0;
    cronometru = 0.2;
    laRand = null;
    asteaptaJucator = false;
  }
  else if (noua === "castigator") {
    castigator = alegeCastigator();
    castigator.levateLuate = (castigator.levateLuate || 0) + 1;
    // Cărțile de pe masă se strâng spre câștigător. Rămân cu fața în sus cât
    // alunecă spre el: abia s-au dezvelit, e momentul în care se văd.
    for (let i = 0; i < cartiPeMasa.length; i++) {
      const c = cartiPeMasa[i];
      // Trase la el, deci ale lui: dacă e cel din față, dispar în spatele lui.
      c.proprietar = castigator;
      mutaObiect(c, castigator.manaX, castigator.manaY, castigator.rotCarte, 0.55, i * 0.06);
    }
  }
  else if (noua === "reactie") {
    for (const p of jucatori) {
      trimiteEveniment(p, p === castigator ? "castig" : "pierdere");
    }
    // Și, separat, ce s-a întâmplat la masă: cine a luat levata. Fiecare face ce
    // vrea cu informația asta — sau nimic, ca reptilianul.
    for (const p of jucatori) {
      if (p !== castigator) trimiteEveniment(p, "vecinCastiga", castigator);
    }

    /* La a treia levată se încheie și mâna: atunci se vede cine a luat mai
       multe și cine a rămas cu mâinile goale. Astea sunt reacțiile mari. */
    if (levata + 1 >= CARTI_IN_MANA) {
      let celMaiBun = jucatori[0], celMaiSlab = jucatori[0];
      for (const p of jucatori) {
        if (p.levateLuate > celMaiBun.levateLuate) celMaiBun = p;
        if (p.levateLuate < celMaiSlab.levateLuate) celMaiSlab = p;
      }
      castigatorulMainii = celMaiBun;
      trimiteEveniment(celMaiBun, "castigaMana");
      if (celMaiSlab !== celMaiBun) trimiteEveniment(celMaiSlab, "pierdeMana");
    }
  }
  else if (noua === "pauza") {
    // Numai la sfârșitul mâinii se golește masa: între levate, fiecare rămâne
    // cu ce i-a mai rămas în mână.
    if (levata + 1 >= CARTI_IN_MANA) {
      for (const c of carti) {
        c.fataInSus = false;
        c.proprietar = null;
        mutaObiect(c, teanc.x, teanc.y, -0.12, 0.5, Math.random() * 0.12);
      }
    }
  }
}

/* Levata e a celui care a pus cea mai mare carte. La egalitate, a celui care a
   pus-o primul.

   Jokerul face excepția: bate zecele, dar pierde în fața oricărei alte cărți.
   Fiind mai mulți la masă, regula trebuie spusă așa ca să nu se învârtă în cerc
   (joker bate 10, 10 bate 7, 7 bate joker): jokerul ia levata doar dacă pe masă
   e un zece; dacă nu e, el e cea mai mică de pe masă. */
function alegeCastigator() {
  const joker = cartiPeMasa.find(function (c) { return c.joker; });
  const zece = cartiPeMasa.some(function (c) { return c.valoare === 10; });
  if (joker && zece) return joker.jucatDe;

  let cea = null;
  for (const c of cartiPeMasa) {
    if (c.joker) continue;
    if (!cea || c.valoare > cea.valoare) cea = c;
  }
  return (cea && cea.jucatDe) || (joker && joker.jucatDe) ||
         jucatori[startator % jucatori.length];
}

// Începe rândul cuiva: ori te întreabă pe tine, ori întreabă modelul.
function incepeRandul(p) {
  laRand = p;
  raspunsModel = null;
  trimiteEveniment(p, "gandeste");

  if (esteAlTau(p)) {
    asteaptaJucator = true;
    rabdare = RABDARE;
    return;
  }

  asteaptaJucator = false;
  cronometru = 0.35 + timpDeGandire(p) * 0.5;
  // Modelul e întrebat doar pentru cine are o fire scrisă în `personaje.json`.
  // Dealerul n-are: el joacă după judecata din cod.
  if (AI.activ && p.promptSistem) {
    const cerut = p;
    AI.intreaba(p, situatiaMesei(p), function (valoare) {
      // Numai dacă tot el e la rând și chiar are cartea aia în mână.
      if (laRand !== cerut) return;
      if (cerut.mana.some(function (c) { return c.valoare === valoare; })) {
        raspunsModel = valoare;
      }
    });
  }
}

function joacaCartea(p, valoare) {
  let i = p.mana.findIndex(function (c) { return c.valoare === valoare; });
  if (i < 0) i = 0;
  const c = p.mana.splice(i, 1)[0];

  c.fataInSus = false;      // cu fața în jos: se întoarce la sfârșitul levatei
  c.proprietar = null;      // de acum e a mesei, se vede de oriunde
  c.marime = 1;             // și are mărimea celorlalte de pe blat
  c.jucatDe = p;
  // Cartea aterizează puțin dezordonat — nimeni nu pune perfect drept.
  mutaObiect(c,
    p.masaX + intreg(-0.8, 0.8) * U,
    p.masaY + intreg(-0.8, 0.8) * U,
    p.rotCarte + intreg(-0.14, 0.14),
    0.45, 0);
  cartiPeMasa.push(c);
  rearanjeazaMana(p, 0.3);
  trimiteEveniment(p, "joaca");

  jucate++;
  laRand = null;
  asteaptaJucator = false;
  cronometru = 0.35;
}

function actualizeazaJocul(dt) {
  tStare += dt;
  cronometru -= dt;

  if (stare === "impartire") {
    if (cronometru <= 0 && impartite < CARTI_IN_MANA * jucatori.length) {
      const p = jucatori[(startator + impartite) % jucatori.length];
      const c = creeazaCarte(teanc.x, teanc.y, -0.12);
      c.valoare = Math.floor(intreg(1, 11));      // de la 1 la 10
      if (impartite === jokerLaCartea) {
        // Jokerul n-are cifră: în socoteli e cea mai mică de pe masă.
        c.joker = true;
        c.valoare = 0;
      }
      c.proprietar = p;
      carti.push(c);
      p.mana.push(c);
      rearanjeazaMana(p, 0.42);
      dealerul.imparte = 0.22;             // i se mișcă mâna la fiecare carte
      impartite++;
      cronometru = 0.17;
    }
    if (impartite >= CARTI_IN_MANA * jucatori.length && cronometru <= -0.45) {
      schimbaStarea("gandire");
    }
  }

  else if (stare === "gandire") {
    if (tStare > durataGandire) schimbaStarea("jucare");
  }

  else if (stare === "jucare") {
    if (jucate < jucatori.length) {
      const p = jucatori[(startator + jucate) % jucatori.length];
      if (laRand !== p) {
        incepeRandul(p);
      } else if (asteaptaJucator) {
        // Te așteaptă, dar nu la nesfârșit: dacă nu te hotărăști, joacă el.
        rabdare -= dt;
        if (rabdare <= 0) joacaCartea(p, alegeDinCod(p));
      } else if (cronometru <= 0) {
        /* Dacă am întrebat modelul și încă nu a răspuns, îi mai dăm o clipă —
           dar nu mai mult de-atât. Mai bine joacă din cod decât să înghețe masa
           așteptând un răspuns care poate nu vine niciodată. */
        const maiAsteptam = AI.activ && raspunsModel === null && cronometru > -1.6;
        if (!maiAsteptam) {
          joacaCartea(p, raspunsModel !== null ? raspunsModel : alegeDinCod(p));
        }
      }
    }
    else if (cronometru <= -0.5) {
      schimbaStarea("intoarcere");
    }
  }

  else if (stare === "intoarcere") {
    /* Se întorc pe rând, în ordinea în care au fost puse. Aici e toată tensiunea
       levatei: până acum nimeni n-a știut ce a pus celălalt. */
    const cate = Math.min(cartiPeMasa.length, Math.floor(tStare / 0.22) + 1);
    for (let i = 0; i < cate; i++) {
      if (!cartiPeMasa[i].fataInSus) {
        cartiPeMasa[i].fataInSus = true;
        sunet.canta("poc");
      }
    }
    if (tStare > 0.22 * cartiPeMasa.length + 0.8) schimbaStarea("castigator");
  }

  else if (stare === "castigator") {
    if (tStare > 0.85) schimbaStarea("reactie");
  }

  else if (stare === "reactie") {
    if (tStare > 1.5) schimbaStarea("pauza");
  }

  else if (stare === "pauza") {
    if (tStare > 0.9) {
      // Cine a luat levata deschide levata următoare.
      startator = jucatori.indexOf(castigator);
      if (startator < 0) startator = 0;

      if (levata + 1 < CARTI_IN_MANA) {
        /* Mai sunt cărți în mâini: cele jucate au ajuns la câștigător și ies
           din scenă, iar masa se așteaptă la levata următoare. */
        for (const c of cartiPeMasa) {
          const i = carti.indexOf(c);
          if (i >= 0) carti.splice(i, 1);
        }
        cartiPeMasa.length = 0;
        levata++;
        schimbaStarea("gandire");
        return;
      }

      // S-a jucat și ultima: masa se golește și se împart cărți noi.
      carti.length = 0;
      cartiPeMasa.length = 0;
      for (const p of jucatori) p.mana.length = 0;
      schimbaStarea("impartire");
    }
  }
}

/* ==========================================================================
   7. BUCLA PRINCIPALĂ
   ========================================================================== */

let ultimulTimp = 0;
let t = 0;   // timpul total, folosit de animațiile de idle

/* Mâna ta, jos, în fața mesei. Cât te așteaptă masa, cărțile stau puțin mai sus
   și au o lumină caldă sub ele — ca să se vadă că e rândul tău. */
function deseneazaManaTa() {
  const eu = personaje.find(esteAlTau);
  if (!eu || !eu.mana.length) return;

  if (asteaptaJucator) {
    const lumina = ctx.createRadialGradient(cx, H - 5 * U, 0, cx, H - 5 * U, 26 * U);
    lumina.addColorStop(0, "rgba(255, 205, 130, 0.20)");
    lumina.addColorStop(1, "rgba(255, 180, 90, 0)");
    ctx.fillStyle = lumina;
    ctx.fillRect(0, H - 22 * U, W, 22 * U);
  }

  for (const c of eu.mana) {
    ctx.save();
    if (asteaptaJucator) ctx.translate(0, -1.2 * U);
    deseneazaCarte(c);
    ctx.restore();
  }
}

function actualizeazaTot(dt) {
  actualizeazaJocul(dt);
  for (const p of personaje) actualizeazaPersonaj(p, dt);
  actualizeazaPersonaj(dealerul, dt);
  dealerul.actualizeaza(dt);
  for (const c of carti) actualizeazaObiect(c, dt);
  actualizeazaParticule(dt);
  actualizeazaFundal(dt);
  actualizeazaComanda(dt);
}

/* Ordinea de desenare ține loc de adâncime: cine e mai aproape, mai târziu.
   Tot ea îi așază pe scaune — pe cei din spate îi acoperă masa de la brâu în
   jos, iar celui din față îi trece spătarul scaunului peste picioare. */
function deseneazaTot() {
  deseneazaFundal();

  // Barul, cu cei trei din spatele lui prinși între raft și tejghea.
  deseneazaBarFundal();
  spalatorul.deseneaza(ctx, t);
  barmanul.deseneaza(ctx, t);
  bucatarul.deseneaza(ctx, t);
  deseneazaTejghea();

  // Masa a doua, cu cei doi jucători de șah prinși între picior și blat.
  deseneazaMasa2Sub();
  omulCuMana.deseneaza(ctx, t);
  omulDeAur.deseneaza(ctx, t);

  /* Chelnerul umblă prin tot localul, așa că se desenează în trei locuri
     diferite, după cât de aproape e de noi: în spatele mesei a doua, în spatele
     mesei noastre, sau în fața ei. Altfel, când trecea pe lângă masa a doua,
     părea că s-a urcat pe ea. */
  const inSpateleMesei2 = chelnerul.y < masa2.y + masa2.ry;
  if (inSpateleMesei2) chelnerul.deseneaza(ctx, t);

  deseneazaMasa2Blat();
  deseneazaSah();

  if (!inSpateleMesei2 && chelnerul.y < cy) chelnerul.deseneaza(ctx, t);

  /* Cei de pe laturile din spate și din lături: masa le acoperă poalele. Pe cine
     stă într-o lături nu-l acoperă nimic, așa că peste picioarele lui trece
     șezutul scaunului — altfel ar părea că stă în picioare în fața lui. */
  for (const p of personaje.concat([dealerul])) {
    if (!p.inFata) {
      if (p.asezatLateral) {
        deseneazaScaunLateral(p);
      } else {
        deseneazaScaun(p);
        deseneazaSpatar(p);
      }
      deseneazaPersonaj(p, t);
    }
  }

  deseneazaMasa();

  /* Tot ce stă pe blat se desenează înaintea celui din față: el e între noi și
     masă, deci trebuie să acopere el cărțile, nu ele pe el. Altfel îi cad
     cărțile jucate peste pălărie. */
  deseneazaTeanc();
  deseneazaPahare();
  for (const c of carti) {
    if (c.proprietar && esteAlTau(c.proprietar)) continue;   // mâna ta, mai jos
    deseneazaCarte(c);
  }

  for (const p of personaje) {
    if (p.inFata) {                       // cel din față
      deseneazaScaun(p);
      deseneazaPersonaj(p, t);
      deseneazaSpatar(p);
    }
  }

  if (chelnerul.y >= cy) chelnerul.deseneaza(ctx, t);

  // Masa a treia e cea mai aproape de noi, deci se desenează peste tot restul.
  deseneazaMasa3Sub();
  for (const m of vizita.musafiri) m.deseneaza(ctx, t);
  deseneazaMasa3Blat();

  deseneazaParticule();

  deseneazaLumina();
  deseneazaVigneta();

  // Mâna ta, vorbele și meniul stau peste tot: sunt lucrurile pe care trebuie
  // să le vezi limpede, nu prin vignetă.
  deseneazaManaTa();
  deseneazaVorba();
  deseneazaVorbaDealerului();
  deseneazaVorbeleLor();
  deseneazaMeniu();
}

function cadru(acum) {
  // dt în secunde, limitat ca scena să nu sară după ce revii într-un tab uitat.
  let dt = (acum - ultimulTimp) / 1000;
  ultimulTimp = acum;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, 0.05);
  t += dt;

  actualizeazaTot(dt);
  deseneazaTot();

  requestAnimationFrame(cadru);
}

window.addEventListener("resize", redimensioneaza);

// Singurul lucru pe care îl poți apăsa în toată scena.
cv.addEventListener("click", function (e) {
  const chenar = cv.getBoundingClientRect();
  apasa(e.clientX - chenar.left, e.clientY - chenar.top);
});

legaFereastraDeVorba();
redimensioneaza();
schimbaStarea("impartire");
requestAnimationFrame(function (acum) {
  ultimulTimp = acum;
  requestAnimationFrame(cadru);
});
</script>
