<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personaj — Partida de cărți</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="scena"></canvas>
<script>
"use strict";

/* ==========================================================================
   1. CANVAS, DIMENSIUNI ȘI GEOMETRIE
   ========================================================================== */

const cv  = document.getElementById("scena");
const ctx = cv.getContext("2d");

// Lățimea și înălțimea logică a scenei (în pixeli CSS, nu fizici).
let W = 0, H = 0;

// Unitatea de măsură a scenei: a suta parte din latura mică a ferestrei.
// Toate dimensiunile din cod sunt exprimate în U, ca scena să arate la fel
// pe orice ecran.
let U = 0;

// Centrul mesei.
let cx = 0, cy = 0;

// Geometria localului, recalculată la fiecare redimensionare.
const masa  = { rx: 0, ry: 0 };   // razele elipsei mesei
const teanc = { x: 0, y: 0 };     // unde stă teancul de cărți
const bar = { x0: 0, x1: 0, y: 0, inalt: 0, raft: 0 };   // tejgheaua din fundal
const masa2 = { x: 0, y: 0, rx: 0, ry: 0 };              // a doua masă, în stânga
let latCarte = 0, inaltCarte = 0;

function redimensioneaza() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;

  cv.width  = Math.round(W * dpr);
  cv.height = Math.round(H * dpr);
  cv.style.width  = W + "px";
  cv.style.height = H + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  U  = Math.min(W, H) / 100;

  // Masa noastră nu stă în mijlocul ecranului: e trasă spre dreapta, ca să
  // rămână loc în stânga pentru a doua masă.
  cx = W * 0.56;
  cy = H * 0.62;

  calculeazaGeometria();
}

function calculeazaGeometria() {
  // Masa: elipsă turtită, ca și cum am privi-o ușor de sus.
  masa.rx = Math.min(W * 0.26, H * 0.40);
  masa.ry = masa.rx * 0.42;

  latCarte   = 4.4 * U;
  inaltCarte = 6.4 * U;

  teanc.x = cx - masa.rx * 0.34;
  teanc.y = cy + masa.ry * 0.06;

  // Barul: o tejghea de-a latul fundalului, cu raftul de sticle deasupra.
  bar.x0 = W * 0.03;
  bar.x1 = W * 0.97;
  bar.y = H * 0.21;
  bar.inalt = 9 * U;
  bar.raft = bar.y - 13 * U;

  // A doua masă: în stânga și mai departe, deci mai mică.
  masa2.rx = masa.rx * 0.55;
  masa2.ry = masa2.rx * 0.42;
  masa2.x = cx - masa.rx * 1.72;
  masa2.y = cy - masa.ry * 1.45;

  for (const p of personaje) aseazaPersonaj(p);
}

/* ==========================================================================
   2. UTILITARE DE DESEN ȘI DE CALCUL
   ========================================================================== */

function interpoleaza(a, b, t) { return a + (b - a) * t; }

// Ușurare lină la capete: pornirea și oprirea nu sunt bruște.
function usor(t) {
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

// Aduce un unghi în intervalul (-PI, PI].
function normalizeazaUnghi(a) {
  while (a >  Math.PI) a -= 2 * Math.PI;
  while (a <= -Math.PI) a += 2 * Math.PI;
  return a;
}

function intreg(min, max) { return min + Math.random() * (max - min); }

function elipsa(x, y, rx, ry) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
}

// Dreptunghi cu colțuri rotunjite, desenat manual ca să nu depindem de
// roundRect (care nu există în browsere mai vechi).
function dreptunghiRotunjit(x, y, lat, inalt, raza) {
  const r = Math.min(raza, lat / 2, inalt / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + lat - r, y);
  ctx.arcTo(x + lat, y, x + lat, y + r, r);
  ctx.lineTo(x + lat, y + inalt - r);
  ctx.arcTo(x + lat, y + inalt, x + lat - r, y + inalt, r);
  ctx.lineTo(x + r, y + inalt);
  ctx.arcTo(x, y + inalt, x, y + inalt - r, r);
  ctx.lineTo(x, y + r);
  ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

/* ==========================================================================
   3. SCENA: MASA ȘI LUMINA
   ========================================================================== */

function deseneazaFundal() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, W, H);
}

/* Culorile localului: lemnul mesei, al scaunelor și al tejghelei. */
const LOCAL = {
  muchieMasa:   "#3a2312",
  piciorMasa:   "#2b1a0d",
  scaun:        "#5a3a22",
  scaunUmbra:   "#3a2415",
  scaunDeparte: "#40291a",
  tejghea:      "#5e3a22",
  tejgheaSus:   "#7a4e2c",
  raft:         "#241710",
  blatMasa2:    "#4a2f1a",
  muchieMasa2:  "#2e1d10"
};

// Sticlele de pe raft nu se rearanjează la fiecare cadru și nici la
// redimensionare: poziția și culoarea lor ies dintr-un număr, nu din Math.random.
function pseudo(i) {
  const x = Math.sin(i * 12.9898) * 43758.5453;
  return x - Math.floor(x);
}

function deseneazaBar() {
  // Peretele din spatele barului: doar cu o idee mai deschis decât negrul.
  const perete = ctx.createLinearGradient(0, 0, 0, bar.y + bar.inalt);
  perete.addColorStop(0, "#100b07");
  perete.addColorStop(1, "#1e150e");
  ctx.fillStyle = perete;
  ctx.fillRect(0, 0, W, bar.y + bar.inalt);

  // Lumina barului: mai rece și mai slabă decât lampa de deasupra mesei.
  const lumina = ctx.createRadialGradient(W * 0.5, bar.raft, 0, W * 0.5, bar.y, W * 0.6);
  lumina.addColorStop(0, "rgba(150, 190, 220, 0.11)");
  lumina.addColorStop(1, "rgba(120, 170, 210, 0)");
  ctx.fillStyle = lumina;
  ctx.fillRect(0, 0, W, bar.y + bar.inalt);

  // Raftul, apoi sticlele care stau pe el.
  ctx.fillStyle = LOCAL.raft;
  ctx.fillRect(bar.x0, bar.raft, bar.x1 - bar.x0, 1.1 * U);
  deseneazaSticle();

  // Tejgheaua: fața ei, apoi muchia de sus, unde bate lumina.
  ctx.fillStyle = LOCAL.tejghea;
  ctx.fillRect(bar.x0, bar.y, bar.x1 - bar.x0, bar.inalt);
  ctx.fillStyle = LOCAL.tejgheaSus;
  ctx.fillRect(bar.x0, bar.y, bar.x1 - bar.x0, 1.5 * U);
}

function deseneazaSticle() {
  const culoriSticle = ["#c2612b", "#a83630", "#5c7a34", "#c19a27",
                        "#6b3f7a", "#2f7a6b", "#8a4a22", "#9c9a5e"];
  const cate = 24;
  for (let i = 0; i < cate; i++) {
    const x = bar.x0 + (i + 0.5) * (bar.x1 - bar.x0) / cate + (pseudo(i) - 0.5) * 1.6 * U;
    const inalt = (4.2 + pseudo(i + 40) * 2.6) * U;
    const lat = (1.7 + pseudo(i + 80) * 0.7) * U;
    const jos = bar.raft;

    ctx.fillStyle = culoriSticle[Math.floor(pseudo(i + 7) * culoriSticle.length)];
    dreptunghiRotunjit(x - lat / 2, jos - inalt, lat, inalt, lat * 0.35);
    ctx.fill();
    // Gâtul sticlei.
    dreptunghiRotunjit(x - lat * 0.17, jos - inalt - 1.7 * U, lat * 0.34, 1.9 * U, lat * 0.15);
    ctx.fill();
  }
}

function deseneazaMasa2() {
  // Aceleași forme ca la masa noastră, dar mai mici și mai stinse: e departe.
  ctx.fillStyle = LOCAL.piciorMasa;
  dreptunghiRotunjit(masa2.x - 1.5 * U, masa2.y, 3 * U, masa2.ry * 1.5, 0.8 * U);
  ctx.fill();
  elipsa(masa2.x, masa2.y + masa2.ry * 1.5, 4.5 * U, 1.7 * U);
  ctx.fill();

  // Cele două scaune, deocamdată goale. Clienții vin la Faza 8.
  ctx.fillStyle = LOCAL.scaunDeparte;
  for (let s = -1; s <= 1; s += 2) {
    elipsa(masa2.x + s * masa2.rx * 1.25, masa2.y + masa2.ry * 0.3, masa2.rx * 0.24, masa2.rx * 0.09);
    ctx.fill();
    dreptunghiRotunjit(masa2.x + s * masa2.rx * 1.25 - masa2.rx * 0.20,
                       masa2.y - masa2.ry * 1.5, masa2.rx * 0.40, masa2.ry * 1.6, 0.6 * U);
    ctx.fill();
  }

  ctx.fillStyle = LOCAL.muchieMasa2;
  elipsa(masa2.x, masa2.y + 1.5 * U, masa2.rx, masa2.ry);
  ctx.fill();
  ctx.fillStyle = LOCAL.blatMasa2;
  elipsa(masa2.x, masa2.y, masa2.rx, masa2.ry);
  ctx.fill();
}

/* Scaunul e desenat în două bucăți, fiindcă personajul stă între ele: șezutul
   și picioarele rămân dedesubt, spătarul trece peste el dacă îl vedem din
   spate. De aici vine tot efectul de „stă pe scaun". */

function deseneazaScaun(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(p.scara, p.scara);
  const l = p.latime * U * 0.9;

  ctx.fillStyle = LOCAL.scaunUmbra;
  for (let s = -1; s <= 1; s += 2) {
    dreptunghiRotunjit(s * l * 0.34 - 0.35 * U, -3.2 * U, 0.7 * U, 3.4 * U, 0.3 * U);
    ctx.fill();
  }
  ctx.fillStyle = LOCAL.scaun;
  elipsa(0, -3.4 * U, l * 0.46, l * 0.16);
  ctx.fill();
  ctx.restore();
}

function deseneazaSpatar(p) {
  ctx.save();
  ctx.translate(p.x + Math.cos(p.unghi) * 2.4 * U, p.y + Math.sin(p.unghi) * 1.5 * U);
  ctx.scale(p.scara, p.scara);
  const l = p.latime * U * 0.9;

  ctx.fillStyle = LOCAL.scaun;
  dreptunghiRotunjit(-l * 0.40, -11.5 * U, l * 0.80, 8.6 * U, 0.9 * U);
  ctx.fill();
  ctx.fillStyle = LOCAL.scaunUmbra;
  for (let i = 0; i < 2; i++) {
    dreptunghiRotunjit(-l * 0.33, -10.2 * U + i * 3.1 * U, l * 0.66, 1.1 * U, 0.4 * U);
    ctx.fill();
  }
  ctx.restore();
}

function deseneazaMasa() {
  // Umbra difuză de sub masă, care o desprinde de întuneric.
  const umbra = ctx.createRadialGradient(cx, cy, masa.rx * 0.2, cx, cy, masa.rx * 1.9);
  umbra.addColorStop(0, "rgba(40, 22, 8, 0.85)");
  umbra.addColorStop(1, "rgba(0, 0, 0, 0)");
  ctx.fillStyle = umbra;
  elipsa(cx, cy + masa.ry * 0.25, masa.rx * 1.9, masa.ry * 2.1);
  ctx.fill();

  // Piciorul mesei: o coloană până la talpă, amândouă în umbră.
  ctx.fillStyle = LOCAL.piciorMasa;
  dreptunghiRotunjit(cx - 2.4 * U, cy, 4.8 * U, masa.ry * 1.5, 1.2 * U);
  ctx.fill();
  elipsa(cx, cy + masa.ry * 1.5, 8 * U, 3 * U);
  ctx.fill();

  // Grosimea blatului: aceeași elipsă, coborâtă și întunecată.
  ctx.fillStyle = LOCAL.muchieMasa;
  elipsa(cx, cy + 2.6 * U, masa.rx, masa.ry);
  ctx.fill();

  // Blatul, luminat din centru-sus de lampa de deasupra.
  const blat = ctx.createRadialGradient(
    cx, cy - masa.ry * 0.35, masa.rx * 0.05,
    cx, cy - masa.ry * 0.10, masa.rx * 1.15
  );
  blat.addColorStop(0.0, "#8a5c33");
  blat.addColorStop(0.45, "#5f3d21");
  blat.addColorStop(1.0, "#2b1a0d");
  ctx.fillStyle = blat;
  elipsa(cx, cy, masa.rx, masa.ry);
  ctx.fill();

  // Muchia lucioasă de sus, unde cade lumina direct.
  ctx.strokeStyle = "rgba(255, 205, 140, 0.16)";
  ctx.lineWidth = 0.45 * U;
  elipsa(cx, cy, masa.rx * 0.995, masa.ry * 0.99);
  ctx.stroke();
}

/* Becul de deasupra mesei nu e perfect: pâlpâie foarte puțin. Valoarea stă
   mereu în jurul lui 1, cât să se simtă că e o lampă adevărată, nu atât cât
   să distragă. */
function palpaitLumina(t) {
  return 1 + 0.04 * Math.sin(t * 2.1) * Math.sin(t * 0.63 + 1.3);
}

function deseneazaLumina() {
  const k = palpaitLumina(t);

  // Conul cald de lumină care cade de deasupra mesei.
  const con = ctx.createRadialGradient(
    cx, cy - masa.ry * 1.4, 0,
    cx, cy - masa.ry * 0.6, masa.rx * 1.7
  );
  con.addColorStop(0.0, "rgba(255, 196, 120, " + (0.16 * k) + ")");
  con.addColorStop(0.5, "rgba(255, 170, 90, " + (0.06 * k) + ")");
  con.addColorStop(1.0, "rgba(255, 150, 60, 0)");
  ctx.fillStyle = con;
  ctx.fillRect(0, 0, W, H);
}

function deseneazaVigneta() {
  const v = ctx.createRadialGradient(
    cx, cy, masa.rx * 0.7,
    cx, cy, Math.max(W, H) * 0.78
  );
  v.addColorStop(0, "rgba(0, 0, 0, 0)");
  v.addColorStop(1, "rgba(0, 0, 0, 0.92)");
  ctx.fillStyle = v;
  ctx.fillRect(0, 0, W, H);
}

/* ==========================================================================
   4. CĂRȚILE
   ========================================================================== */

// O carte e un obiect care își știe poziția curentă și ținta spre care se
// duce. Nimic nu sare dintr-un loc în altul: totul se interpolează.
const carti = [];

function creeazaCarte(x, y, rot) {
  return {
    x: x, y: y, rot: rot,
    x0: x, y0: y, rot0: rot,
    x1: x, y1: y, rot1: rot,
    t: 1, durata: 1,
    fataInSus: false,
    proprietar: null
  };
}

function mutaCarte(c, x, y, rot, durata, intarziere) {
  c.x0 = c.x; c.y0 = c.y; c.rot0 = c.rot;
  c.x1 = x;   c.y1 = y;   c.rot1 = rot;
  c.durata = durata;
  c.t = -(intarziere || 0) / durata;
}

function actualizeazaCarte(c, dt) {
  if (c.t >= 1) return;
  c.t += dt / c.durata;
  const t = Math.max(0, Math.min(1, c.t));
  const e = usor(t);
  c.x   = interpoleaza(c.x0, c.x1, e);
  c.y   = interpoleaza(c.y0, c.y1, e);
  c.rot = interpoleaza(c.rot0, c.rot1, e);
}

function deseneazaCarte(c) {
  ctx.save();
  ctx.translate(c.x, c.y);
  ctx.rotate(c.rot);

  const l = latCarte, i = inaltCarte;

  // Umbra cărții pe masă.
  ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
  dreptunghiRotunjit(-l / 2 + 0.4 * U, -i / 2 + 0.6 * U, l, i, 0.7 * U);
  ctx.fill();

  // Muchia: o carte are grosime, se vede o dungă pe sub ea.
  ctx.fillStyle = "#b0a084";
  dreptunghiRotunjit(-l / 2, -i / 2 + 0.45 * U, l, i, 0.7 * U);
  ctx.fill();

  if (c.fataInSus) {
    ctx.fillStyle = "#f2e6d0";
    dreptunghiRotunjit(-l / 2, -i / 2, l, i, 0.7 * U);
    ctx.fill();
    // Un semn simplu în mijloc — cărțile nu au valori reale.
    ctx.fillStyle = "#8a2f2a";
    elipsa(0, 0, l * 0.17, l * 0.17);
    ctx.fill();
    ctx.strokeStyle = "rgba(120, 90, 60, 0.5)";
    ctx.lineWidth = 0.18 * U;
    dreptunghiRotunjit(-l / 2 + 0.5 * U, -i / 2 + 0.5 * U, l - U, i - U, 0.4 * U);
    ctx.stroke();
  } else {
    // Spatele cărții: bordură deschisă, mijloc bordo.
    ctx.fillStyle = "#e8dcc4";
    dreptunghiRotunjit(-l / 2, -i / 2, l, i, 0.7 * U);
    ctx.fill();
    ctx.fillStyle = "#7c2b33";
    dreptunghiRotunjit(-l / 2 + 0.5 * U, -i / 2 + 0.5 * U, l - U, i - U, 0.4 * U);
    ctx.fill();
    ctx.strokeStyle = "rgba(230, 200, 150, 0.35)";
    ctx.lineWidth = 0.18 * U;
    dreptunghiRotunjit(-l / 2 + 1.1 * U, -i / 2 + 1.1 * U, l - 2.2 * U, i - 2.2 * U, 0.3 * U);
    ctx.stroke();
  }

  ctx.restore();
}

function deseneazaTeanc() {
  // Teancul din care se împarte: câteva cărți suprapuse, fixe.
  for (let i = 0; i < 5; i++) {
    ctx.save();
    ctx.translate(teanc.x, teanc.y - i * 0.28 * U);
    ctx.rotate(-0.12 + i * 0.012);
    ctx.fillStyle = i === 4 ? "#e8dcc4" : "rgba(90, 70, 50, 0.9)";
    dreptunghiRotunjit(-latCarte / 2, -inaltCarte / 2, latCarte, inaltCarte, 0.7 * U);
    ctx.fill();
    if (i === 4) {
      ctx.fillStyle = "#7c2b33";
      dreptunghiRotunjit(-latCarte / 2 + 0.5 * U, -inaltCarte / 2 + 0.5 * U,
                         latCarte - U, inaltCarte - U, 0.4 * U);
      ctx.fill();
    }
    ctx.restore();
  }
}

/* ==========================================================================
   4b. PARTICULE — FOC ȘI SCÂNTEI
   ========================================================================== */

/* Un sistem cât se poate de simplu, care nu știe nimic despre draconian: îi
   spui unde să aprindă și încotro, iar el se ocupă de restul. Orice altceva
   din scenă care are nevoie de foc îl poate folosi la fel. */

const particule = [];

function aprindeFoc(x, y, unghi, cate, putere) {
  const p = putere || 1;
  for (let i = 0; i < cate; i++) {
    const abatere = intreg(-0.22, 0.22);
    const viteza = intreg(22, 46) * U * p;
    particule.push({
      x: x + intreg(-0.5, 0.5) * U,
      y: y + intreg(-0.5, 0.5) * U,
      vx: Math.cos(unghi + abatere) * viteza,
      vy: Math.sin(unghi + abatere) * viteza,
      raza: intreg(0.5, 1.6) * U * p,
      viata: 0,
      durata: intreg(0.35, 0.8)
    });
  }
}

// Fum: același sistem, dar rece. Iese încet și se lățește.
function aprindeFum(x, y, cate) {
  for (let i = 0; i < cate; i++) {
    particule.push({
      x: x + intreg(-0.8, 0.8) * U,
      y: y + intreg(-0.8, 0.8) * U,
      vx: intreg(-3, 3) * U,
      vy: intreg(-7, -3) * U,
      raza: intreg(0.8, 1.8) * U,
      viata: 0,
      durata: intreg(0.8, 1.5),
      fum: true
    });
  }
}

function actualizeazaParticule(dt) {
  for (let i = particule.length - 1; i >= 0; i--) {
    const f = particule[i];
    f.viata += dt;
    if (f.viata >= f.durata) { particule.splice(i, 1); continue; }
    f.x += f.vx * dt;
    f.y += f.vy * dt;
    f.vy -= (f.fum ? 6 : 30) * U * dt;   // căldura ridică flacăra; fumul plutește
    f.vx *= 0.93;                        // și o încetinește
    f.vy *= 0.95;
  }
}

function deseneazaParticule() {
  for (const f of particule) {
    // k merge de la 0 (abia aprinsă) la 1 (stinsă): întâi alb-gălbui, apoi
    // portocaliu, la urmă un pic de fum.
    const k = f.viata / f.durata;
    let raza, culoare;
    if (f.fum) {
      raza = f.raza * (0.7 + k * 1.5);
      culoare = "rgba(150, 148, 138, " + (0.32 * (1 - k)) + ")";
    } else {
      raza = f.raza * (0.6 + k * 0.9);   // flacăra se lățește pe măsură ce se răcește
      culoare =
        k < 0.16 ? "rgba(255, 246, 214, 0.95)" :
        k < 0.40 ? "rgba(255, 186, 60, "  + (1.0 - k * 0.5) + ")" :
        k < 0.72 ? "rgba(232, 96, 32, "   + (1.0 - k * 0.7) + ")" :
                   "rgba(90, 52, 40, "    + (0.5 * (1 - k)) + ")";
    }
    ctx.fillStyle = culoare;
    elipsa(f.x, f.y, raza, raza);
    ctx.fill();
  }
}

/* ==========================================================================
   5. PERSONAJELE
   ========================================================================== */

/* Fiecare personaj respectă același contract:
     - unghi              : locul lui la masă
     - deseneaza(ctx, t)  : cum arată la momentul t, cu baza în (0, 0)
     - reactie(tip)       : ce face când primește un eveniment de la mașina de stări
   Opțional, un personaj mai poate avea:
     - actualizeaza(dt)   : dacă are ceva de întreținut în timp
     - gura, ...          : puncte de pe corp în unități U, mutate odată cu scena
   Desenul propriu-zis al fiecăruia stă mai jos, în secțiunile 5b, 5c și 5d. */

const personaje = [
  {
    nume: "Clovnul",
    unghi: Math.PI / 2,                        // în față, cu spatele la privitor
    ritm: 1.9, latime: 11, inaltime: 20,
    gandire: 0.9, haos: 0.75                   // repede, dar niciodată la fel
  },
  {
    nume: "Draconianul",
    unghi: Math.PI / 2 + (2 * Math.PI) / 3,    // stânga-spate
    ritm: 0.9, latime: 15, inaltime: 24,
    gandire: 1.6, haos: 0.25                   // masiv și lent
  },
  {
    nume: "Reptilianul",
    unghi: Math.PI / 2 + (4 * Math.PI) / 3,    // dreapta-spate
    ritm: 1.2, latime: 10.5, inaltime: 21,
    gandire: 1.3, haos: 0.04                   // constant, niciodată grăbit
  }
];

// Fiecare personaj primește starea lui internă de animație.
for (const p of personaje) {
  p.faza = Math.random() * Math.PI * 2;
  p.mana = [];
  p.reactieTimp = 0;
  p.reactieDurata = 1;
  p.reactieAmpl = 0;
  p.reactieFrecventa = 10;
}

// Calculează, pentru un personaj, toate punctele de care are nevoie scena:
// unde stă, unde își ține cărțile, unde pune cartea pe masă.
function aseazaPersonaj(p) {
  const c = Math.cos(p.unghi), s = Math.sin(p.unghi);

  /* Locurile nu stau pe un cerc: privim masa de sus, sub un unghi mic, și cele
     două părți nu se văd la fel. Cei din spate sunt trași înăuntru, ca blatul
     să le acopere poalele — de asta par așezați. Cel din față stă dincolo de
     marginea dinspre noi, cu spătarul scaunului peste picioare. */
  const inFata = s >= 0;
  p.x = cx + masa.rx * (inFata ? 1.00 : 0.86) * c;
  p.y = cy + masa.ry * (inFata ? 1.18 : 0.55) * s;

  // Personajele din față sunt mai aproape de privitor, deci mai mari.
  p.scara = 0.80 + 0.30 * (0.5 + 0.5 * s);

  // Punctul unde își ține mâna de cărți și unde pune cartea jucată.
  p.manaX = cx + masa.rx * 0.78 * c;
  p.manaY = cy + masa.ry * 0.78 * s;
  p.masaX = cx + masa.rx * 0.32 * c;
  p.masaY = cy + masa.ry * 0.32 * s;

  // Cărțile lui sunt rotite spre el, dar atenuat — privim masa de sus, dar
  // sub un unghi mic, așa că o rotire completă ar arăta fals.
  p.rotCarte = normalizeazaUnghi(p.unghi - Math.PI / 2) * 0.45;

  // Unele personaje au puncte proprii pe corp, date în unități U față de bază.
  // Botul draconianului e unul: de acolo iese focul.
  if (p.gura) {
    p.guraX = p.x + p.gura.x * U * p.scara;
    p.guraY = p.y + p.gura.y * U * p.scara;
  }
}

// Așază în evantai cărțile din mână. Se recalculează de fiecare dată când
// personajul primește sau joacă o carte.
function rearanjeazaMana(p, durata) {
  const n = p.mana.length;
  for (let i = 0; i < n; i++) {
    const d = i - (n - 1) / 2;
    const unghiCarte = p.rotCarte + d * 0.16;
    const x = p.manaX + Math.cos(p.rotCarte) * d * latCarte * 0.5;
    const y = p.manaY + Math.sin(p.rotCarte) * d * latCarte * 0.5 - Math.abs(d) * 0.3 * U;
    mutaCarte(p.mana[i], x, y, unghiCarte, durata || 0.35, 0);
  }
}

// Evenimentele primite de la mașina de stări. Personajul nu știe regulile
// jocului — știe doar cum să reacționeze.
/* Evenimentele care i se întâmplă lui: „gandeste", „joaca", „castig",
   „pierdere". Peste ele, unul singur despre altcineva — „vecinCastiga" —, care
   nu-l zguduie, doar îl anunță cine a luat mâna. */
function trimiteEveniment(p, tip, cine) {
  if (tip === "joaca")        { p.reactieAmpl =  0.7; p.reactieDurata = 0.5; p.reactieFrecventa = 9; }
  else if (tip === "castig")  { p.reactieAmpl =  2.6; p.reactieDurata = 1.3; p.reactieFrecventa = 11; }
  else if (tip === "pierdere"){ p.reactieAmpl = -1.4; p.reactieDurata = 1.2; p.reactieFrecventa = 2.4; }
  else if (tip === "gandeste"){ p.reactieAmpl =  0.35; p.reactieDurata = 0.8; p.reactieFrecventa = 4; }

  if (tip === "vecinCastiga") p.ultimulVecinCastigator = cine ? cine.nume : null;
  else p.reactieTimp = p.reactieDurata;

  // Peste tresărirea comună, personajul poate avea reacția lui proprie.
  if (p.reactie) p.reactie(tip, cine);
}

/* Cât se gândește un personaj înainte să pună cartea. Nu e o constantă: e
   felul lui de a fi. Clovnul e cel mai rapid, dar sare de la o extremă la
   alta; draconianul e lent; reptilianul face de fiecare dată cam la fel. */
function timpDeGandire(p) {
  return 0.30 + p.gandire * intreg(1 - p.haos, 1 + p.haos) * 0.75;
}

function actualizeazaPersonaj(p, dt) {
  if (p.reactieTimp > 0) p.reactieTimp = Math.max(0, p.reactieTimp - dt);
  if (p.actualizeaza) p.actualizeaza(dt);
}

// Mișcarea de fond e aceeași pentru toți: respirație, legănat, tresărire la
// reacții. Personajul primește sistemul de coordonate deja pregătit — baza lui
// e în (0, 0) și crește spre -y — și nu are grijă decât de propriul desen.
function deseneazaPersonaj(p, t) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.scale(p.scara, p.scara);

  // Respirația și legănatul: fiecare cu ritmul lui.
  const respiratie = 1 + 0.022 * Math.sin(t * p.ritm + p.faza);
  const leganare = 0.02 * Math.sin(t * p.ritm * 0.6 + p.faza * 1.7);

  // Reacția: o oscilație care se stinge.
  let salt = 0;
  if (p.reactieTimp > 0) {
    const k = p.reactieTimp / p.reactieDurata;
    salt = Math.sin(p.reactieTimp * p.reactieFrecventa) * p.reactieAmpl * k * U;
  }

  ctx.translate(0, -salt);
  ctx.rotate(leganare);

  // Umbra. Lampa e deasupra centrului mesei, deci umbra nu cade drept sub
  // personaj, ci dinspre centru spre exterior. E a podelei, nu a personajului:
  // nu respiră odată cu el.
  ctx.fillStyle = "rgba(0, 0, 0, 0.45)";
  elipsa(Math.cos(p.unghi) * 2.6 * U, Math.sin(p.unghi) * 1.6 * U,
         p.latime * U * 0.66, p.latime * U * 0.19);
  ctx.fill();

  ctx.scale(1, respiratie);

  p.deseneaza(ctx, t);

  ctx.restore();
}

/* ==========================================================================
   5b. CLOVNUL
   ========================================================================== */

/* Clovnul stă în față, cu spatele la privitor: îi vedem costumul din spate,
   gulerul cu volane și ceafa. Fața se ghicește doar pentru că nu stă locului —
   întoarce mereu capul spre vecini, și atunci nasul iese de după obraz. */

const CLOVN = {
  rosu:    "#c9483f",
  galben:  "#e8a13c",
  turcoaz: "#2f9d95",
  nas:     "#e4453a",
  piele:   "#e3b892",
  par:     "#d2552f",
  pantof:  "#3a2b3f",
  volan:   "#f2e6d0"
};

function deseneazaClovn(p, ctx, t) {
  const lat = p.latime * U;
  const inalt = p.inaltime * U;
  const razaCap = lat * 0.42;

  // Cât de întors e capul spre vecini. Nu ajunge niciodată la zero: clovnul
  // nu stă drept nici când n-are ce trage cu ochiul. Iar dacă tocmai a câștigat
  // cineva, se uită fix la el.
  let intoarcere = 0.675 + 0.325 * Math.sin(t * p.ritm * 0.45 + p.faza);
  if (p.privesteTimp > 0) {
    intoarcere = p.privesteSpre * (0.78 + 0.12 * Math.sin(t * 6 + p.faza));
  }

  // --- Pantofii: mari, ieșiți mult în lateral.
  ctx.fillStyle = CLOVN.pantof;
  for (let s = -1; s <= 1; s += 2) {
    elipsa(s * lat * 0.34, -0.7 * U, lat * 0.30, lat * 0.13);
    ctx.fill();
  }

  // --- Pantalonii bufanți, fiecare crac de altă culoare.
  const inaltPantalon = inalt * 0.44;
  for (let s = -1; s <= 1; s += 2) {
    ctx.fillStyle = s < 0 ? CLOVN.rosu : CLOVN.galben;
    dreptunghiRotunjit(s * lat * 0.28 - lat * 0.18, -inaltPantalon,
                       lat * 0.36, inaltPantalon - 0.9 * U, lat * 0.15);
    ctx.fill();
  }

  // --- Trupul: costum roșu, luminat de sus.
  const costum = ctx.createLinearGradient(0, -inalt, 0, -inalt * 0.35);
  costum.addColorStop(0, "#e2695c");
  costum.addColorStop(1, CLOVN.rosu);
  ctx.fillStyle = costum;
  dreptunghiRotunjit(-lat * 0.46, -inalt, lat * 0.92, inalt * 0.68, lat * 0.30);
  ctx.fill();

  // --- Peticele. Costumul e cârpit din bucăți care nu se potrivesc.
  ctx.fillStyle = CLOVN.turcoaz;
  dreptunghiRotunjit(-lat * 0.40, -inalt * 0.90, lat * 0.30, inalt * 0.20, 0.6 * U);
  ctx.fill();
  ctx.fillStyle = CLOVN.galben;
  dreptunghiRotunjit(lat * 0.06, -inalt * 0.66, lat * 0.28, inalt * 0.17, 0.6 * U);
  ctx.fill();
  ctx.fillStyle = CLOVN.turcoaz;
  dreptunghiRotunjit(-lat * 0.16, -inalt * 0.46, lat * 0.20, inalt * 0.10, 0.5 * U);
  ctx.fill();

  // --- Pompoanele de pe spatele costumului.
  ctx.fillStyle = CLOVN.galben;
  for (let i = 0; i < 3; i++) {
    elipsa(lat * 0.02, -inalt * (0.86 - i * 0.17), lat * 0.075, lat * 0.075);
    ctx.fill();
  }

  // --- Brațele, întinse spre masă. Se mișcă mereu puțin.
  for (let s = -1; s <= 1; s += 2) {
    ctx.save();
    ctx.translate(s * lat * 0.44, -inalt * 0.82);
    ctx.rotate(s * (0.95 + 0.08 * Math.sin(t * p.ritm * 1.3 + p.faza + s)));
    ctx.fillStyle = CLOVN.rosu;
    dreptunghiRotunjit(-lat * 0.11, 0, lat * 0.22, inalt * 0.42, lat * 0.11);
    ctx.fill();
    ctx.fillStyle = CLOVN.galben;              // manșeta
    dreptunghiRotunjit(-lat * 0.13, inalt * 0.33, lat * 0.26, inalt * 0.06, lat * 0.05);
    ctx.fill();
    ctx.fillStyle = CLOVN.volan;               // mănușa
    elipsa(0, inalt * 0.42, lat * 0.13, lat * 0.12);
    ctx.fill();
    ctx.restore();
  }

  // --- Gulerul cu volane, în jurul gâtului. Iese de sub cap ca o farfurie.
  ctx.fillStyle = CLOVN.volan;
  for (let i = -3; i <= 3; i++) {
    elipsa(i * lat * 0.16, -inalt + 1.0 * U + Math.abs(i) * 0.35 * U,
           lat * 0.15, lat * 0.11);
    ctx.fill();
  }

  // --- Capul, ușor rotit spre vecinul la care trage cu ochiul.
  const capX = -razaCap * 0.16 * intoarcere;
  const capY = -inalt - razaCap * 0.72;
  ctx.fillStyle = CLOVN.piele;
  elipsa(capX, capY, razaCap, razaCap * 1.02);
  ctx.fill();

  // Ceafa: părul acoperă spatele capului, fața rămâne doar ghicită.
  ctx.fillStyle = CLOVN.par;
  elipsa(capX - razaCap * 0.16 * intoarcere, capY + razaCap * 0.30,
         razaCap * 0.92, razaCap * 0.62);
  ctx.fill();
  for (let s = -1; s <= 1; s += 2) {
    for (let i = 0; i < 3; i++) {
      elipsa(capX + s * razaCap * (0.70 + i * 0.13),
             capY + razaCap * (i * 0.32 - 0.10),
             razaCap * 0.34, razaCap * 0.30);
      ctx.fill();
    }
  }

  // --- Pălăria conică, pusă strâmb, cu pompon în vârf.
  ctx.fillStyle = CLOVN.turcoaz;
  ctx.beginPath();
  ctx.moveTo(capX - razaCap * 0.72, capY - razaCap * 0.58);
  ctx.lineTo(capX + razaCap * 0.42, capY - razaCap * 0.72);
  ctx.lineTo(capX - razaCap * 0.06, capY - razaCap * 1.80);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = CLOVN.galben;
  elipsa(capX - razaCap * 0.06, capY - razaCap * 1.86, razaCap * 0.20, razaCap * 0.20);
  ctx.fill();

  // --- Nasul: singurul lucru din față care se vede de aici.
  ctx.fillStyle = CLOVN.nas;
  elipsa(capX + razaCap * 0.86 * intoarcere, capY + razaCap * 0.16,
         razaCap * 0.28, razaCap * 0.26);
  ctx.fill();
}

// Când pierde mâna, clovnul își aruncă în aer cărțile rămase. Cad înapoi
// singure: la starea „pauză" tot ce e pe masă se întoarce oricum la teanc.
function aruncaCartileInAer(p) {
  for (let i = 0; i < p.mana.length; i++) {
    const c = p.mana[i];
    c.fataInSus = true;
    mutaCarte(c,
      c.x + intreg(-6, 6) * U,
      c.y - intreg(10, 16) * U,
      c.rot + intreg(-1.8, 1.8),
      0.55, i * 0.06);
  }
}

// Clovnul își ia în primire contractul: desenul lui și reacțiile lui.
const clovnul = personaje[0];
clovnul.deseneaza = function (context, t) { deseneazaClovn(this, context, t); };
clovnul.reactie = function (tip, cine) {
  if (tip === "pierdere") aruncaCartileInAer(this);
  else if (tip === "vecinCastiga" && cine) {
    // Se răsucește spre cel care a luat mâna, ca să-i vadă mutra.
    this.privesteSpre = cine.x < this.x ? -1 : 1;
    this.privesteTimp = 2.2;
  }
};
clovnul.actualizeaza = function (dt) {
  if (this.privesteTimp > 0) this.privesteTimp = Math.max(0, this.privesteTimp - dt);
};

/* ==========================================================================
   5c. DRACONIANUL
   ========================================================================== */

/* Stă în spate-stânga, întors spre masă, deci îl vedem din față. E cel mai
   mare de la masă și cel mai nemișcat: respiră greu, îi tresar aripile, atât.
   Toată energia lui iese dintr-odată, pe bot, când pierde. */

const DRACON = {
  solzi:    "#4a6b3a",
  solziSus: "#7d9e52",
  solziJos: "#405c35",
  aripa:    "#3a5230",
  membrana: "#6b8a45",
  burta:    "#c8b06a",
  gheara:   "#efe6cd",
  corn:     "#cbbb99",
  ochi:     "#e8b93c",
  pupila:   "#1d1610"
};

function deseneazaDraconian(p, ctx, t) {
  const lat = p.latime * U;
  const inalt = p.inaltime * U;

  // --- Aripile pliate pe spate, în urma trupului. Doar ele se mișcă vizibil.
  for (let s = -1; s <= 1; s += 2) {
    const tresarire = 0.055 * Math.sin(t * 0.8 + p.faza + s * 1.3);
    ctx.save();
    ctx.translate(s * lat * 0.34, -inalt * 0.84);
    ctx.rotate(s * (0.10 + tresarire));

    ctx.fillStyle = DRACON.aripa;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(s * lat * 0.30, -inalt * 0.36, s * lat * 0.12, -inalt * 0.54);
    ctx.lineTo(s * lat * 0.40, -inalt * 0.16);
    ctx.quadraticCurveTo(s * lat * 0.34, inalt * 0.12, 0, 0);
    ctx.closePath();
    ctx.fill();

    // Nervurile membranei.
    ctx.strokeStyle = DRACON.membrana;
    ctx.lineWidth = 0.22 * U;
    for (let i = 1; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(s * lat * 0.04, -inalt * 0.02);
      ctx.lineTo(s * lat * (0.16 + i * 0.09), -inalt * (0.40 - i * 0.14));
      ctx.stroke();
    }
    ctx.restore();
  }

  // --- Picioarele, groase, cu gheare.
  for (let s = -1; s <= 1; s += 2) {
    ctx.fillStyle = DRACON.solziJos;
    dreptunghiRotunjit(s * lat * 0.24 - lat * 0.15, -inalt * 0.34,
                       lat * 0.30, inalt * 0.34, lat * 0.13);
    ctx.fill();
    ctx.fillStyle = DRACON.gheara;
    for (let i = -1; i <= 1; i++) {
      elipsa(s * lat * 0.24 + i * lat * 0.09, -0.4 * U, lat * 0.04, lat * 0.035);
      ctx.fill();
    }
  }

  // --- Trupul: masiv, cu umeri lați și burtă deschisă la culoare.
  const piele = ctx.createLinearGradient(0, -inalt, 0, -inalt * 0.25);
  piele.addColorStop(0, DRACON.solziSus);
  piele.addColorStop(1, DRACON.solzi);
  ctx.fillStyle = DRACON.solzi;
  dreptunghiRotunjit(-lat * 0.42, -inalt, lat * 0.84, inalt * 0.78, lat * 0.28);
  ctx.fill();
  ctx.fillStyle = piele;
  dreptunghiRotunjit(-lat * 0.42, -inalt, lat * 0.84, inalt * 0.50, lat * 0.28);
  ctx.fill();

  ctx.fillStyle = DRACON.burta;
  elipsa(0, -inalt * 0.44, lat * 0.24, inalt * 0.26);
  ctx.fill();
  ctx.strokeStyle = "rgba(90, 70, 30, 0.35)";
  ctx.lineWidth = 0.2 * U;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.moveTo(-lat * 0.20, -inalt * (0.44 + i * 0.075));
    ctx.lineTo(lat * 0.20, -inalt * (0.44 + i * 0.075));
    ctx.stroke();
  }

  // --- Brațele scurte, cu gheare mari, întinse spre masă.
  for (let s = -1; s <= 1; s += 2) {
    ctx.save();
    ctx.translate(s * lat * 0.38, -inalt * 0.74);
    ctx.rotate(s * 0.75);
    ctx.fillStyle = DRACON.solzi;
    dreptunghiRotunjit(-lat * 0.10, 0, lat * 0.20, inalt * 0.34, lat * 0.10);
    ctx.fill();
    ctx.fillStyle = DRACON.gheara;
    for (let i = -1; i <= 1; i++) {
      elipsa(i * lat * 0.07, inalt * 0.35, lat * 0.045, lat * 0.05);
      ctx.fill();
    }
    ctx.restore();
  }

  // --- Capul: craniu, bot lung spre masă, falcă și dinți.
  const capY = -inalt - lat * 0.20;
  ctx.fillStyle = DRACON.solzi;
  elipsa(-lat * 0.04, capY, lat * 0.34, lat * 0.27);
  ctx.fill();

  // Botul, îndreptat spre centrul mesei.
  ctx.fillStyle = DRACON.solzi;
  dreptunghiRotunjit(lat * 0.14, capY - lat * 0.10, lat * 0.52, lat * 0.20, lat * 0.07);
  ctx.fill();
  ctx.fillStyle = DRACON.solziJos;                 // falca de jos
  dreptunghiRotunjit(lat * 0.14, capY + lat * 0.08, lat * 0.46, lat * 0.10, lat * 0.04);
  ctx.fill();

  ctx.fillStyle = DRACON.gheara;                   // dinții
  for (let i = 0; i < 4; i++) {
    ctx.beginPath();
    ctx.moveTo(lat * (0.22 + i * 0.10), capY + lat * 0.09);
    ctx.lineTo(lat * (0.26 + i * 0.10), capY + lat * 0.09);
    ctx.lineTo(lat * (0.24 + i * 0.10), capY + lat * 0.17);
    ctx.closePath();
    ctx.fill();
  }

  ctx.fillStyle = DRACON.pupila;                   // nările
  elipsa(lat * 0.60, capY - lat * 0.04, lat * 0.025, lat * 0.02);
  ctx.fill();

  // Coarnele, întoarse spre spate.
  ctx.fillStyle = DRACON.corn;
  for (let s = -1; s <= 1; s += 2) {
    ctx.beginPath();
    ctx.moveTo(-lat * 0.10, capY - lat * 0.18 + s * lat * 0.05);
    ctx.lineTo(-lat * 0.40, capY - lat * 0.34 + s * lat * 0.10);
    ctx.lineTo(-lat * 0.12, capY - lat * 0.08 + s * lat * 0.05);
    ctx.closePath();
    ctx.fill();
  }

  // --- Ochii: galbeni, cu pupilă îngustă. Se uită spre masă.
  const ochi = [[-lat * 0.02, capY - lat * 0.10], [lat * 0.16, capY - lat * 0.09]];
  for (const o of ochi) {
    ctx.fillStyle = DRACON.ochi;
    elipsa(o[0], o[1], lat * 0.065, lat * 0.055);
    ctx.fill();
    ctx.fillStyle = DRACON.pupila;
    elipsa(o[0] + lat * 0.02, o[1], lat * 0.014, lat * 0.045);
    ctx.fill();
  }
}

// Suflă foc din bot, spre centrul mesei și puțin în sus.
function sufleFoc(p, cate) {
  const unghi = Math.atan2(cy - p.guraY, cx - p.guraX) - 0.30;
  aprindeFoc(p.guraX, p.guraY, unghi, cate, 1);
}

const draconianul = personaje[1];
draconianul.gura = { x: 11.2, y: -25.6 };   // vârful botului, în unități U
draconianul.deseneaza = function (context, t) { deseneazaDraconian(this, context, t); };
draconianul.reactie = function (tip) {
  // E nervos des: pierderea îi aprinde botul pentru o clipă.
  if (tip === "pierdere") { this.focTimp = 0.9; sufleFoc(this, 18); }
  // Când câștigă altcineva, mârâie: doar un fum scurt pe nări.
  else if (tip === "vecinCastiga") aprindeFum(this.guraX, this.guraY, 9);
};
draconianul.actualizeaza = function (dt) {
  if (!this.focTimp) return;
  this.focTimp = Math.max(0, this.focTimp - dt);
  if (this.focTimp > 0) sufleFoc(this, Math.max(1, Math.round(dt * 110)));
};

/* ==========================================================================
   5d. REPTILIANUL
   ========================================================================== */

/* Stă în spate-dreapta, întors spre masă. Singurul îmbrăcat ca lumea și
   singurul care nu face nimic: nu tresare, nu sărbătorește, nu se supără.
   Toată prezența lui e că e nemișcat lângă ceilalți doi. */

const REPT = {
  solzi:    "#3d6357",
  solziSus: "#587f70",
  solziJos: "#33544a",
  burta:    "#c3c9a4",
  haina:    "#2c3b52",
  camasa:   "#e6e2d3",
  cravata:  "#8a3b3b",
  ochi:     "#d8c76a",
  pupila:   "#161b18",
  gheara:   "#e8e4d2"
};

// Clipitul: rar și scurt, cu pleoapa care trece lateral peste ochi.
// Întoarce 0 (ochi deschis) … 1 (ochi acoperit).
function clipire(p, t) {
  const perioada = 5.5;
  const x = ((t + p.faza) % perioada) / perioada;
  const cat = 0.035;                       // ține sub 0,2 s dintr-un ciclu de 5,5 s
  return x < cat ? Math.sin((x / cat) * Math.PI) : 0;
}

function deseneazaReptilian(p, ctx, t) {
  const lat = p.latime * U;
  const inalt = p.inaltime * U;

  // --- Coada, ieșită într-o parte pe după scaun.
  ctx.fillStyle = REPT.solziJos;
  ctx.beginPath();
  ctx.moveTo(lat * 0.20, -inalt * 0.10);
  ctx.quadraticCurveTo(lat * 0.95, -inalt * 0.06, lat * 1.15, -inalt * 0.24);
  ctx.quadraticCurveTo(lat * 0.85, inalt * 0.04, lat * 0.20, -0.4 * U);
  ctx.closePath();
  ctx.fill();

  // --- Picioarele, în pantaloni, cu gheare afară.
  for (let s = -1; s <= 1; s += 2) {
    ctx.fillStyle = REPT.haina;
    dreptunghiRotunjit(s * lat * 0.22 - lat * 0.14, -inalt * 0.40,
                       lat * 0.28, inalt * 0.38, lat * 0.10);
    ctx.fill();
    ctx.fillStyle = REPT.gheara;
    for (let i = -1; i <= 1; i++) {
      elipsa(s * lat * 0.22 + i * lat * 0.08, -0.5 * U, lat * 0.035, lat * 0.03);
      ctx.fill();
    }
  }

  // --- Trupul: solzi, peste ei cămașa și haina închisă la culoare.
  ctx.fillStyle = REPT.solzi;
  dreptunghiRotunjit(-lat * 0.34, -inalt, lat * 0.68, inalt * 0.68, lat * 0.24);
  ctx.fill();

  ctx.fillStyle = REPT.camasa;
  dreptunghiRotunjit(-lat * 0.13, -inalt * 0.98, lat * 0.26, inalt * 0.52, lat * 0.05);
  ctx.fill();
  ctx.fillStyle = REPT.cravata;
  ctx.beginPath();
  ctx.moveTo(-lat * 0.045, -inalt * 0.95);
  ctx.lineTo(lat * 0.045, -inalt * 0.95);
  ctx.lineTo(lat * 0.02, -inalt * 0.52);
  ctx.lineTo(-lat * 0.02, -inalt * 0.52);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = REPT.haina;                    // cele două clape ale hainei
  for (let s = -1; s <= 1; s += 2) {
    ctx.beginPath();
    ctx.moveTo(s * lat * 0.34, -inalt);
    ctx.lineTo(s * lat * 0.09, -inalt * 0.97);
    ctx.lineTo(s * lat * 0.17, -inalt * 0.40);
    ctx.lineTo(s * lat * 0.34, -inalt * 0.40);
    ctx.closePath();
    ctx.fill();
  }

  // --- Brațele, cu mâneci și gheare, sprijinite pe masă.
  for (let s = -1; s <= 1; s += 2) {
    ctx.save();
    ctx.translate(s * lat * 0.31, -inalt * 0.90);
    ctx.rotate(s * 0.42);
    ctx.fillStyle = REPT.haina;
    dreptunghiRotunjit(-lat * 0.09, 0, lat * 0.18, inalt * 0.40, lat * 0.09);
    ctx.fill();
    ctx.fillStyle = REPT.gheara;
    elipsa(0, inalt * 0.42, lat * 0.10, lat * 0.085);
    ctx.fill();
    ctx.restore();
  }

  // --- Capul: craniu turtit și bot lung, întors spre centrul mesei.
  const capY = -inalt - lat * 0.17;
  ctx.fillStyle = REPT.solzi;
  elipsa(lat * 0.06, capY, lat * 0.30, lat * 0.22);
  ctx.fill();

  // Botul: mai lat decât înalt, întins spre masă.
  ctx.fillStyle = REPT.solzi;
  dreptunghiRotunjit(-lat * 0.66, capY - lat * 0.06, lat * 0.62, lat * 0.17, lat * 0.06);
  ctx.fill();
  ctx.fillStyle = REPT.solziJos;                 // falca de jos
  dreptunghiRotunjit(-lat * 0.62, capY + lat * 0.08, lat * 0.56, lat * 0.08, lat * 0.03);
  ctx.fill();

  ctx.fillStyle = REPT.burta;                    // linia dinților, abia ghicită
  for (let i = 0; i < 5; i++) {
    elipsa(-lat * (0.58 - i * 0.11), capY + lat * 0.08, lat * 0.018, lat * 0.022);
    ctx.fill();
  }
  ctx.fillStyle = REPT.pupila;                   // nara
  elipsa(-lat * 0.60, capY - lat * 0.01, lat * 0.02, lat * 0.016);
  ctx.fill();

  // --- Ochii, sus pe craniu. Pleoapa trece lateral peste ei.
  const c = clipire(p, t);
  const ochi = [[-lat * 0.10, capY - lat * 0.13], [lat * 0.10, capY - lat * 0.15]];
  for (const o of ochi) {
    ctx.fillStyle = REPT.solziJos;               // orbita
    elipsa(o[0], o[1], lat * 0.085, lat * 0.075);
    ctx.fill();
    ctx.fillStyle = REPT.ochi;
    elipsa(o[0], o[1], lat * 0.062 * (1 - 0.92 * c), lat * 0.055);
    ctx.fill();
    if (c < 0.5) {
      ctx.fillStyle = REPT.pupila;
      elipsa(o[0], o[1], lat * 0.014 * (1 - 2 * c), lat * 0.042);
      ctx.fill();
    }
  }
}

const reptilianul = personaje[2];
reptilianul.deseneaza = function (context, t) { deseneazaReptilian(this, context, t); };
reptilianul.reactie = function () {
  // Nu arată nimic, orice ar primi. Anulează și tresărirea comună — contrastul
  // cu ceilalți doi e tot efectul lui.
  this.reactieAmpl = 0;
  this.reactieTimp = 0;
};

/* ==========================================================================
   6. MAȘINA DE STĂRI A UNEI MÂINI
   ========================================================================== */

/* Ciclul, la nesfârșit:
     impartire → gandire → jucare → castigator → reactie → pauza → impartire  */

const CARTI_IN_MANA = 3;

let stare = "";
let tStare = 0;        // de cât timp durează starea curentă
let cronometru = 0;    // pentru pașii dinăuntrul unei stări
let impartite = 0;
let jucate = 0;
let startator = 0;     // cine primește prima carte și joacă primul
let castigator = null;
let durataGandire = 1.5;
const cartiPeMasa = [];

function schimbaStarea(noua) {
  stare = noua;
  tStare = 0;

  if (noua === "impartire") {
    impartite = 0;
    cronometru = 0.25;
  }
  else if (noua === "gandire") {
    for (const p of personaje) trimiteEveniment(p, "gandeste");
    // Masa așteaptă cât are nevoie cel mai lent dintre ei.
    durataGandire = 0.6;
    for (const p of personaje) durataGandire = Math.max(durataGandire, timpDeGandire(p) * 0.9);
  }
  else if (noua === "jucare") {
    jucate = 0;
    cronometru = 0.2;
  }
  else if (noua === "castigator") {
    castigator = alegeCastigator();
    // Cărțile de pe masă se strâng spre câștigător.
    for (let i = 0; i < cartiPeMasa.length; i++) {
      const c = cartiPeMasa[i];
      c.fataInSus = false;
      mutaCarte(c, castigator.manaX, castigator.manaY, castigator.rotCarte, 0.55, i * 0.06);
    }
  }
  else if (noua === "reactie") {
    for (const p of personaje) {
      trimiteEveniment(p, p === castigator ? "castig" : "pierdere");
    }
    // Și, separat, ce s-a întâmplat la masă: cine a luat mâna. Fiecare face ce
    // vrea cu informația asta — sau nimic, ca reptilianul.
    for (const p of personaje) {
      if (p !== castigator) trimiteEveniment(p, "vecinCastiga", castigator);
    }
  }
  else if (noua === "pauza") {
    // Tot ce a rămas se întoarce la teanc.
    for (const c of carti) {
      c.fataInSus = false;
      mutaCarte(c, teanc.x, teanc.y, -0.12, 0.5, Math.random() * 0.12);
    }
  }
}

// Reptilianul e cel mai bun jucător dintre cei trei, și se vede.
function alegeCastigator() {
  const sanse = [0.24, 0.30, 0.46];
  let r = Math.random(), acum = 0;
  for (let i = 0; i < personaje.length; i++) {
    acum += sanse[i];
    if (r <= acum) return personaje[i];
  }
  return personaje[personaje.length - 1];
}

function actualizeazaJocul(dt) {
  tStare += dt;
  cronometru -= dt;

  if (stare === "impartire") {
    if (cronometru <= 0 && impartite < CARTI_IN_MANA * personaje.length) {
      const p = personaje[(startator + impartite) % personaje.length];
      const c = creeazaCarte(teanc.x, teanc.y, -0.12);
      c.proprietar = p;
      carti.push(c);
      p.mana.push(c);
      rearanjeazaMana(p, 0.42);
      impartite++;
      cronometru = 0.17;
    }
    if (impartite >= CARTI_IN_MANA * personaje.length && cronometru <= -0.45) {
      schimbaStarea("gandire");
    }
  }

  else if (stare === "gandire") {
    if (tStare > durataGandire) schimbaStarea("jucare");
  }

  else if (stare === "jucare") {
    if (cronometru <= 0 && jucate < personaje.length) {
      const p = personaje[(startator + jucate) % personaje.length];
      const c = p.mana.pop();
      c.fataInSus = true;
      // Cartea aterizează puțin dezordonat — nimeni nu pune perfect drept.
      mutaCarte(c,
        p.masaX + intreg(-0.8, 0.8) * U,
        p.masaY + intreg(-0.8, 0.8) * U,
        p.rotCarte + intreg(-0.14, 0.14),
        0.45, 0);
      cartiPeMasa.push(c);
      rearanjeazaMana(p, 0.3);
      trimiteEveniment(p, "joaca");
      jucate++;
      // Fiecare se gândește cât îi e felul înainte să pună cartea.
      const urmator = personaje[(startator + jucate) % personaje.length];
      cronometru = 0.25 + timpDeGandire(urmator) * 0.5;
    }
    if (jucate >= personaje.length && cronometru <= -0.5) {
      schimbaStarea("castigator");
    }
  }

  else if (stare === "castigator") {
    if (tStare > 0.85) schimbaStarea("reactie");
  }

  else if (stare === "reactie") {
    if (tStare > 1.5) schimbaStarea("pauza");
  }

  else if (stare === "pauza") {
    if (tStare > 0.9) {
      // Masa se golește și mâna următoare începe de la câștigător.
      carti.length = 0;
      cartiPeMasa.length = 0;
      for (const p of personaje) p.mana.length = 0;
      startator = personaje.indexOf(castigator);
      if (startator < 0) startator = 0;
      schimbaStarea("impartire");
    }
  }
}

/* ==========================================================================
   7. BUCLA PRINCIPALĂ
   ========================================================================== */

let ultimulTimp = 0;
let t = 0;   // timpul total, folosit de animațiile de idle

function actualizeazaTot(dt) {
  actualizeazaJocul(dt);
  for (const p of personaje) actualizeazaPersonaj(p, dt);
  for (const c of carti) actualizeazaCarte(c, dt);
  actualizeazaParticule(dt);
}

/* Ordinea de desenare ține loc de adâncime: cine e mai aproape, mai târziu.
   Tot ea îi așază pe scaune — pe cei din spate îi acoperă masa de la brâu în
   jos, iar celui din față îi trece spătarul scaunului peste picioare. */
function deseneazaTot() {
  deseneazaFundal();
  deseneazaBar();
  deseneazaMasa2();

  for (const p of personaje) {
    if (Math.sin(p.unghi) < 0) {          // cei din spate
      deseneazaScaun(p);
      deseneazaSpatar(p);
      deseneazaPersonaj(p, t);
    }
  }

  deseneazaMasa();

  for (const p of personaje) {
    if (Math.sin(p.unghi) >= 0) {         // cel din față
      deseneazaScaun(p);
      deseneazaPersonaj(p, t);
      deseneazaSpatar(p);
    }
  }

  deseneazaTeanc();
  for (const c of carti) deseneazaCarte(c);
  deseneazaParticule();

  deseneazaLumina();
  deseneazaVigneta();
}

function cadru(acum) {
  // dt în secunde, limitat ca scena să nu sară după ce revii într-un tab uitat.
  let dt = (acum - ultimulTimp) / 1000;
  ultimulTimp = acum;
  if (!isFinite(dt) || dt < 0) dt = 0;
  dt = Math.min(dt, 0.05);
  t += dt;

  actualizeazaTot(dt);
  deseneazaTot();

  requestAnimationFrame(cadru);
}

window.addEventListener("resize", redimensioneaza);
redimensioneaza();
schimbaStarea("impartire");
requestAnimationFrame(function (acum) {
  ultimulTimp = acum;
  requestAnimationFrame(cadru);
});
</script>
