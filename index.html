// Îmbracă doi musafiri noi. Nu ies niciodată amândoi la fel.
function imbracaMusafirii() {
  for (let i = 0; i < vizita.musafiri.length; i++) {
    const m = vizita.musafiri[i];
    const haine = alegeDin(HAINE);
    m.paleta = {
      pantalon: haine.pantalon, camasa: haine.camasa, maneca: haine.camasa,
      piele: alegeDin(PIELI), par: alegeDin(PARURI),
      accesoriu: alegeDin(CULORI_ACCESORIU)
    };
    m.semn = alegeDin(ACCESORII);
    m.inaltime = 16.5 + intreg(0, 2);
    m.latime = 8 + intreg(0, 1.2);
    m.faza = intreg(0, 6);
  }
  // Dacă s-a nimerit aceeași cămașă la amândoi, o schimbăm pe a doua.
  if (vizita.musafiri[0].paleta.camasa === vizita.musafiri[1].paleta.camasa) {
    const alta = alegeDin(HAINE);
    vizita.musafiri[1].paleta.camasa = alta.camasa;
    vizita.musafiri[1].paleta.maneca = alta.camasa;
    vizita.musafiri[1].paleta.pantalon = alta.pantalon;
  }
}

// Cere modelului următoarele două replici. Dacă tace, rămân cele scrise de mână.
function cereVorbaDeLaModel() {
  if (!AI.activ || vizita.asteptVorba || vizita.deSpus.length) return;
  vizita.asteptVorba = true;
  AI.discuta(vizita.istoric, function (pereche) {
    vizita.asteptVorba = false;
    if (pereche && vizita.stare === "asezati") vizita.deSpus.push(pereche);
  });
}

/* Au văzut ceva la masa noastră. Dacă sunt acolo și n-au altceva pe limbă,
   comentează la următorul schimb de vorbe. */
vizita.vede = function (subiect) {
  if (this.stare !== "asezati") return;
  if (this.deSpus.length >= 2) return;          // nu ține minte mai mult de-atât
  const variante = VORBE_DESPRE[subiect];
  if (!variante) return;
  this.deSpus.push(variante[Math.floor(intreg(0, variante.length)) % variante.length]);
};

function creeazaMusafir(nume) {
  const m = {
    nume: nume, paleta: null, semn: "nimic",
    latime: 8.5, inaltime: 17.5, scara: 0.92, faza: 0,
    x: 0, y: 0, pas: 0, directie: 1, tintaX: 0, tintaY: 0,
    asezatLateral: true, scaunInalt: 4.4,
    asezatSpre: 0            // în picioare cât umblă; se așază când ajung la masă
  };
  m.actualizeaza = function () {};      // de el se ocupă ciclul vizitei
  m.deseneaza = function (context, t) {
    if (vizita.stare === "gol") return;
    context.save();
    context.translate(this.x, this.y);
    context.scale(this.scara, this.scara);
    // Așezați la masă, se văd din profil; pe drum merg în picioare, ca oricine.
    const paleta = Object.assign({}, this.paleta, {
      asezat: vizita.stare === "asezati" ? this.asezatSpre : 0
    });
    trupDeOm(this, paleta, t);
    context.translate(0, this.coborare || 0);

    const lat = this.latime * U, inalt = this.inaltime * U;
    ctx.fillStyle = this.paleta.accesoriu;
    if (this.semn === "palarie") {
      elipsa(0, -inalt - lat * 0.44, lat * 0.42, lat * 0.09);
      ctx.fill();
      dreptunghiRotunjit(-lat * 0.20, -inalt - lat * 0.76, lat * 0.40, lat * 0.34, lat * 0.06);
      ctx.fill();
    } else if (this.semn === "fular") {
      dreptunghiRotunjit(-lat * 0.22, -inalt - lat * 0.06, lat * 0.44, lat * 0.16, lat * 0.06);
      ctx.fill();
      dreptunghiRotunjit(lat * 0.02, -inalt + lat * 0.06, lat * 0.14, lat * 0.34, lat * 0.05);
      ctx.fill();
    } else if (this.semn === "ochelari") {
      for (let s = -1; s <= 1; s += 2) {
        elipsa(s * lat * 0.11, -inalt - lat * 0.36, lat * 0.09, lat * 0.07);
        ctx.fill();
      }
      dreptunghiRotunjit(-lat * 0.03, -inalt - lat * 0.38, lat * 0.06, lat * 0.03, lat * 0.01);
      ctx.fill();
    }
    context.restore();
  };
  return m;
}

function locDeLaMasa3(i) {
  return {
    x: masa3.x + (i === 0 ? -1 : 1) * masa3.rx * 0.80,
    y: masa3.y + masa3.ry * 0.05
  };
}

function actualizeazaVizita(dt) {
  vizita.cronometru -= dt;

  if (vizita.stare === "gol") {
    if (vizita.cronometru <= 0) {
      vizita.stare = "vin";
      imbracaMusafirii();          // de fiecare dată intră alți doi
      vizita.serviti = false;
      vizita.istoric.length = 0;
      for (let i = 0; i < 2; i++) {
        const m = vizita.musafiri[i];
        m.x = -8 * U - i * 6 * U;                 // intră din stânga, unul după altul
        m.y = masa3.y + masa3.ry * 2.2;
        const loc = locDeLaMasa3(i);
        m.tintaX = loc.x;
        m.tintaY = loc.y;
      }
    }
    return;
  }

  if (vizita.stare === "vin" || vizita.stare === "pleaca") {
    let toti = true;
    for (const m of vizita.musafiri) {
      if (!mergiSpre(m, m.tintaX, m.tintaY, 20 * U, dt)) toti = false;
    }
    if (!toti) return;

    if (vizita.stare === "vin") {
      vizita.stare = "asezati";
      vizita.cronometru = intreg(45, 80);
      vizita.vorbaTimp = intreg(1.5, 3.5);
      vizita.vorbeste = -1;
      vizita.pereche = null;
      cereVorbaDeLaModel();
    } else {
      vizita.stare = "gol";
      vizita.cronometru = intreg(25, 50);
      vizita.deSpus.length = 0;      // ce-au văzut aseară nu mai spun mâine
    }
    return;
  }

  // Așezați: vorbesc pe rând, cu pauze între schimburi. Dacă au văzut ceva la
  // masa noastră, despre asta vorbesc întâi.
  vizita.vorbaTimp -= dt;
  if (vizita.vorbaTimp <= 0) {
    if (vizita.vorbeste === 1) {                  // s-a terminat schimbul
      vizita.vorbeste = -1;
      vizita.pereche = null;
      vizita.vorbaTimp = intreg(3, 7);
      cereVorbaDeLaModel();                       // pregătim ce urmează
    } else {
      if (!vizita.pereche) {
        if (vizita.deSpus.length) {
          vizita.pereche = vizita.deSpus.shift();
        } else {
          vizita.pereche = VORBE[vizita.schimb];
          vizita.schimb = (vizita.schimb + 1) % VORBE.length;
        }
      }
      vizita.vorbeste = vizita.vorbeste < 0 ? 0 : 1;
      vizita.replica = vizita.pereche[vizita.vorbeste];
      vizita.vorbaTimp = 2.8;
      vizita.istoric.push(vizita.replica);
      if (vizita.istoric.length > 4) vizita.istoric.shift();
    }
  }

  if (vizita.cronometru <= 0) {
    vizita.stare = "pleaca";
    vizita.vorbeste = -1;
    for (let i = 0; i < 2; i++) {
      vizita.musafiri[i].tintaX = -10 * U - i * 6 * U;
      vizita.musafiri[i].tintaY = masa3.y + masa3.ry * 2.2;
    }
  }
}

/* Masa a treia, în două bucăți ca și celelalte: musafirii stau între ele. */
function deseneazaMasa3Sub() {
  ctx.fillStyle = LOCAL.piciorMasa;
  dreptunghiRotunjit(masa3.x - 2 * U, masa3.y, 4 * U, masa3.ry * 1.5, U);
  ctx.fill();
  elipsa(masa3.x, masa3.y + masa3.ry * 1.5, 6 * U, 2.2 * U);
  ctx.fill();

  // Scaunele lor, de profil: stau față în față, ca și șahiștii de la masa a doua.
  if (vizita.musafiri.length) {
    for (const m of vizita.musafiri) deseneazaScaunLateral(m);
  }
}

function deseneazaMasa3Blat() {
  ctx.fillStyle = LOCAL.muchieMasa2;
  elipsa(masa3.x, masa3.y + 2 * U, masa3.rx, masa3.ry);
  ctx.fill();
  ctx.fillStyle = LOCAL.blatMasa2;
  elipsa(masa3.x, masa3.y, masa3.rx, masa3.ry);
  ctx.fill();

  if (vizita.stare !== "asezati") return;

  // Cum s-au așezat, au și sticla de vin în mijlocul mesei, între ei.
  sticlaDeVin(masa3.x, masa3.y - 0.4 * U, 0.62, 1);

  // Paharele apar abia după ce trece chelnerul pe la ei.
  if (vizita.serviti) {
    ctx.fillStyle = "rgba(226, 232, 236, 0.35)";
    for (let s = -1; s <= 1; s += 2) {
      dreptunghiRotunjit(masa3.x + s * masa3.rx * 0.30 - 1.3 * U, masa3.y - 4.4 * U,
                         2.6 * U, 4.4 * U, 0.4 * U);
      ctx.fill();
    }
  }
}

// O bulă de vorbă deasupra cuiva. O folosesc și musafirii, și dealerul.
function bulaDeVorba(p, text) {
  ctx.font = Math.round(2.6 * U) + "px system-ui, sans-serif";
  ctx.textAlign = "center";
  const lat = ctx.measureText(text).width + 3.4 * U;
  const jos = p.y - p.inaltime * U * p.scara - 5 * U;

  // Bula nu are voie să iasă din ecran, oricât de aproape de margine ar sta el.
  const mijloc = Math.max(lat / 2 + U, Math.min(p.x, W - lat / 2 - U));

  ctx.fillStyle = "rgba(22, 16, 11, 0.88)";
  dreptunghiRotunjit(mijloc - lat / 2, jos - 4.2 * U, lat, 4.6 * U, 0.9 * U);
  ctx.fill();
  ctx.beginPath();                       // coada bulei
  ctx.moveTo(p.x - 1.1 * U, jos + 0.3 * U);
  ctx.lineTo(p.x + 1.1 * U, jos + 0.3 * U);
  ctx.lineTo(p.x, jos + 2 * U);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#e8dcc4";
  ctx.fillText(text, mijloc, jos - 1.2 * U);
}

// Ce zice dealerul când se bagă și el într-o mână.
function deseneazaVorbaDealerului() {
  if (!(dealerul.vorbaTimp > 0) || !dealerul.vorba) return;
  bulaDeVorba(dealerul, dealerul.vorba);
}

// Vorba celui care vorbește acum, scrisă deasupra lui.
function deseneazaVorba() {
  if (vizita.vorbeste < 0 || vizita.stare !== "asezati") return;
  const m = vizita.musafiri[vizita.vorbeste];

  ctx.font = Math.round(2.6 * U) + "px system-ui, sans-serif";
  ctx.textAlign = "center";
  const lat = ctx.measureText(vizita.replica).width + 3.4 * U;
  const jos = m.y - m.inaltime * U * m.scara - 5 * U;

  // Bula nu are voie să iasă din ecran, oricât de aproape de margine ar sta el.
  const mijloc = Math.max(lat / 2 + U, Math.min(m.x, W - lat / 2 - U));

  ctx.fillStyle = "rgba(22, 16, 11, 0.88)";
  dreptunghiRotunjit(mijloc - lat / 2, jos - 4.2 * U, lat, 4.6 * U, 0.9 * U);
  ctx.fill();
  ctx.beginPath();                       // coada bulei
  ctx.moveTo(m.x - 1.1 * U, jos + 0.3 * U);
  ctx.lineTo(m.x + 1.1 * U, jos + 0.3 * U);
  ctx.lineTo(m.x, jos + 2 * U);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle = "#e8dcc4";
  ctx.fillText(vizita.replica, mijloc, jos - 1.2 * U);
}

/* --- Așezarea lor în local ------------------------------------------------ */

/* Unde se oprește chelnerul când vine la masa noastră: în colțul din față-
   stânga, între dealer și clovn. Pe latura din stânga stă dealerul, deci nu
   poate veni de-acolo. */
function loculLaMasa() {
  return { x: cx - masa.rx * 0.92, y: cy + masa.ry * 1.45 };
}

/* Colțul prin care ocolește masa. Între bar și masa noastră drumul drept ar
   trece de-a curmezișul blatului, iar el se desenează în fața mesei — ar părea
   că umblă pe masă. Așa iese întâi în stânga ei, pe lângă dealer, și abia de
   acolo urcă la bar. */
function ocolulMesei() {
  return { x: cx - masa.rx * 1.50, y: cy - masa.ry * 0.50 };
}

function asazaFundalul() {
  // Destul de sus cât să li se vadă mai mult de jumătate de om peste blat.
  omulCuMana.x = masa2.x - masa2.rx * 0.80;
  omulCuMana.y = masa2.y + masa2.ry * 0.05;
  omulDeAur.x = masa2.x + masa2.rx * 0.80;
  omulDeAur.y = masa2.y + masa2.ry * 0.05;

  chelnerul.drum = [
    { x: W * 0.30, y: bar.y + bar.inalt + 7 * U, pauza: 2.2 },                    // la bar
    { x: masa2.x + masa2.rx * 0.1, y: masa2.y + masa2.ry * 2.4, pauza: 3.0 },     // la masa a doua
    { x: masa3.x + masa3.rx * 0.9, y: masa3.y - masa3.ry * 1.2, pauza: 3.0,       // la masa a treia
      laMasa3: true },
    { x: loculLaMasa().x, y: loculLaMasa().y, pauza: 2.6 },                       // pe la noi
    { x: ocolulMesei().x, y: ocolulMesei().y, pauza: 0 },                         // ocolește masa
    { x: W * 0.66, y: bar.y + bar.inalt + 7 * U, pauza: 1.6 }                     // înapoi spre bar
  ];
  if (!chelnerul.pornit) {
    chelnerul.x = chelnerul.drum[0].x;
    chelnerul.y = chelnerul.drum[0].y;
    chelnerul.pornit = true;
  }
  chelnerul.scara = scaraDupaAdancime(chelnerul.y);

  /* Barul are trei zone, fiecare cu omul ei: chiuveta în stânga de tot,
     robinetele la mijloc, bucătăria în dreapta de tot. Nimeni nu face treaba
     altuia. */
  bar.chiuveta = bar.x0 + 14 * U;
  bar.robinete = (bar.x0 + bar.x1) / 2;

  barmanul.x = bar.robinete;
  barmanul.y = bar.y + bar.inalt * 0.55;

  // Aragazul și masa de amestecat, pe blatul de lucru din dreapta.
  aragaz.x = bar.x1 - 13 * U;
  aragaz.y = bar.blat;
  bar.amestec = aragaz.x - 17 * U;

  bucatarul.x = aragaz.x - 6 * U;
  bucatarul.y = bar.y + bar.inalt * 0.55;
  spalatorul.x = bar.chiuveta;
  spalatorul.y = bar.y + bar.inalt * 0.55;

  if (!vizita.musafiri.length) {
    vizita.musafiri.push(creeazaMusafir("Musafirul din stânga"),
                         creeazaMusafir("Musafirul din dreapta"));
    // Se privesc peste masă: unul cu genunchii spre dreapta, celălalt spre stânga.
    vizita.musafiri[0].asezatSpre = 1;
    vizita.musafiri[1].asezatSpre = -1;
    imbracaMusafirii();
  }
  // Dacă tocmai stau la masă, îi mutăm odată cu masa la redimensionare.
  if (vizita.stare === "asezati") {
    for (let i = 0; i < 2; i++) {
      const loc = locDeLaMasa3(i);
      vizita.musafiri[i].x = loc.x;
      vizita.musafiri[i].y = loc.y;
    }
  }

  if (!fundal.length) {
    fundal.push(omulCuMana, omulDeAur, chelnerul, barmanul, bucatarul, spalatorul,
                vizita.musafiri[0], vizita.musafiri[1]);
  }
  asazaSahul();
}

function actualizeazaFundal(dt) {
  for (const p of fundal) p.actualizeaza(dt);
  actualizeazaVizita(dt);
  actualizeazaVorbele(dt);   // vorbele lor se sting cu localul, nu cu partida

  sah.cronometru -= dt;
  if (sah.cronometru <= 0) {
    mutaLaSah();
    sah.randul = 1 - sah.randul;
    sah.cronometru = intreg(4, 9);
  }
  for (const p of sah.piese) actualizeazaObiect(p, dt);
}

/* ==========================================================================
   5f. SUNETUL
   ========================================================================== */

/* Sunetele se fac în cod, ca și desenele: zgomot filtrat și câteva oscilatoare,
   niciun fișier. Contextul audio se deschide abia la primul clic, fiindcă
   browserele nu lasă altfel — până atunci scena e mută. */

const sunet = {
  ctx: null,
  zgomot: null,
  pornit: false,
  ultimul: null,

  porneste: function () {
    if (this.pornit) return;
    this.pornit = true;
    const Context = window.AudioContext || window.webkitAudioContext;
    if (!Context) return;
    try { this.ctx = new Context(); } catch (e) { this.ctx = null; return; }

    // Un pumn de zgomot alb, refolosit de toate sunetele.
    const n = Math.floor(this.ctx.sampleRate * 2);
    this.zgomot = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = this.zgomot.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  },

  // Zgomot printr-un filtru care se plimbă — de aici iese și turnatul, și sfâritul.
  siroi: function (durata, deLa, panaLa, volum, tip) {
    const c = this.ctx, acum = c.currentTime;
    const sursa = c.createBufferSource();
    sursa.buffer = this.zgomot;
    sursa.loop = true;

    const filtru = c.createBiquadFilter();
    filtru.type = tip || "bandpass";
    filtru.Q.value = tip === "lowpass" ? 1 : 4;
    filtru.frequency.setValueAtTime(deLa, acum);
    filtru.frequency.linearRampToValueAtTime(panaLa, acum + durata);

    const volumul = c.createGain();
    volumul.gain.setValueAtTime(0, acum);
    volumul.gain.linearRampToValueAtTime(volum, acum + 0.08);
    volumul.gain.setValueAtTime(volum, acum + durata - 0.15);
    volumul.gain.linearRampToValueAtTime(0, acum + durata);

    sursa.connect(filtru);
    filtru.connect(volumul);
    volumul.connect(c.destination);
    sursa.start(acum);
    sursa.stop(acum + durata + 0.05);
  },

  canta: function (nume) {
    this.ultimul = nume;
    if (!this.ctx) return;
    const c = this.ctx, acum = c.currentTime;

    if (nume === "turnat") {
      // Paharul se umple: sunetul urcă, de asta se aude că e un pahar.
      this.siroi(2.4, 420, 1500, 0.07);
    }
    else if (nume === "sfarait") {
      this.siroi(4.5, 2600, 2000, 0.05, "lowpass");
    }
    else if (nume === "sorbit") {
      this.siroi(0.5, 900, 300, 0.05);
    }
    else if (nume === "poc") {
      const o = c.createOscillator();
      const g = c.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(240, acum);
      o.frequency.exponentialRampToValueAtTime(120, acum + 0.12);
      g.gain.setValueAtTime(0.09, acum);
      g.gain.exponentialRampToValueAtTime(0.0001, acum + 0.14);
      o.connect(g); g.connect(c.destination);
      o.start(acum); o.stop(acum + 0.16);
    }
  }
};

   ========================================================================== */

/* Prima interacțiune din scenă, dintre cele trei — celelalte două sunt cărțile
   tale (secțiunea 6) și vorba (5h). Dai clic pe un personaj, vine chelnerul,
   alegi ce bea sau ce mănâncă — sau nimic —, iar restul se întâmplă singur.
   Partida nu se oprește nicio clipă cât timp chelnerul e pe drum. */

/* Meniul e o listă scrisă, ca la restaurant: felul, cât e porția, cât costă.
   Fără desene — la câte feluri sunt, ar fi fost cinci pahare la fel.

   Ultimele trei rânduri nu sunt feluri, ci sfârșitul comenzii: „doar atât" (le
   duce și ia meniul înapoi), „mă mai gândesc" (le duce, dar îți lasă meniul în
   față) și „nimic, mulțumesc" (pleacă cu mâna goală). */
const OPTIUNI = [
  { sectiune: "Mâncare" },
  { id: "mici",      nume: "mici cu piure",   cantitate: "300 g",  pret: "32 lei", fel: "mancare", culoare: "#8a5a33" },
  { id: "ciorba",    nume: "ciorbă de burtă", cantitate: "400 ml", pret: "24 lei", fel: "mancare", culoare: "#c8a76a" },
  { id: "cartofi",   nume: "cartofi prăjiți", cantitate: "200 g",  pret: "16 lei", fel: "mancare", culoare: "#d8a52a" },
  { sectiune: "Deserturi" },
  { id: "papanasi",  nume: "papanași",        cantitate: "250 g",  pret: "22 lei", fel: "mancare", desert: true, culoare: "#e8dfc0" },
  { id: "inghetata", nume: "înghețată",       cantitate: "150 g",  pret: "14 lei", fel: "mancare", desert: true, culoare: "#efe7ea" },
  { sectiune: "De băut" },
  { id: "suc",       nume: "Prigat",          cantitate: "0,5 l",  pret: "9 lei",  fel: "baut",    culoare: "#e07b1f" },
  { id: "bere",      nume: "bere",            cantitate: "0,5 l",  pret: "12 lei", fel: "baut",    culoare: "#d8a52a" },
  { id: "vin",       nume: "vin",             cantitate: "0,25 l", pret: "15 lei", fel: "baut",    culoare: "#7c2b33" },
  { id: "gata",      nume: "doar atât",        fel: "gata",    inchide: true },
  { id: "gandesc",   nume: "mă mai gândesc",   fel: "gandesc", inchide: true },
  { id: "nimic",     nume: "nimic, mulțumesc", fel: "nimic",   inchide: true }
];

// `alese` sunt felurile bifate acum, cele care pleacă la bar la următorul „gata".
const meniu = { deschis: false, pentru: null, randuri: [], optiuni: OPTIUNI, alese: [] };

// Prețul unui fel, în lei, citit din rândul lui de meniu ("24 lei" → 24).
function pretInLei(o) { return o.pret ? parseInt(o.pret, 10) : 0; }

/* Culorile din farfurii. Fiecare fel trebuie să se recunoască de la distanță,
   altfel n-are rost să-l ceri. */
const MANCARE = {
  farfurie:   "#efe7d6",
  adancitura: "#d9cfb8",
  piure:      "#ecdf9e",
  mic:        "#8a5a33",
  castron:    "#f2f0ea",
  zeama:      "#e8d067",
  legume:     "#c8503a",
  verdeata:   "#6b8f4a",
  cartof:     "#e8b93c",
  cartofUmbra:"#c2921f",
  papanas:    "#d8a24a",
  smantana:   "#f4f1e6",
  dulceata:   "#7b2340",
  cupa:       "rgba(226, 232, 236, 0.45)",
  inghetata:  "#5a3a2a",
  ciocolata:  "#33201a",
  sticla:     "#2f4a30",
  eticheta:   "#e8dcc4"
};
/* `lista` e rândul de feluri pe care le face barmanul acum, unul după altul;
   `ce` e cel la care lucrează. Dacă mai ceri ceva cât ăsta e pe drum, comanda
   nouă așteaptă la `coada` și pleacă imediat ce se golește tava. */
const comanda = {
  stare: "nimic", pentru: null, lista: [], index: 0, ce: null,
  cronometru: 0, coada: []
};
const pahare = [];
const aragaz = { x: 0, y: 0, fum: 0 };
// Chiuveta din stânga barului: aici ajung vasele goale strânse de pe mese.
const chiuveta = { vase: 0, spalat: 0 };

// Zona în care apeși ca să chemi chelnerul pentru cineva.
function apasatPe(p, x, y) {
  const lat = p.latime * U * p.scara, inalt = p.inaltime * U * p.scara;
  return x > p.x - lat * 0.7 && x < p.x + lat * 0.7 &&
         y > p.y - inalt * 1.4 && y < p.y + 2 * U;
}

// Îți torni singur din sticlă, atât cât încape într-un pahar.
function toarnaDinSticla(sticla) {
  const pahar = pahare.find(function (p) {
    return p.pentru === sticla.pentru && p.tip === "pahar" && p.optiune.id === sticla.optiune.id;
  });
  if (!pahar || sticla.nivel <= 0) return;
  sticla.nivel = Math.max(0, sticla.nivel - 0.34);
  if (sticla.nivel <= 0) sticla.golit = true;   // sticla goală se strânge de pe masă
  pahar.nivel = 1;
  pahar.cronometru = intreg(4, 9);
  sunet.canta("turnat");
}

function apasa(x, y) {
  sunet.porneste();

  // Clic pe o sticlă de pe masă: torni.
  for (const obiect of pahare) {
    if (obiect.tip !== "sticla" || obiect.nivel <= 0) continue;
    if (Math.abs(x - obiect.x) < 2.5 * U && y > obiect.y - 11 * U && y < obiect.y + 1.5 * U) {
      toarnaDinSticla(obiect);
      return;
    }
  }

  // Meniul deschis ia clicurile care cad pe el, dar numai pe ele: cu meniul în
  // față îți vine rândul la fel de des, deci cărțile trebuie să rămână ale tale.
  if (meniu.deschis) {
    for (const r of meniu.randuri) {
      if (x >= r.x0 && x <= r.x1 && y >= r.y0 && y <= r.y1) { alege(r.optiune); return; }
    }
  }

  // Dacă masa te așteaptă, un clic pe o carte de-a ta o pune pe masă.
  if (asteaptaJucator) {
    const eu = personaje.find(esteAlTau);
    for (const c of eu.mana) {
      const k = c.marime || 1;
      if (Math.abs(x - c.x) < latCarte * k * 0.62 && Math.abs(y - c.y) < inaltCarte * k * 0.62) {
        joacaCartea(eu, c.valoare);
        sunet.canta("poc");
        return;
      }
    }
  }

  /* Cu fereastra de vorbă deschisă, un clic pe cineva din local înseamnă „cu
     tine vorbesc acum" — nu „vino cu meniul". */
  if (chat.deschis) {
    for (const cineva of vorbitori()) {
      if (apasatPe(cineva, x, y)) { alegeVorbitorul(cineva); return; }
    }
  }

  if (meniu.deschis) return;                 // în rest, clicurile îl lasă deschis
  if (comanda.stare !== "nimic") return;     // e deja o comandă pe drum
  for (const p of personaje) {
    if (apasatPe(p, x, y)) { cheamaChelnerul(p); return; }
  }
}

function cheamaChelnerul(p) {
  comanda.stare = "vine";
  comanda.pentru = p;
  comanda.ce = null;
  const loc = loculLaMasa();
  chelnerul.misiune = {
    x: loc.x,
    y: loc.y,
    prin: ocolulMesei(),
    apoi: function () { deschideMeniul(p); }
  };
}

function deschideMeniul(p) {
  meniu.deschis = true;
  meniu.pentru = p;
  comanda.stare = "alege";
  asazaMeniul();
}

function asazaMeniul() {
  const p = meniu.pentru;
  const latRand = 52 * U, inaltRand = 4.2 * U;
  const inaltTot = OPTIUNI.length * inaltRand;

  let x0 = p.x + p.latime * U * 0.8;
  if (x0 + latRand > W - 2 * U) x0 = p.x - p.latime * U * 0.8 - latRand;
  x0 = Math.max(2 * U, x0);

  // Meniul nu are voie să ajungă peste mâna ta, de jos: ai nevoie și de una, și
  // de alta în același timp, fiindcă partida merge înainte cât ții meniul.
  let y0 = p.y - p.inaltime * U * p.scara - 3 * U;
  y0 = Math.min(y0, H - 18 * U - inaltTot);
  y0 = Math.max(2 * U, Math.min(y0, H - inaltTot - 2 * U));

  meniu.sus = y0;
  meniu.jos = y0 + inaltTot;
  meniu.stanga = x0;
  meniu.dreapta = x0 + latRand;

  // Capetele de listă nu se apasă: rânduri sunt doar felurile.
  meniu.randuri = [];
  OPTIUNI.forEach(function (o, i) {
    if (o.sectiune) return;
    meniu.randuri.push({
      optiune: o,
      x0: x0, x1: x0 + latRand,
      y0: y0 + i * inaltRand, y1: y0 + (i + 1) * inaltRand
    });
  });
}

/* Un fel apăsat se bifează, apăsat a doua oară se șterge de pe listă. Cât timp
   meniul e deschis poți strânge oricâte pe el: și ciorba, și papanașii, și
   sucul — sau numai două din trei, cum ai chef. */
function bifeaza(o) {
  const i = meniu.alese.indexOf(o);
  if (i >= 0) meniu.alese.splice(i, 1);
  else meniu.alese.push(o);
}

// Chelnerul ia meniul de pe masă. Dacă n-are nimic pe drum, își reia tura.
function inchideMeniul() {
  meniu.deschis = false;
  meniu.alese.length = 0;
  if (comanda.stare === "alege") {
    comanda.stare = "nimic";
    comanda.pentru = null;
    chelnerul.misiune = null;
  }
}

function alege(o) {
  sunet.canta("poc");

  if (!o.inchide) { bifeaza(o); return; }

  // Fără nimic bifat, „doar atât" și „mă mai gândesc" înseamnă tot un refuz:
  // chelnerul dă din cap și pleacă, ca la „nimic, mulțumesc".
  if (o.fel === "nimic" || !meniu.alese.length) { inchideMeniul(); return; }

  const p = meniu.pentru;
  const lista = meniu.alese.slice();
  meniu.alese.length = 0;
  // „Mă mai gândesc": duce ce-ai ales până acum, dar îți lasă meniul în față.
  if (o.fel === "gata") inchideMeniul();
  trimiteLaBar(p, lista);
}

// Cine face felul ăsta: bucătarul, dacă e de mâncare, altfel barmanul.
function omulCare(o) {
  return o.fel === "mancare" ? bucatarul : barmanul;
}

// Unde stă el cât îl face: la aragaz, respectiv la robinete.
function loculDeLucru(o) {
  return o.fel === "mancare" ? aragaz.x - 6 * U : bar.robinete;
}

// Unde așteaptă chelnerul comanda: în fața celui care o face.
function loculDeAsteptare(o) {
  return { x: loculDeLucru(o) - 4 * U, y: bar.y + bar.inalt + 7 * U };
}

function trimiteLaBar(p, lista) {
  // Dacă tava e deja pe drum, comanda nouă așteaptă să se întoarcă chelnerul.
  if (comanda.stare !== "nimic" && comanda.stare !== "alege") {
    comanda.coada.push({ pentru: p, lista: lista });
    return;
  }

  // Mâncarea întâi, băutura la urmă: barmanul nu umblă degeaba de la plită la
  // robinete și înapoi pentru fiecare fel în parte.
  lista.sort(function (a, b) { return (a.fel === "baut") - (b.fel === "baut"); });

  comanda.pentru = p;
  comanda.lista = lista;
  comanda.index = 0;
  comanda.ce = lista[0];
  comanda.stare = "laBar";
  // Cine îl face pornește din clipa asta, ca să fie acolo când ajunge chelnerul.
  omulCare(comanda.ce).tinta = loculDeLucru(comanda.ce);
  const loc = loculDeAsteptare(comanda.ce);
  chelnerul.misiune = {
    x: loc.x,
    y: loc.y,
    prin: ocolulMesei(),
    apoi: function () { comanda.stare = "asteaptaBarman"; }
  };
}

/* Cât ține un fel. Mâncarea se gătește pe îndelete — pusă pe foc, amestecată,
   scoasă în farfurie —, desertul ceva mai repede, băutura cât să se umple un
   pahar. */
function catDureaza(o) {
  if (o.fel !== "mancare") return 2.6;
  return o.desert ? 15 : 20;
}

function incepeLaBar() {
  comanda.stare = "seFace";
  comanda.ce = comanda.lista[comanda.index];
  // Al doilea fel din același rând se face mai repede: plita e caldă, iar
  // paharele stau deja scoase pe tejghea.
  const graba = comanda.index === 0 ? 1 : 0.6;
  comanda.cronometru = catDureaza(comanda.ce) * graba;
  sunet.canta(comanda.ce.fel === "mancare" ? "sfarait" : "turnat");
}

// Se fac pe rând, fiecare la omul lui. Când s-a terminat lista, pleacă tava.
function urmatorulFel() {
  comanda.index++;
  if (comanda.index >= comanda.lista.length) { duceLaMasa(); return; }
  const inainte = comanda.ce;
  comanda.ce = comanda.lista[comanda.index];
  if (omulCare(inainte) !== omulCare(comanda.ce)) omulCare(inainte).tinta = null;
  omulCare(comanda.ce).tinta = loculDeLucru(comanda.ce);
  const loc = loculDeAsteptare(comanda.ce);
  chelnerul.misiune = {
    x: loc.x, y: loc.y,
    apoi: function () { comanda.stare = "asteaptaBarman"; }
  };
}

function duceLaMasa() {
  comanda.stare = "adus";
  barmanul.tinta = null;          // își reiau treaba lor, pe jos
  bucatarul.tinta = null;
  const loc = loculLaMasa();
  chelnerul.misiune = {
    x: loc.x,
    y: loc.y,
    prin: ocolulMesei(),
    apoi: puneComandaPeMasa
  };
}

/* Fiecare lucru nou primește locul lui pe blat, lângă cel care l-a cerut. Dacă
   mai are ceva acolo, se așază alături — nu unul peste altul. */
function asazaPeMasa(obiect) {
  const p = obiect.pentru;
  let cate = 0;
  // Sticlele nu se numără aici: ele stau în mijloc, nu în dreptul nimănui.
  for (const x of pahare) if (x.pentru === p && x !== obiect && x.tip !== "sticla") cate++;

  // În dreptul lui, pe blat, iar al doilea lucru alături de primul — de-a lungul
  // laturii la care stă, nu învârtite pe după masă.
  const c = Math.cos(p.unghi), s = Math.sin(p.unghi);
  const pas = (0.6 + cate) * 6.2 * U;
  obiect.x = cx + masa.rx * 0.62 * c - s * pas;
  obiect.y = cy + masa.ry * 0.62 * s + c * pas * 0.42;
}

/* Sticla nu stă lângă cel care a cerut-o, ci pe mijlocul blatului, la vedere,
   ca la orice masă la care se bea vin. Nu chiar în buricul mesei, însă: acolo
   stă capul clovnului, care e între noi și masă, iar sticla i-ar ieși prin
   pălărie. O punem în golul de lângă el, spre dreapta, între cărțile jucate și
   marginea blatului. A doua sticlă se așază lângă prima, mai spre margine. */
function asazaInMijloc(sticla) {
  let cate = 0;
  for (const x of pahare) if (x.tip === "sticla" && x !== sticla) cate++;
  // Pe ecranele înalte și înguste masa se strânge, dar clovnul nu: de-aia golul
  // se măsoară și în U, nu numai în lățimi de masă.
  const gol = Math.max(masa.rx * 0.40, 12 * U);
  const pas = Math.max(masa.rx * 0.11, 3.6 * U);
  sticla.x = cx + gol + cate * pas;
  sticla.y = cy - masa.ry * 0.10;
}

function puneComandaPeMasa() {
  const p = comanda.pentru;

  // Tot ce e pe tavă coboară pe masă odată, fiecare la locul lui.
  for (const o of comanda.lista) {
    if (o.id === "vin") {
      // Vinul vine cu sticla lui: paharul ți-l torni singur.
      const sticla = { pentru: p, optiune: o, tip: "sticla", nivel: 1, cronometru: 1e9 };
      asazaInMijloc(sticla);
      pahare.push(sticla);
      const pahar = { pentru: p, optiune: o, tip: "pahar", nivel: 0, cronometru: intreg(4, 9) };
      asazaPeMasa(pahar);
      pahare.push(pahar);
    } else {
      const obiect = {
        pentru: p, optiune: o,
        tip: o.fel === "baut" ? "pahar" : "farfurie",
        nivel: 1, cronometru: intreg(4, 9)
      };
      asazaPeMasa(obiect);
      pahare.push(obiect);
    }
    vizita.vede(o.fel === "mancare" ? "mancare" : "baut");
  }
  sunet.canta("poc");

  comanda.lista = [];
  comanda.index = 0;
  comanda.ce = null;

  // Dacă ai mai cerut ceva între timp, pleacă înapoi la bar cu comanda aia.
  if (comanda.coada.length) {
    const urmatoarea = comanda.coada.shift();
    comanda.stare = "nimic";
    trimiteLaBar(urmatoarea.pentru, urmatoarea.lista);
    return;
  }

  // Ți-a lăsat meniul în față: rămâne lângă masă și așteaptă restul comenzii.
  if (meniu.deschis) {
    comanda.stare = "alege";
    chelnerul.misiune = null;
    return;
  }

  comanda.stare = "nimic";
  comanda.pentru = null;
  chelnerul.misiune = null;          // își reia tura
}

function actualizeazaComanda(dt) {
  // Chelnerul a ajuns la bar, dar nu se face nimic până nu vine și omul care
  // are treaba asta — barmanul la robinete, bucătarul la aragaz.
  if (comanda.stare === "asteaptaBarman" && omulCare(comanda.ce).ajuns()) incepeLaBar();

  if (comanda.stare === "seFace") {
    comanda.cronometru -= dt;
    if (comanda.ce.fel === "mancare") {
      aragaz.fum -= dt;
      if (aragaz.fum <= 0) {
        aprindeFum(aragaz.x + intreg(-2, 2) * U, aragaz.y - 2.5 * U, 2);
        aragaz.fum = 0.18;
      }
    }
    if (comanda.cronometru <= 0) urmatorulFel();
  }

  // Se consumă din când în când, fiecare cum îi e felul. Din sticlă nu bea
  // nimeni de-a dreptul: din ea îți torni tu.
  for (const pahar of pahare) {
    if (pahar.tip === "sticla" || pahar.nivel <= 0) continue;
    pahar.cronometru -= dt;
    if (pahar.cronometru <= 0) {
      const inghititura = pahar.pentru === draconianul ? 0.5 :
                          pahar.pentru === clovnul ? 0.34 : 0.2;
      pahar.nivel = Math.max(0, pahar.nivel - inghititura);
      if (pahar.nivel <= 0) pahar.golit = true;
      pahar.cronometru = intreg(5, 11);
      sunet.canta("sorbit");
      trimiteEveniment(pahar.pentru, "bea");
    }
  }

  actualizeazaStransul();
}

/* --- Strânsul vaselor ----------------------------------------------------- */

/* Ce s-a golit nu rămâne pe masă la nesfârșit: când chelnerul n-are altceva de
   făcut, trece pe la noi, le ia pe toate deodată și le duce la chiuvetă. Masa
   se curăță singură, fără să apeși nimic. */

function vaseDeStrans() {
  return pahare.filter(function (p) { return p.golit; });
}

function actualizeazaStransul() {
  if (chelnerul.strange || chelnerul.misiune) return;
  if (comanda.stare !== "nimic" || meniu.deschis) return;   // are treabă mai bună
  const vase = vaseDeStrans();
  if (!vase.length) return;

  chelnerul.strange = vase;
  const loc = loculLaMasa();
  chelnerul.misiune = { x: loc.x, y: loc.y, prin: ocolulMesei(), apoi: ridicaVasele };
}

function ridicaVasele() {
  for (const v of chelnerul.strange) {
    const i = pahare.indexOf(v);
    if (i >= 0) pahare.splice(i, 1);
  }
  chelnerul.tava = chelnerul.strange.length;
  sunet.canta("poc");
  chelnerul.misiune = {
    x: bar.chiuveta + 4 * U,
    y: bar.y + bar.inalt + 7 * U,
    prin: ocolulMesei(),
    apoi: lasaVaseleLaChiuveta
  };
}

function lasaVaseleLaChiuveta() {
  chiuveta.vase += chelnerul.tava;
  chelnerul.tava = 0;
  chelnerul.strange = null;
  chelnerul.asteptare = 0.9;          // i le dă din mână în mână, nu din mers
  sunet.canta("poc");
}

/* --- Desenul comenzii ----------------------------------------------------- */

/* Chiuveta din stânga barului: o albie de tablă cu robinet. Când are vase în
   ea, se vede teancul și un pic de apă. */
function deseneazaChiuveta() {
  const l = 12 * U, i = 3.4 * U, x = bar.chiuveta, y = bar.blat;

  ctx.fillStyle = "#3d444c";
  dreptunghiRotunjit(x - l / 2, y - i, l, i, 0.4 * U);
  ctx.fill();
  ctx.fillStyle = "#2a3036";                            // adâncitura albiei
  dreptunghiRotunjit(x - l / 2 + 0.7 * U, y - i + 0.6 * U, l - 1.4 * U, i - 1 * U, 0.3 * U);
  ctx.fill();

  // Robinetul, îndoit deasupra albiei.
  ctx.strokeStyle = "#8d959c";
  ctx.lineWidth = 0.5 * U;
  ctx.beginPath();
  ctx.moveTo(x - l * 0.36, y - i);
  ctx.lineTo(x - l * 0.36, y - i - 3.4 * U);
  ctx.lineTo(x - l * 0.10, y - i - 3.4 * U);
  ctx.stroke();

  if (chiuveta.vase > 0) {
    // Vasele puse la muiat: câte unul peste altul, câte se văd.
    ctx.fillStyle = "#e6e2d6";
    const cate = Math.min(chiuveta.vase, 5);
    for (let k = 0; k < cate; k++) {
      elipsa(x + (k - (cate - 1) / 2) * 2.1 * U, y - i * 0.55, 1.5 * U, 0.7 * U);
      ctx.fill();
    }
    ctx.fillStyle = SPALATOR.apa;
    dreptunghiRotunjit(x - l / 2 + 0.7 * U, y - i * 0.75, l - 1.4 * U, i * 0.45, 0.3 * U);
    ctx.fill();
  }
}

/* Masa de amestecat, lângă aragaz: acolo taie, amestecă și pune în farfurie —
   de-aia durează mai mult mâncarea decât un pahar de suc. */
function deseneazaMasaDeAmestec() {
  const l = 11 * U, i = 2.6 * U, x = bar.amestec, y = bar.blat;

  ctx.fillStyle = "#4a3423";                            // tocătorul de lemn
  dreptunghiRotunjit(x - l / 2, y - i * 0.55, l, i * 0.55, 0.3 * U);
  ctx.fill();

  ctx.fillStyle = "#c9ced6";                            // castronul de amestecat
  elipsa(x - l * 0.22, y - i * 0.75, 2.6 * U, 1.2 * U);
  ctx.fill();
  ctx.fillStyle = "#8f6a3f";
  elipsa(x - l * 0.22, y - i * 0.85, 1.9 * U, 0.75 * U);
  ctx.fill();

  ctx.fillStyle = "#d8cfc0";                            // farfuriile pregătite
  for (let k = 0; k < 2; k++) {
    elipsa(x + l * 0.28, y - i * 0.5 - k * 0.5 * U, 2.2 * U, 0.8 * U);
    ctx.fill();
  }
}

function deseneazaAragaz() {
  const l = 13 * U, i = 4.5 * U;
  ctx.fillStyle = "#20232a";
  dreptunghiRotunjit(aragaz.x - l / 2, aragaz.y - i, l, i, 0.5 * U);
  ctx.fill();

  // Ochiurile, roșii când se lucrează la ele.
  const aprins = comanda.stare === "seFace" && comanda.ce && comanda.ce.fel === "mancare";
  for (let s = -1; s <= 1; s += 2) {
    ctx.fillStyle = aprins ? "#e2632a" : "#3a3f47";
    elipsa(aragaz.x + s * 3.2 * U, aragaz.y - i * 0.62, 2.1 * U, 0.9 * U);
    ctx.fill();
  }
  // Hota de deasupra.
  ctx.fillStyle = "#2b2f36";
  ctx.beginPath();
  ctx.moveTo(aragaz.x - l * 0.44, aragaz.y - i - 5.5 * U);
  ctx.lineTo(aragaz.x + l * 0.44, aragaz.y - i - 5.5 * U);
  ctx.lineTo(aragaz.x + l * 0.30, aragaz.y - i - 8.5 * U);
  ctx.lineTo(aragaz.x - l * 0.30, aragaz.y - i - 8.5 * U);
  ctx.closePath();
  ctx.fill();
}

function deseneazaPahare() {
  for (const p of pahare) {
    ctx.fillStyle = "rgba(0, 0, 0, 0.35)";
    elipsa(p.x + 0.3 * U, p.y + 0.7 * U, 2.6 * U, 1 * U);
    ctx.fill();

    if (p.tip === "sticla") deseneazaSticlaDeVin(p);
    else if (p.tip === "pahar") deseneazaPaharul(p);
    else deseneazaFelul(p);
  }
}

function farfurie(p) {
  ctx.fillStyle = MANCARE.farfurie;
  elipsa(p.x, p.y - 0.4 * U, 5.2 * U, 2.5 * U);
  ctx.fill();
  ctx.fillStyle = MANCARE.adancitura;
  elipsa(p.x, p.y - 0.4 * U, 4.1 * U, 1.9 * U);
  ctx.fill();
}

// Fiecare fel de mâncare arată a el, nu toate a farfurie cu ceva pe ea.
function deseneazaFelul(p) {
  const n = p.nivel;
  if (n <= 0) { farfurie(p); return; }

  if (p.optiune.id === "ciorba") {
    // Castron adânc, zeamă galbenă, bucăți în ea.
    ctx.fillStyle = MANCARE.castron;
    elipsa(p.x, p.y - 0.6 * U, 4.8 * U, 2.6 * U);
    ctx.fill();
    ctx.fillStyle = MANCARE.zeama;
    elipsa(p.x, p.y - 0.9 * U, 3.9 * U * n, 1.9 * U * n);
    ctx.fill();
    ctx.fillStyle = MANCARE.legume;
    for (let i = -1; i <= 1; i++) {
      elipsa(p.x + i * 1.5 * U, p.y - 1.1 * U + Math.abs(i) * 0.3 * U, 0.45 * U, 0.3 * U);
      ctx.fill();
    }
    ctx.fillStyle = MANCARE.verdeata;
    elipsa(p.x + 0.7 * U, p.y - 0.4 * U, 0.35 * U, 0.22 * U);
    ctx.fill();
    ctx.strokeStyle = "rgba(180, 170, 150, 0.6)";       // buza castronului
    ctx.lineWidth = 0.22 * U;
    elipsa(p.x, p.y - 0.6 * U, 4.8 * U, 2.6 * U);
    ctx.stroke();
    return;
  }

  if (p.optiune.id === "cartofi") {
    farfurie(p);
    for (let i = 0; i < 9; i++) {
      ctx.save();
      ctx.translate(p.x + (pseudo(i) - 0.5) * 6 * U, p.y - 0.6 * U + (pseudo(i + 9) - 0.5) * 1.8 * U);
      ctx.rotate((pseudo(i + 18) - 0.5) * 2.2);
      ctx.fillStyle = i % 3 === 0 ? MANCARE.cartofUmbra : MANCARE.cartof;
      dreptunghiRotunjit(-1.6 * U * n, -0.3 * U, 3.2 * U * n, 0.6 * U, 0.25 * U);
      ctx.fill();
      ctx.restore();
    }
    return;
  }

  if (p.optiune.id === "papanasi") {
    farfurie(p);
    for (let s = -1; s <= 1; s += 2) {
      const x = p.x + s * 1.7 * U;
      ctx.fillStyle = MANCARE.papanas;                  // gogoașa
      elipsa(x, p.y - 1 * U, 1.5 * U * n, 1.1 * U * n);
      ctx.fill();
      ctx.fillStyle = MANCARE.smantana;                 // smântâna peste ea
      elipsa(x, p.y - 1.5 * U, 1.2 * U * n, 0.6 * U * n);
      ctx.fill();
      ctx.fillStyle = MANCARE.papanas;                  // căciulița de deasupra
      elipsa(x, p.y - 2.1 * U, 0.6 * U * n, 0.5 * U * n);
      ctx.fill();
      ctx.fillStyle = MANCARE.dulceata;                 // dulceața
      for (let i = -1; i <= 1; i++) {
        elipsa(x + i * 0.6 * U, p.y - 1.6 * U + Math.abs(i) * 0.2 * U, 0.3 * U, 0.25 * U);
        ctx.fill();
      }
    }
    return;
  }

  if (p.optiune.id === "inghetata") {
    // Cupă cu picior, cu bile de ciocolată în ea.
    // Piciorul și talpa cupei.
    ctx.fillStyle = MANCARE.cupa;
    dreptunghiRotunjit(p.x - 0.5 * U, p.y - 2.4 * U, U, 2.4 * U, 0.3 * U);
    ctx.fill();
    elipsa(p.x, p.y, 2 * U, 0.7 * U);
    ctx.fill();
    // Bolul cupei, în spatele bilelor.
    dreptunghiRotunjit(p.x - 2.4 * U, p.y - 4.2 * U, 4.8 * U, 2 * U, 0.9 * U);
    ctx.fill();

    ctx.fillStyle = MANCARE.inghetata;                  // bilele, la vedere
    const bile = [[-1.1, -4.3], [1.1, -4.3], [0, -5.4]];
    for (const b of bile) {
      elipsa(p.x + b[0] * U, p.y + b[1] * U, 1.2 * U * n, 1.1 * U * n);
      ctx.fill();
    }
    ctx.fillStyle = MANCARE.ciocolata;                  // fulgii de ciocolată
    for (let i = -1; i <= 1; i++) {
      elipsa(p.x + i * 0.7 * U, p.y - (5.4 + Math.abs(i) * 0.5) * U, 0.22 * U, 0.2 * U);
      ctx.fill();
    }
    // Doar buza cupei trece peste ele, cât să se vadă că sunt înăuntru.
    ctx.strokeStyle = "rgba(226, 232, 236, 0.55)";
    ctx.lineWidth = 0.25 * U;
    elipsa(p.x, p.y - 4.2 * U, 2.4 * U, 0.8 * U);
    ctx.stroke();
    return;
  }

  // Mici cu piure.
  farfurie(p);
  ctx.fillStyle = MANCARE.piure;
  elipsa(p.x - 2 * U, p.y - 0.6 * U, 1.8 * U * n, 1.2 * U * n);
  ctx.fill();
  ctx.fillStyle = MANCARE.mic;
  for (let i = 0; i < 3; i++) {
    elipsa(p.x + (0.2 + i * 1.2) * U, p.y - 0.5 * U + i * 0.2 * U,
           1.4 * U * n, 0.6 * U * n);
    ctx.fill();
  }
}

function deseneazaPaharul(p) {
  const inalt = 6 * U, lat = 3.4 * U;
  ctx.fillStyle = "rgba(226, 232, 236, 0.30)";
  dreptunghiRotunjit(p.x - lat / 2, p.y - inalt, lat, inalt, 0.5 * U);
  ctx.fill();
  if (p.nivel > 0) {
    ctx.fillStyle = p.optiune.culoare;
    const h = (inalt - 0.8 * U) * p.nivel;
    dreptunghiRotunjit(p.x - lat / 2 + 0.3 * U, p.y - 0.4 * U - h, lat - 0.6 * U, h, 0.35 * U);
    ctx.fill();
    if (p.optiune.id === "bere") {                      // guler de spumă
      ctx.fillStyle = "#f2ead4";
      dreptunghiRotunjit(p.x - lat / 2 + 0.3 * U, p.y - 0.4 * U - h - 0.9 * U,
                         lat - 0.6 * U, 1.2 * U, 0.35 * U);
      ctx.fill();
    }
  }
  ctx.strokeStyle = "rgba(255, 240, 210, 0.40)";
  ctx.lineWidth = 0.18 * U;
  dreptunghiRotunjit(p.x - lat / 2, p.y - inalt, lat, inalt, 0.5 * U);
  ctx.stroke();
}

/* Sticla de vin, desenată oriunde e nevoie de ea: pe masa noastră, în mijloc,
   sau mai mică pe masa musafirilor din față. */
function sticlaDeVin(x, y, scara, nivel) {
  const lat = 3 * U * scara, inalt = 10 * U * scara;
  ctx.fillStyle = MANCARE.sticla;
  dreptunghiRotunjit(x - lat / 2, y - inalt * 0.62, lat, inalt * 0.62, 0.5 * U * scara);
  ctx.fill();
  dreptunghiRotunjit(x - lat * 0.17, y - inalt, lat * 0.34, inalt * 0.46, 0.2 * U * scara);
  ctx.fill();

  if (nivel > 0) {                                      // vinul rămas înăuntru
    ctx.fillStyle = "#7c2b33";
    const h = inalt * 0.5 * nivel;
    dreptunghiRotunjit(x - lat / 2 + 0.35 * U * scara, y - 0.3 * U * scara - h,
                       lat - 0.7 * U * scara, h, 0.3 * U * scara);
    ctx.fill();
  }
  ctx.fillStyle = MANCARE.eticheta;
  dreptunghiRotunjit(x - lat * 0.40, y - inalt * 0.42, lat * 0.80, inalt * 0.20, 0.15 * U * scara);
  ctx.fill();
}

// Sticla de pe masa noastră. Apeși pe ea și îți torni singur în pahar.
function deseneazaSticlaDeVin(s) {
  sticlaDeVin(s.x, s.y, 1, s.nivel);
}

function deseneazaMeniu() {
  if (!meniu.deschis) return;

  ctx.fillStyle = "rgba(16, 11, 7, 0.92)";
  dreptunghiRotunjit(meniu.stanga - 1.5 * U, meniu.sus - 1.5 * U,
                     (meniu.dreapta - meniu.stanga) + 3 * U,
                     (meniu.jos - meniu.sus) + 3 * U, U);
  ctx.fill();
  ctx.strokeStyle = "rgba(232, 161, 60, 0.45)";
  ctx.lineWidth = 0.22 * U;
  ctx.stroke();

  const inaltRand = (meniu.jos - meniu.sus) / OPTIUNI.length;
  OPTIUNI.forEach(function (o, i) {
    const mijloc = meniu.sus + (i + 0.5) * inaltRand + U;

    if (o.sectiune) {
      ctx.textAlign = "left";
      ctx.font = Math.round(2.7 * U) + "px system-ui, sans-serif";
      ctx.fillStyle = "#e8a13c";
      ctx.fillText(o.sectiune, meniu.stanga + 1.5 * U, mijloc);
      ctx.strokeStyle = "rgba(232, 161, 60, 0.25)";
      ctx.lineWidth = 0.12 * U;
      ctx.beginPath();
      ctx.moveTo(meniu.stanga + 1.5 * U, mijloc + 1.1 * U);
      ctx.lineTo(meniu.dreapta - 1.5 * U, mijloc + 1.1 * U);
      ctx.stroke();
      return;
    }

    ctx.font = Math.round(3.1 * U) + "px system-ui, sans-serif";
    ctx.textAlign = "left";

    if (o.inchide) {
      // Linia care desparte felurile de sfârșitul comenzii.
      if (o.id === "gata") {
        ctx.strokeStyle = "rgba(232, 161, 60, 0.25)";
        ctx.lineWidth = 0.12 * U;
        ctx.beginPath();
        ctx.moveTo(meniu.stanga + 1.5 * U, mijloc - 2.6 * U);
        ctx.lineTo(meniu.dreapta - 1.5 * U, mijloc - 2.6 * U);
        ctx.stroke();
      }
      // Cele două confirmări se aprind abia când ai bifat ceva.
      const viu = o.fel !== "nimic" && meniu.alese.length > 0;
      ctx.fillStyle = viu ? "#e8a13c" : "#b9ada0";
      ctx.fillText(o.nume, meniu.stanga + 2.5 * U, mijloc);

      // Cât face tot ce ai bifat, scris o singură dată, în dreptul lui „gata".
      if (o.id === "gata" && viu) {
        let total = 0;
        for (const ales of meniu.alese) total += pretInLei(ales);
        ctx.textAlign = "right";
        ctx.fillStyle = "#e8dcc4";
        ctx.fillText(total + " lei", meniu.stanga + 50 * U, mijloc);
      }
      return;
    }

    const bifat = meniu.alese.indexOf(o) >= 0;
    if (bifat) {                                 // semnul de lângă ce ai ales
      ctx.fillStyle = "#e8a13c";
      ctx.fillText("✓", meniu.stanga + 0.9 * U, mijloc);
    }
    ctx.fillStyle = bifat ? "#f6d79a" : "#f2e7d3";
    ctx.fillText(o.nume, meniu.stanga + 4.2 * U, mijloc);

    // Cantitatea și prețul stau în coloanele lor, aliniate la dreapta, ca într-o
    // listă de bucate adevărată.
    ctx.textAlign = "right";
    ctx.fillStyle = "#a89b8c";
    ctx.fillText(o.cantitate, meniu.stanga + 36 * U, mijloc);
    ctx.fillStyle = bifat ? "#f6d79a" : "#e8dcc4";
    ctx.fillText(o.pret, meniu.stanga + 50 * U, mijloc);
  });
}

/* --- Pomenirea altcuiva --------------------------------------------------- */

/* Vorbind cu unul, poți pomeni pe altul: „barmanule, ce crezi de @draconian?".
   Semnul `@` (sau `/`) și numele — scris cum îți vine, fără diacritice și
   scurtat. Cel întrebat primește atunci și o vorbă despre cel pomenit, ca să
   știe despre cine e vorba, și își spune părerea.

   Poți pomeni și mai mulți odată — „ce ziceți, @draconian, @barman?" —, iar cine
   e chemat pe nume și e în local răspunde și el, pe rând, după cel întrebat. */

const SEMNE_POMENIRE = "@/";

// Numele se caută fără diacritice și fără majuscule: le scrie fiecare cum vrea.
function faraSemne(text) {
  return String(text || "").toLowerCase()
    .replace(/[ăâ]/g, "a").replace(/î/g, "i")
    .replace(/[șş]/g, "s").replace(/[țţ]/g, "t")
    .trim();
}

// Toți cei cu nume din local, cu poreclele lor cu tot — clovnul între ei.
const NUMITI = Object.keys(FIRI).map(function (nume) {
  return { nume: nume, chei: [faraSemne(nume)].concat((FIRI[nume].porecle || []).map(faraSemne)) };
});

/* Pe cel din fața ta n-are rost să-l pomenești pe nume — e chiar acolo. În locul
   lui, în listă, stă `@tine`: îl întrebi ce crede despre el însuși. */
const DESPRE_SINE = { nume: "tine", sine: true, chei: ["tine", "tine insuti", "sine"] };
const DE_POMENIT = [DESPRE_SINE].concat(NUMITI);

/* Cine e cel scris după semn. Se încearcă întâi trei cuvinte („omul de aur"),
   apoi două, apoi unul: numele lungi n-au de ce să piardă în fața celor scurte.
   Un nume scris pe jumătate merge, dacă e început de nume: `@drac`. */
function cineEScris(dupa) {
  const cuvinte = [];
  const cauta = /\S+/g;
  let m;
  while (cuvinte.length < 3 && (m = cauta.exec(dupa))) cuvinte.push({ de: m.index, text: m[0] });
  if (!cuvinte.length || cuvinte[0].de > 0) return null;   // semnul stă lipit de nume

  for (let n = cuvinte.length; n >= 1; n--) {
    const ultim = cuvinte[n - 1];
    const scris = dupa.slice(0, ultim.de + ultim.text.length).replace(/[.,;:!?…)"”'’-]+$/, "");
    const cheie = faraSemne(scris);
    if (cheie.length < 2) continue;
    for (const om of DE_POMENIT) {
      for (const c of om.chei) {
        if (c === cheie || (cheie.length >= 3 && c.indexOf(cheie) === 0)) {
          return { nume: om.nume, sine: !!om.sine, scris: scris };
        }
      }
    }
  }
  return null;
}

/* Toate pomenirile dintr-o vorbă, în ordinea în care le-ai scris: cine e fiecare
   și cum a fost scris. Semnul contează doar la început de cuvânt, ca să nu se
   aprindă la o adresă de mail. */
function pomenirile(text) {
  const brut = String(text || "");
  const gasite = [];
  for (let i = 0; i < brut.length; i++) {
    if (SEMNE_POMENIRE.indexOf(brut[i]) < 0) continue;
    if (i > 0 && !/[\s(„"']/.test(brut[i - 1])) continue;
    const gasit = cineEScris(brut.slice(i + 1));
    if (!gasit) continue;
    gasite.push({
      nume: gasit.sine ? null : gasit.nume,   // „tine" nu e un nume, e cel din fața ta
      sine: !!gasit.sine,
      scris: brut[i] + gasit.scris,
      scrieCa: gasit.sine ? "tine" : gasit.nume,
      de: i
    });
    i += gasit.scris.length;                  // numele prins nu se mai caută încă o dată
  }
  return gasite;
}

// Modelul citește vorba curată: „ce crezi de Draconianul?", nu semnul.
function faraPomenire(text) {
  const brut = String(text || "");
  let curat = "", pana = 0;
  for (const p of pomenirile(brut)) {
    curat += brut.slice(pana, p.de) + p.scrieCa;
    pana = p.de + p.scris.length;
  }
  return curat + brut.slice(pana);
}

// Fără model, părerea se ia din ce are scris fiecare, cu numele pus la locul lui.
function parereaLui(p, despreCine) {
  const pareri = (FIRI[p.nume] && FIRI[p.nume].pareri) || [];
  if (!pareri.length) return null;
  return alegeDin(pareri).replace(/\{cine\}/g, despreCine);
}

// Și ce zice despre el însuși, când îl întrebi cu `@tine`.
function parereaDeSine(p) {
  const aleLui = (FIRI[p.nume] && FIRI[p.nume].pareriDeSine) || [];
  return aleLui.length ? alegeDin(aleLui) : null;
}

// Cu ce se bagă în vorbă cel pe care nu-l întreba nimeni.
function vorbaDeBagat(p) {
  const aleLui = (FIRI[p.nume] && FIRI[p.nume].bagari) || [];
  return aleLui.length ? alegeDin(aleLui) : null;
}

// Și cum îl repede cel peste care s-a băgat.
function repezeala(p, cine) {
  const aleLui = (FIRI[p.nume] && FIRI[p.nume].repezeli) || [];
  return aleLui.length ? alegeDin(aleLui).replace(/\{cine\}/g, cine) : null;
}

/* --- Ce ai vrut să spui --------------------------------------------------- */

/* Fără model, până acum răspundeau cu o vorbă luată la nimereală din rezerva lor:
   îi ziceai „ce faci?" și îți întorcea „Mută el întâi". De-aceea vorba ta trece
   întâi pe-aici. Nu se înțelege orice — n-avem cum, fără model —, dar se
   recunosc lucrurile cu care se poartă o discuție într-un bar: un salut, o
   întrebare despre el, despre joc, despre băutură, un „da" scurt, un mulțumesc,
   o plecare. Fiecare are pentru fiecare temă câte o vorbă a lui.

   Ordinea contează: „salut, ce faci?" e o întrebare, nu un salut, iar „cum merge
   partida?" e despre joc, nu despre el — deci temele care spun mai mult se caută
   înaintea celor care spun mai puțin. */
const TEME = [
  ["plecare",   /\b(pa|la revedere|ne vedem|noapte buna|am plecat|eu plec|plec)\b/],
  ["multumesc", /\b(mersi|merci|multumesc|multumim|multam)\b/],
  ["cineEsti",  /\bcine esti\b|\bce esti\b|\bcum te cheama\b|\bce nume ai\b|\bce cauti aici\b|\bce faci aici\b|\bcu ce te ocupi\b/],
  ["joc",       /\b(joc|joci|jocul|carte|carti|cartile|partida|levata|levate|joker|castig|castiga|castigi|pierzi|pierde|miza)\b/],
  ["bautura",   /\b(bere|vin|bautura|beau|bei|sete|pahar|mancare|mancat|foame|maninc|mananci|meniu|comand|comanda|papanasi|mici)\b/],
  ["ceFaci",    /\bce (mai )?faci\b|\bcum (o mai )?duci\b|\bcum merge\b|\bce mai zici\b|\bcum esti\b|\bce e nou\b/],
  ["salut",     /\b(salut|salutare|buna|hei|noroc|servus|ceau|pace)\b/]
];

/* Vorbele scurte cu care nu întrebi nimic, doar arăți că ai auzit. Se caută pe
   toată vorba, nu în ea: „nu" e altceva decât „nu știu ce să zic". */
const VORBE_SCURTE = ["da", "nu", "ok", "bine", "stiu", "asa e", "aha", "hm", "mhm",
                      "poate", "sigur", "desigur", "asa", "corect", "adevarat", "clar"];

// Se caută fără diacritice și fără semnele de la capăt: le scrie fiecare cum vrea.
function citesteVorba(vorba) {
  const curat = faraSemne(vorba).replace(/[.,;:!?…]+/g, " ").replace(/\s+/g, " ").trim();
  if (!curat) return null;
  if (VORBE_SCURTE.indexOf(curat) >= 0) return "primit";
  for (const [tema, semn] of TEME) {
    if (semn.test(curat)) return tema;
  }
  // O întrebare pe care n-am înțeles-o rămâne tot o întrebare: are cine să-i răspundă.
  return /\?\s*$/.test(String(vorba || "").trim()) ? "nuStiu" : null;
}

// Ce zice el la tema recunoscută. Dacă n-are scris nimic pentru ea, nu zice nimic.
function raspunsulPeTema(p, tema) {
  const ale = (FIRI[p.nume] && FIRI[p.nume].raspunsuri) || {};
  return tema && ale[tema] && ale[tema].length ? alegeDin(ale[tema]) : null;
}

/* --- Ce ține minte localul despre tine, dincolo de nume -------------------- */

/* „Sunt obosit", „mi-e sete", „îmi place berea": lucruri spuse despre tine, pe
   care un om le-ar ține minte. Se țin minte întoarse spre tine — „sunt obosit"
   se ține minte ca „ești obosit" —, ca să poată fi spuse înapoi fără să sune
   strâmb, și de el, și de model. */
const FELURI_DE_A_TE_SPUNE = [
  [/^(?:si\s+)?eu\s+sunt\s+(.{2,40})$/i, "ești {ce}"],
  [/^sunt\s+(.{2,40})$/i,                "ești {ce}"],
  [/^mi-?\s?e\s+(.{2,40})$/i,            "ți-e {ce}"],
  [/^[iî]mi place\s+(.{2,40})$/i,        "îți place {ce}"],
  [/^am\s+(.{2,40})$/i,                  "ai {ce}"],
  [/^vin din\s+(.{2,40})$/i,             "vii din {ce}"],
  [/^locuiesc [iî]n\s+(.{2,40})$/i,      "locuiești în {ce}"],
  [/^lucrez\s+(.{2,40})$/i,              "lucrezi {ce}"]
];

const CATE_TIN_MINTE = 3;   // ultimele câteva; un bar nu ține un dosar

function cePariDespreTine(vorba) {
  const curat = String(vorba || "").trim().replace(/[.,;:!?…]+$/, "");
  if (curat.length > 46 || /[@\/]/.test(curat)) return null;   // o pomenire nu e o mărturisire
  for (const [semn, cum] of FELURI_DE_A_TE_SPUNE) {
    const gasit = semn.exec(curat);
    if (gasit) return cum.replace("{ce}", gasit[1].trim().toLowerCase());
  }
  return null;
}

// Când îi spui ceva despre tine, arată că a auzit — și de-atunci o știu toți.

const INTREBATUL = { sansa: 0.35, laCate: 2 };   // obiect, ca să-l poată fixa testele
const INTREBARI_DESPRE_ALTUL = ["Tu ce zici de {cine}?", "Pe {cine} îl știi?",
                                "Da' de {cine} ce părere ai?"];
const INTREBARI_DESPRE_CE_AI_SPUS = ["Ziceai că {ce}. Tot așa?", "Cum rămâne, {ce}?"];

function intrebareaLui(p) {
  const ale = (FIRI[p.nume] && FIRI[p.nume].intrebari) || [];

  // Despre ce i-ai spus mai devreme, dacă ai spus ceva: e cea mai omenească.
  if (chat.tuEsti.spus.length && Math.random() < 0.4) {
    return alegeDin(INTREBARI_DESPRE_CE_AI_SPUS)
             .replace(/\{ce\}/g, alegeDin(chat.tuEsti.spus));
  }
  // Despre altcineva din local, dacă mai e cineva de întrebat.
  const altii = vorbitori().filter(function (v) { return v !== p; });
  if (altii.length && Math.random() < 0.35) {
    return alegeDin(INTREBARI_DESPRE_ALTUL).replace(/\{cine\}/g, alegeDin(altii).nume);
  }
  return ale.length ? alegeDin(ale) : null;
}

/* Întreabă acum? Numai cel cu care vorbești sau cel chemat pe nume — cine se
   bagă peste voi n-are dreptul să și întrebe. */
function poateTeIntreaba(ce) {
  if (ce.fel !== "intrebat" && ce.fel !== "pomenit") return false;
  if (chat.deLaIntrebare < INTREBATUL.laCate) return false;
  return Math.random() < INTREBATUL.sansa;
}

/* Pe cine poți pomeni, când ai scris semnul și ai început un nume. Cel cu care
   vorbești lipsește din listă: pentru el e `@tine`, pus primul. */
function potriviri(scris) {
  const cheie = faraSemne(scris);
  const seCauta = function (om) {
    return !cheie || om.chei.some(function (c) { return c.indexOf(cheie) === 0; });
  };
  const lista = [];
  if (chat.cuCine && seCauta(DESPRE_SINE)) lista.push(DESPRE_SINE.nume);
  for (const om of NUMITI) {
    if (chat.cuCine && om.nume === chat.cuCine.nume) continue;
    if (seCauta(om)) lista.push(om.nume);
  }
  return lista.slice(0, 6);
}

/* --- Sita răspunsurilor --------------------------------------------------- */

/* Un model mic scapă des lucruri care n-au ce căuta în bulă: își scrie numele în
   față, pune ghilimele, presară asteriscuri, se oprește la jumătatea cuvântului
   sau alunecă în altă limbă. Tot ce zice trece pe-aici înainte să se audă; ce nu
   se poate curăța se aruncă, și atunci răspunde din firea lui, ca și cum modelul
   ar fi tăcut. */

// Ce litere și semne au voie într-o vorbă de-a lor. Restul e alt alfabet.
const SEMNE_STRAINE = /[^A-Za-zĂÂÎȘȚăâîșț0-9\s.,;:!?…„”"'()\-–—+%&]/;

/* Engleza are însă același alfabet și trece de sită dacă n-o cauți anume. Astea
   sunt cuvintele pe care le scapă modelul cel mai des când alunecă din română —
   niciunul dintre ele nu e și cuvânt românesc, deci nu taie nimic bun. */
const CUVINTE_STRAINE = new RegExp("\\b(the|you|your|here|there|what|how|please|" +
  "thanks|thank|sorry|hello|sure|because|would|should|could|i'm|it's|that's|" +
  "don't|doesn't|assistant|language|model|answer|drink|beer)\\b", "i");

function curataRaspunsul(text, intrebare) {
  let vorba = String(text || "").split("\n")[0];

  // Mișcările scrise („*mârâie*", „(râde)") nu se aud într-un bar.
  vorba = vorba.replace(/\*[^*]*\*/g, " ").replace(/\([^)]*\)/g, " ")
               .replace(/[*_`#]/g, " ").replace(/\s+/g, " ").trim();

  // Numele lui scris în față, ca la teatru: „Barmanul: ce-ți torn?".
  const capat = vorba.indexOf(":");
  if (capat > 0 && capat <= 30) {
    const inainte = faraSemne(vorba.slice(0, capat));
    const eNumeleLui = NUMITI.some(function (om) { return om.chei.indexOf(inainte) >= 0; });
    if (eNumeleLui) vorba = vorba.slice(capat + 1).trim();
  }

  vorba = vorba.replace(/^["„”'\s]+|["„”'\s]+$/g, "").trim();

  // Rupt la jumătate, fiindcă i s-au terminat silabele: se taie la ultima
  // propoziție încheiată. Dacă n-a încheiat niciuna, nu rămâne nimic de auzit.
  if (vorba && !/[.!?…]$/.test(vorba)) {
    const taiat = vorba.replace(/[^.!?…]*$/, "").trim();
    vorba = taiat.length >= 8 ? taiat : "";
  }

  if (!vorba || SEMNE_STRAINE.test(vorba) || CUVINTE_STRAINE.test(vorba)) return null;
  // Dacă doar mi-a întors întrebarea, e ca și cum n-ar fi zis nimic.
  if (intrebare && faraSemne(vorba) === faraSemne(intrebare)) return null;
  return vorba.slice(0, 160);
}

/* --- Ce ține minte localul despre tine ------------------------------------ */

/* Dacă te prezinți, te știu de-atunci încolo. Localul e mic: îl află toți, nu
   doar cel căruia i-ai spus. Ține până la refresh, nu mai departe. */

// „Sunt obosit" nu e un nume. Astea sunt vorbele care vin cel mai des după „sunt".
const NU_SUNT_NUME = ["obosit", "bine", "rau", "aici", "gata", "beat", "trist", "vesel",
                      "ocupat", "grabit", "singur", "liber", "sigur", "prost", "bun",
                      "nou", "student", "sef", "nervos", "fericit", "suparat", "flamand",
                      "insetat", "mort", "treaz", "atent", "curios", "plictisit", "gras",
                      "slab", "batran", "tanar", "acasa", "plecat", "doar", "chiar"];

function numeleTau(vorba) {
  const gasit = /(?:numele meu (?:e|este)|m[ăa] cheam[ăa]|eu sunt|sunt)\s+([A-Za-zĂÂÎȘȚăâîșț-]{3,20})/i
    .exec(String(vorba || ""));
  if (!gasit) return null;
  const nume = gasit[1];
  if (NU_SUNT_NUME.indexOf(faraSemne(nume)) >= 0) return null;
  return nume.charAt(0).toUpperCase() + nume.slice(1).toLowerCase();
}

// Când te prezinți și modelul tace, tot te ia cineva în seamă.
const SALUTURI = ["Îmi pare bine, {tu}.", "Salut, {tu}.", "{tu}, va să zică.",
                  "Am reținut, {tu}."];

const chat = {
  deschis: false,
  cuCine: null,
  vorbe: [],        // ce s-a spus în fereastră: { cine, text }
  istoric: [],      // ultimele replici cu cel de acum, ca să știe unde a rămas
  istorii: {},      // firul fiecăruia, ținut minte când te muți la altul
  tuEsti: { nume: null, spus: [] },   // ce ai spus despre tine: numele, și restul
  asteapta: false,  // am întrebat și încă nu a răspuns
  coada: [],        // cine mai are de zis ceva după el, în ordine
  pauza: 0,         // răgazul până vorbește următorul, ca să nu se audă deodată
  deLaIntrebare: 0  // câte replici au trecut de când te-a întrebat cineva ceva
};

// Firul de vorbă cu cineva anume. Te muți la altul și te întorci — îl găsești.
function firulCu(p) {
  if (!chat.istorii[p.nume]) chat.istorii[p.nume] = [];
  return chat.istorii[p.nume];
}

// Firul ține minte puțin: ultimele câteva replici, atât cât intră în prompt.
function tineMinte(fir, rand) {
  fir.push(rand);
  if (fir.length > 6) fir.shift();
}

/* Cât mai are cineva de răspuns, vorba e a lui: nu te bagi peste el, așa cum nu
   se bagă nici ei unul peste altul. */
function seVorbeste() {
  return chat.asteapta || chat.coada.length > 0;
}

/* Cine e în local acum și are cu ce răspunde. Musafirii, doar cât stau la masă.
   Se cerne după fire, nu după intrare în `FIRI`: clovnul are și el intrare, ca
   să poată fi pomenit, dar n-are fire — pe el îl joci tu, n-ai ce vorbi cu tine. */
function vorbitori() {
  const toti = [draconianul, reptilianul, dealerul, chelnerul, barmanul,
                bucatarul, spalatorul, omulCuMana, omulDeAur];
  if (vizita.stare === "asezati") {
    for (const m of vizita.musafiri) toti.push(m);
  }
  return toti.filter(function (p) { return p && FIRI[p.nume] && FIRI[p.nume].fire; });
}

function deschideChat(cine) {
  chat.deschis = true;
  const lista = vorbitori();
  if (cine) chat.cuCine = cine;
  if (!chat.cuCine || lista.indexOf(chat.cuCine) < 0) chat.cuCine = lista[0] || null;
  if (chat.cuCine) chat.istoric = firulCu(chat.cuCine);
  chatArata();
}

function inchideChat() {
  chat.deschis = false;
  chatArata();
}

/* Schimbi omul cu care vorbești: din listă, sau dând clic pe el în scenă. Ce
   v-ați spus rămâne scris, ca să se vadă cu cine ai vorbit despre ce — iar
   fiecare își ține firul lui, așa că te poți întoarce unde ai rămas. */
function alegeVorbitorul(p) {
  if (!p || p === chat.cuCine || !(FIRI[p.nume] && FIRI[p.nume].fire)) return;
  chat.cuCine = p;
  chat.istoric = firulCu(p);
  chatArata();
}

/* Vorbind cu unul, se mai bagă în vorbă altcineva din local: aude de la locul lui
   și zice și el ceva, deși nu-l întreba nimeni. Se întâmplă rar, cât să pară că
   s-a nimerit, și numai când vorbeați între patru ochi — dacă ai chemat tu pe
   cineva pe nume, e destulă gălăgie și fără el. Cel întrerupt îl repede și
   discuția merge mai departe. */
const BAGAREA = { sansa: 0.08 };   // obiect, nu constantă, ca să i-o poată fixa testele
const PAUZA_INTRE_VORBE = 1.2;     // secunde între două replici: se vorbește pe rând

/* Ce aude fiecare din vorba ta: despre cine e vorba — primul pomenit care nu e
   chiar el —, dacă e vorba chiar despre el, și ce s-a înțeles din vorbă (tema și
   ce ai spus despre tine, aceleași pentru toți cei care aud). `@tine` înseamnă
   cel cu care vorbești, deci pentru ceilalți nu înseamnă nimic. */
function ceAude(p, pomeniti, fel, citit) {
  const eChiarEl = function (m) { return m.nume ? m.nume === p.nume : p === chat.cuCine; };
  const altul = pomeniti.find(function (m) { return m.nume && m.nume !== p.nume; });
  const c = citit || {};
  return {
    fel: fel,
    despre: altul ? altul.nume : null,
    desprEl: pomeniti.some(eChiarEl),
    cuCine: chat.cuCine ? chat.cuCine.nume : null,
    tema: c.tema || null,
    faptNou: c.faptNou || null,
    numeNou: c.numeNou || null,
    tuEsti: chat.tuEsti.nume,
    stiuDespreTine: chat.tuEsti.spus.slice()
  };
}

/* Pe cine ai chemat pe nume și chiar poate răspunde: e în local acum și are fire.
   Clovnul ești tu, deci rămâne doar subiect de vorbă; cel cu care vorbești
   oricum răspunde primul, nu se numără de două ori. */
function ceiChemati(pomeniti, p) {
  const inLocal = vorbitori();
  const chemati = [];
  for (const m of pomeniti) {
    if (!m.nume || m.nume === p.nume) continue;
    const cine = inLocal.find(function (v) { return v.nume === m.nume; });
    if (cine && chemati.indexOf(cine) < 0) chemati.push(cine);
  }
  return chemati;
}

// Se bagă cineva peste voi? Dacă da, intră în coadă el, și după el repezeala.
function poateSeBagaCineva(p, vorba) {
  if (Math.random() >= BAGAREA.sansa) return;
  const altii = vorbitori().filter(function (v) { return v !== p; });
  if (!altii.length) return;
  const bagatul = alegeDin(altii);
  const repede = ceAude(p, [], "repezit");
  repede.cine = bagatul.nume;                 // pe cine repede: pe cel băgat
  chat.coada.push({ p: bagatul, vorba: vorba, fir: chat.istoric,
                    ce: ceAude(bagatul, [], "bagat") });
  chat.coada.push({ p: p, vorba: "", fir: chat.istoric, ce: repede });
}

/* Fără model, fiecare răspunde din ce are scris în firea lui, dar pe subiect, în
   ordinea asta: dacă te-ai prezentat, te ia în seamă; dacă i-ai spus ceva despre
   tine, arată că a auzit; dacă ai întrebat de cineva, e despre el; dacă l-ai
   întrebat de el, vorbește despre el; dacă s-a înțeles tema, răspunde la ea.
   Abia la urmă, când nu s-a înțeles nimic, vine o vorbă din rezerva lui. */
function dinFireaLui(p, ce) {
  if (ce.fel === "bagat") return vorbaDeBagat(p) || alegeDin(FIRI[p.nume].rezerva);
  if (ce.fel === "repezit") return repezeala(p, ce.cine) || alegeDin(FIRI[p.nume].rezerva);
  return (ce.numeNou && alegeDin(SALUTURI).replace(/\{tu\}/g, ce.numeNou)) ||
         (ce.faptNou && alegeDin(AM_RETINUT).replace(/\{ce\}/g, ce.faptNou)) ||
         (ce.despre && parereaLui(p, ce.despre)) ||
         (ce.desprEl && parereaDeSine(p)) ||
         raspunsulPeTema(p, ce.tema) ||
         alegeDin(FIRI[p.nume].rezerva);
}

/* Vorbește unul: întreabă modelul și, dacă tace, ia din firea lui. Ce zice se
   scrie în fereastră, se aude deasupra capului lui în local și rămâne în firul
   discuției. Cine n-a fost întrebat de-a dreptul își ține minte și în firul lui
   ce s-a spus, ca să nu se mire când te muți la el. */
function vorbesteUnul(item) {
  const p = item.p, ce = item.ce, fir = item.fir;
  chat.asteapta = true;
  chatArata();

  AI.vorbesteCu(p, item.vorba, fir, ce, function (deLaModel) {
    let zis = deLaModel || dinFireaLui(p, ce);

    /* Și, din când în când, întoarce și el o întrebare — dar nu peste una: două
       întrebări una după alta nu se mai numesc discuție. */
    chat.deLaIntrebare++;
    if (!/\?\s*$/.test(zis) && poateTeIntreaba(ce)) {
      const inapoi = intrebareaLui(p);
      if (inapoi) {
        zis = zis + " " + inapoi;
        chat.deLaIntrebare = 0;
      }
    }

    chat.asteapta = false;
    chat.pauza = PAUZA_INTRE_VORBE;
    chat.vorbe.push({ cine: p.nume, text: zis });
    tineMinte(fir, p.nume + ": " + zis);

    const alLui = firulCu(p);
    if (alLui !== fir) {
      tineMinte(alLui, "Tu (către " + ce.cuCine + "): " + item.vorba);
      tineMinte(alLui, p.nume + ": " + zis);
    }

    // Repezeala vine peste ce tocmai a zis cel băgat, deci abia acum are ce auzi.
    const urmatorul = chat.coada[0];
    if (urmatorul && urmatorul.ce.fel === "repezit") urmatorul.vorba = zis;

    spuneCuGlasTare(p, zis);
    chatArata();
  });
}

// Îi spui ceva. Răspunsul vine de la model sau, dacă tace, din firea lui.
function iiZiciCeva(text) {
  const p = chat.cuCine;
  const vorba = String(text || "").trim();
  if (!p || !vorba || seVorbeste()) return;

  const pomeniti = pomenirile(vorba);
  const curat = faraPomenire(vorba);

  /* Ce s-a înțeles din vorba ta, o dată pentru toți cei care o aud: cum te
     cheamă, dacă te-ai prezentat; ce ai spus despre tine, dacă ai spus ceva; și
     tema, dacă se recunoaște vreuna. */
  const citit = { numeNou: numeleTau(vorba), faptNou: null, tema: citesteVorba(curat) };
  if (citit.numeNou) {
    chat.tuEsti.nume = citit.numeNou;          // te știu de-acum toți din local
  } else {
    citit.faptNou = cePariDespreTine(curat);
    if (citit.faptNou && chat.tuEsti.spus.indexOf(citit.faptNou) < 0) {
      chat.tuEsti.spus.push(citit.faptNou);
      if (chat.tuEsti.spus.length > CATE_TIN_MINTE) chat.tuEsti.spus.shift();
    }
  }

  chat.vorbe.push({ cine: "eu", text: vorba });
  tineMinte(chat.istoric, "Tu: " + curat);
  sunet.canta("poc");

  /* Cei chemați pe nume vorbesc și ei, pe rând, după cel întrebat. Dacă n-ai
     chemat pe nimeni, s-ar putea totuși să se bage cineva singur. */
  chat.coada = [];
  chat.pauza = PAUZA_INTRE_VORBE;
  /* Cei chemați aud aceeași temă, dar nu se prezintă și ei în locul celui întrebat:
     numele și mărturisirea le ia în seamă unul singur, altfel ar suna a papagali. */
  for (const altul of ceiChemati(pomeniti, p)) {
    chat.coada.push({ p: altul, vorba: curat, fir: chat.istoric,
                      ce: ceAude(altul, pomeniti, "pomenit", { tema: citit.tema }) });
  }
  if (!chat.coada.length) poateSeBagaCineva(p, curat);

  vorbesteUnul({ p: p, vorba: curat, fir: chat.istoric,
                 ce: ceAude(p, pomeniti, "intrebat", citit) });
}

/* Cine mai are de zis așteaptă un răgaz și vorbește: altfel s-ar auzi trei
   deodată și n-ai apuca să citești. Merge și cu fereastra închisă — vorbele lor
   se văd oricum, deasupra capetelor. */
function actualizeazaCoada(dt) {
  if (chat.asteapta || !chat.coada.length) return;
  chat.pauza -= dt;
  if (chat.pauza > 0) return;
  vorbesteUnul(chat.coada.shift());
}

/* Ce ți-a răspuns se aude și în local: îi apare deasupra capului, ca vorbele de
   la masa a treia. Bula e mică, deci vorbele lungi se scurtează acolo. */
function spuneCuGlasTare(p, text) {
  const scurt = text.length > 42 ? text.slice(0, 40).trim() + "…" : text;
  p.vorba = scurt;
  p.vorbaTimp = 2.6 + scurt.length * 0.05;
}

function actualizeazaVorbele(dt) {
  actualizeazaCoada(dt);
  for (const p of vorbitori()) {
    if (p.vorbaTimp > 0) p.vorbaTimp -= dt;
  }
  if (dealerul.vorbaTimp > 0 && vorbitori().indexOf(dealerul) < 0) dealerul.vorbaTimp -= dt;
}

// Bulele tuturor celor care tocmai au zis ceva, oriunde ar sta ei în local.
function deseneazaVorbeleLor() {
  for (const p of vorbitori()) {
    if (p.vorbaTimp > 0 && p.vorba) bulaDeVorba(p, p.vorba);
  }
}

/* --- Fereastra propriu-zisă ----------------------------------------------- */

/* Scena merge și fără ea: dacă paginile de HTML lipsesc (cum se întâmplă la
   teste, unde scena rulează pe o pânză falsă), vorba funcționează mai departe
   în cod, doar că n-o vede nimeni scrisă. */
const chatDom = {
  buton:   document.getElementById("chatButon"),
  panou:   document.getElementById("chat"),
  cine:    document.getElementById("chatCine"),
  vorbe:   document.getElementById("chatVorbe"),
  pomeniri: document.getElementById("chatPomeniri"),
  text:    document.getElementById("chatText"),
  form:    document.getElementById("chatForm"),
  inchide: document.getElementById("chatInchide")
};

const areFereastra = !!(chatDom.panou && chatDom.panou.classList &&
                        chatDom.vorbe && chatDom.vorbe.appendChild &&
                        chatDom.cine && chatDom.cine.appendChild);

function chatArata() {
  if (!areFereastra) return;

  chatDom.panou.classList.toggle("deschis", chat.deschis);
  if (!chat.deschis) return;

  // Lista celor din local, refăcută de fiecare dată: musafirii vin și pleacă.
  const lista = vorbitori();
  chatDom.cine.innerHTML = "";
  for (const p of lista) {
    const optiune = document.createElement("option");
    optiune.value = p.nume;
    optiune.textContent = p.nume;
    if (p === chat.cuCine) optiune.selected = true;
    chatDom.cine.appendChild(optiune);
  }

  chatDom.vorbe.innerHTML = "";
  for (const v of chat.vorbe) {
    const rand = document.createElement("p");
    rand.className = v.cine === "eu" ? "eu" : "el";
    if (v.cine === "eu") {
      // Cine a fost pomenit rămâne scris aprins, ca să se vadă pe cine ai chemat.
      rand.appendChild(document.createTextNode("Tu: "));
      let pana = 0;
      for (const pomenit of pomenirile(v.text)) {
        rand.appendChild(document.createTextNode(v.text.slice(pana, pomenit.de)));
        const numele = document.createElement("b");
        numele.textContent = pomenit.scris;
        rand.appendChild(numele);
        pana = pomenit.de + pomenit.scris.length;
      }
      rand.appendChild(document.createTextNode(v.text.slice(pana)));
    } else {
      const nume = document.createElement("b");
      nume.textContent = v.cine + ": ";
      rand.appendChild(nume);
      rand.appendChild(document.createTextNode(v.text));
    }
    chatDom.vorbe.appendChild(rand);
  }
  // Punctele stau cât mai are cineva de zis, fie că e la rând, fie că e chemat.
  if (seVorbeste()) {
    const rand = document.createElement("p");
    rand.className = "el";
    rand.textContent = "…";
    chatDom.vorbe.appendChild(rand);
  }
  chatDom.vorbe.scrollTop = chatDom.vorbe.scrollHeight;
}

/* --- Lista de pomenit ----------------------------------------------------- */

/* Cât scrii un nume după semn, se deschide o listă mică deasupra casetei. Merge
   cu mouse-ul și cu tastele; cât e deschisă, Enter alege din ea, nu trimite. */
const listaPomenirii = { deschis: false, nume: [], ales: 0 };

// Ce nume ai început să scrii sub cursor — semnul și literele de după el.
function fragmentulScris() {
  if (!chatDom.text || chatDom.text.selectionStart === undefined) return null;
  const pana = chatDom.text.value.slice(0, chatDom.text.selectionStart);
  const gasit = /(^|[\s(„"'])([@\/])([^\s@\/]{0,24})$/.exec(pana);
  if (!gasit) return null;
  return { de: pana.length - gasit[3].length - 1, scris: gasit[3] };
}

function pomeniriArata() {
  if (!chatDom.pomeniri) return;
  chatDom.pomeniri.classList.toggle("deschis", listaPomenirii.deschis);
  chatDom.pomeniri.innerHTML = "";
  if (!listaPomenirii.deschis) return;

  listaPomenirii.nume.forEach(function (nume, i) {
    const buton = document.createElement("button");
    buton.type = "button";                 // altfel ar trimite vorba, fiind în formular
    buton.textContent = nume;
    if (i === listaPomenirii.ales) buton.className = "ales";
    buton.addEventListener("mousedown", function (e) {
      e.preventDefault();                  // caseta nu are voie să piardă cursorul
      completeazaPomenirea(nume);
    });
    chatDom.pomeniri.appendChild(buton);
  });
}

function pomeniriCauta() {
  const fragment = fragmentulScris();
  listaPomenirii.nume = fragment ? potriviri(fragment.scris) : [];
  listaPomenirii.deschis = listaPomenirii.nume.length > 0;
  listaPomenirii.ales = 0;
  pomeniriArata();
}

function pomeniriInchide() {
  listaPomenirii.deschis = false;
  pomeniriArata();
}

// Numele ales intră în locul a ce apucaseși să scrii, cu semn cu tot.
function completeazaPomenirea(nume) {
  const fragment = fragmentulScris();
  if (!fragment) { pomeniriInchide(); return; }
  const tot = chatDom.text.value;
  const semn = tot[fragment.de];
  const inainte = tot.slice(0, fragment.de);
  const dupa = tot.slice(fragment.de + 1 + fragment.scris.length);
  chatDom.text.value = inainte + semn + nume + " " + dupa;
  const cursor = (inainte + semn + nume + " ").length;
  if (chatDom.text.setSelectionRange) chatDom.text.setSelectionRange(cursor, cursor);
  pomeniriInchide();
  if (chatDom.text.focus) chatDom.text.focus();
}

function legaFereastraDeVorba() {
  if (!areFereastra) return;

  chatDom.buton.addEventListener("click", function () {
    sunet.porneste();
    if (chat.deschis) inchideChat();
    else { deschideChat(null); if (chatDom.text.focus) chatDom.text.focus(); }
  });

  chatDom.inchide.addEventListener("click", inchideChat);

  chatDom.cine.addEventListener("change", function () {
    const ales = vorbitori().find(function (p) { return p.nume === chatDom.cine.value; });
    alegeVorbitorul(ales);
  });

  // Lista de pomenit se ține după ce scrii, deci se uită la fiecare literă.
  chatDom.text.addEventListener("input", pomeniriCauta);
  chatDom.text.addEventListener("click", pomeniriCauta);
  chatDom.text.addEventListener("blur", pomeniriInchide);

  chatDom.text.addEventListener("keydown", function (e) {
    if (!listaPomenirii.deschis) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const cati = listaPomenirii.nume.length;
      listaPomenirii.ales = (listaPomenirii.ales + (e.key === "ArrowDown" ? 1 : cati - 1)) % cati;
      pomeniriArata();
    } else if (e.key === "Enter" || e.key === "Tab") {
      e.preventDefault();                  // cât e lista deschisă, alege din ea
      completeazaPomenirea(listaPomenirii.nume[listaPomenirii.ales]);
    } else if (e.key === "Escape") {
      e.preventDefault();
      pomeniriInchide();
    }
  });

  chatDom.form.addEventListener("submit", function (e) {
    e.preventDefault();
    const text = chatDom.text.value;
    chatDom.text.value = "";
    pomeniriInchide();
    iiZiciCeva(text);
  });
}
